d-the-future", "transcriptUrl": "https://podscripts.co/podcasts/lennys-podcast-product-career-growth/netflix-cpto-on-ai-and-the-future-of-product-and-tech-roles-elizabeth-stone", "noteFile": "", "status": "done", "tldr": "当 PM 能写代码、设计师能写 PRD、工程师能做产品，“我的工作到底是什么”成了普遍焦虑。Stone 的答案：这是新技术必经的 storming 阶段，职能不会消失（伟大的工程/数据科学/创造力依然稀缺），但 Netflix 正在系统性地押注 systems thinker 而非窄专家，并把 AI fluency 设为全员、含最高层的“非协商项”。", "tldr_en": "With PMs shipping code, designers writing PRDs and engineers doing product, 'what is my job anymore' is the ambient anxiety. Stone's answer: this is the storming phase every transformative technology forces; functions won't die (great engineering, data science and creativity remain scarce), but Netflix is systematically betting on systems thinkers over narrow specialists, and has made AI fluency a non-negotiable for every role, up to the most senior levels.", "detail": "Stone 把当下的角色混乱定义为团队发展理论里的 storming 阶段：任何变革性技术都要先经历风暴期才能进入成形期，解法不是把 AI 塞回盒子，而是明确数据的 source of truth、生产代码的护栏、哪里信任 AI 输出哪里必须人审——并且反复重申：agent 写的代码不豁免人的责任（accountability 不可外包）。\n她的头号论点是 systems thinking 成为所有职能的第一上升技能。两个机制：其一是杠杆——平台与 paved paths 能让多数团队“80% 直接到位”，不必重造积木；其二是给 agent 搭脚手架——当 agent 跨系统工作，你不能再依赖“找到那个懂行的人”的部落知识，好实践必须被编码进铺好的路径（安全、身份权限、质量）。落到各职能：核心基础设施工程转向分布式系统与公共路径；设计转向 design systems thinking——否则就会“shipping Frankensteins”（把缝合怪推给用户）。与之配套的是招聘转向：比起五到十年前，Netflix 现在要更少的窄专家、更多的多向适应者；深钻型专家仍保留在世界上只有几个人懂的领域（编码管线、播放系统）。\n第二条主线是 AI fluency 作为“overlay”：Netflix 没有逐级改写职级阶梯，而是在全部人才标准上叠加一层 AI 流利度要求——定义刻意宽松（实验心态、知道 AI 何处有用何处无用、真的用 AI 做过东西），因为技术本身按季度甚至按月演进。它是所有角色的非协商项，包括不写代码的最高管理层；面试里也已落地——coding 面试允许用 AI 工具，因为“这就是未来工作的一部分”。\n第三条主线是她对 Netflix 文化的重新表述：excellence as an operating system。著名文化牌（高自主、高人才密度、决策下沉、快速实验、顶薪）从来不是目的本身，而是“通往卓越”的工具性信念；人才密度是不可协商的地基，风险偏好的表述是“我们不试图避免失败，我们练习快速恢复”（Live 业务是她最自豪的案例）；最反直觉的纪律是抵抗流程——“每次我们增加流程，都花了更多时间而没有得到更好的结果”。keeper test 被普遍误读为恐惧工具，她强调多数时候的答案是“我会拼命留住你”。\n此外值得留意：Netflix 收购了 Ben Affleck 创办的 InterPositive（拍摄后重打光/重构图/改台词的电影人主导型后期模型）；她本人最高频的 AI 用法不是写代码而是数据蒸馏——把几十年的实验、指标与消费者研究即时调出来；对 AI 生成代码她说了句罕见的大实话：“我知道性能更好，但我不知道为什么；它坏了我将不知道怎么修——这让我不安。”", "detail_en": "Stone frames today's role confusion as the storming phase from team-development theory: every transformative technology storms before it forms. The fix is not putting AI back in the box but clarifying source-of-truth data, production guardrails, and where AI output is trusted versus human-reviewed — while insisting that an agent writing the code does not remove the human's accountability.\nHer headline claim: systems thinking is the top rising skill across every function. Two mechanisms: leverage — platforms and paved paths get most teams '80% of the way there' so they stop reinventing building blocks; and scaffolding for agents — when agents operate across systems you can no longer rely on tribal knowledge ('find the one person who knows'), so good practice must be encoded into paved paths (security, identity, quality). Per function: core infrastructure shifts toward distributed systems and common paths; design shifts to design-systems thinking — otherwise you're 'shipping Frankensteins.' Hiring follows: fewer narrow specialists, more multi-directional generalists than 5-10 years ago, with deep specialists kept where only a few people in the world understand the domain (encoding, playback).\nSecond thread: AI fluency as an overlay. Rather than rewriting each ladder level, Netflix overlaid an AI-fluency expectation across all talent — deliberately loose in definition (experimentation mindset, knowing where AI is and isn't useful, having actually built with it) because the technology evolves by the quarter if not the month. It is the non-negotiable for all roles including the senior-most levels; coding interviews now allow AI tools 'because that's part of what the work requires now.'\nThird thread: excellence as an operating system — her reframing of the famous culture deck. High agency, talent density, decisions pushed deep, fast experiments and top-of-market pay were never ends; they are instrumental beliefs for reaching excellence. Talent density is the non-negotiable foundation; the risk posture is 'we don't try to avoid failures, we try to recover quickly' (Netflix Live is her proudest example); the most counterintuitive discipline is resisting process — 'every time we added more process, we spent more time without getting better outcomes.' The keeper test, widely misread as a fear instrument, mostly ends with 'I would fight so hard to keep you.'\nAlso notable: Netflix acquired InterPositive, the Ben Affleck-founded company whose models relight, reframe, and change dialogue after shooting (filmmaker-led post-production); her own heaviest AI use is not code but data distillation — surfacing decades of experiments, metrics and consumer research instantly; and her candid admission on AI-written code: 'I know I'm getting better performance from this, but I have no idea why. And if this thing breaks, I'm going to have no idea how to fix it. That makes me uncomfortable.'", "points": ["角色混乱被定义为 storming 阶段：变革性技术必先风暴后成形；解法是护栏与问责清晰化，而不是把 AI 塞回盒子——agent 写代码不豁免人的责任。", "systems thinking 是第一上升技能，机制有二：平台/paved paths 让团队“80% 直接到位”；agent 跨系统工作需要把好实践编码进路径，部落知识失效。", "招聘风向：比 5-10 年前要更少窄专家、更多多向适应的通才；深钻专家only保留在全球仅几人懂的领域（编码管线、播放系统），且仍须保持探索心态。", "AI fluency 是叠加在全部职级上的 overlay 而非某一级的要求：定义刻意宽松（实验心态+知道边界+真做过），是包括最高层在内所有角色的非协商项；coding 面试已允许用 AI。", "excellence as an operating system：文化牌是工具性信念而非目的；人才密度是不可协商的地基；“我们不避免失败，我们练习快速恢复”（Live 是最自豪案例）。", "反流程纪律：“每次增加流程，都花了更多时间而没有更好的结果”——最好的人要的是 blameless retro 和个人责任，不是检查清单和关卡。", "keeper test 的真相：多数时候答案是“我会拼命留住你”——它同时是反馈卫生、艰难对话的强制函数与保留/认可机制。", "设计并未死亡：对最重要的优先级，深设计仍是 Netflix 的差异化——警惕不同设计语言拼出的“Frankensteins”；design systems thinking 是设计职能的新形态。", "两个具体动向：收购 Ben Affleck 创办的 InterPositive（拍后重打光/重构图/改台词）；她本人最高频 AI 用法是数据蒸馏，而非写代码。"], "points_en": ["Role confusion is the storming phase: transformative tech storms before it forms; the fix is guardrails and clear accountability, not boxing AI back up — an agent writing code doesn't remove human responsibility.", "Systems thinking is the top rising skill, via two mechanisms: platforms/paved paths get teams '80% of the way there'; agents working across systems require encoding good practice into paths — tribal knowledge fails.", "Hiring shift: fewer narrow specialists, more multi-directional generalists than 5-10 years ago; deep specialists remain only where a handful of people in the world understand the domain (encoding, playback).", "AI fluency is an overlay across all levels, not a ladder rung: deliberately loose (experimentation mindset + knowing the boundaries + having built with it); non-negotiable for every role including the most senior; coding interviews now allow AI tools.", "Excellence as an operating system: the culture deck is instrumental, not the goal; talent density is the non-negotiable foundation; 'we don't try to avoid failures, we try to recover quickly' (Live is her proudest case).", "Anti-process discipline: 'every time we added more process, we spent more time without getting better outcomes' — the best people want blameless retros and personal responsibility, not checklists and gates.", "The keeper test's reality: the lion's share of answers is 'I would fight so hard to keep you' — it's feedback hygiene, a forcing function for hard conversations, and a retention mechanism.", "Design isn't dead: for top priorities deep design remains Netflix's differentiation — beware 'shipping Frankensteins' of mixed design languages; design-systems thinking is the craft's new shape.", "Two concrete moves: the acquisition of Ben Affleck's InterPositive (relight/reframe/change dialogue after shooting); her own heaviest AI use is data distillation, not code."], "takeaways": ["把自己往 systems thinker 方向重构：她给的小技巧是每个问题“往外退一格”，问自己在更大系统里假设了什么；以及“我怎么做我的工作能帮我上级做他的工作”。", "给自己设 AI fluency 的 overlay 标准：实验心态、清楚 AI 边界、拿得出真用 AI 做成的东西——不管你在哪个职级、写不写代码。", "管理者可以直接偷走的两句话：“人才密度是非协商项”与“不加流程、练习快速恢复”——流程是卓越的税，不是保险。", "职业防御性来自稀缺的 craft 而非头衔：伟大的工程、数据科学与创造力依然稀缺——AI 淘汰的是平庸执行，不是深功夫。"], "takeaways_en": ["Rebuild yourself toward systems thinking: her tactic — step out one click on every problem and ask what you're assuming about the broader system; and 'how can I do my job in a way that helps my manager do theirs.'", "Set your own AI-fluency overlay: experimentation mindset, knowing AI's boundaries, and shipped things actually built with AI — regardless of level or whether you write code.", "Two lines managers can steal outright: 'talent density is the non-negotiable' and 'don't add process, practice fast recovery' — process is a tax on excellence, not insurance.", "Career defensibility comes from scarce craft, not titles: great engineering, data science and creativity remain scarce — AI displaces mediocre execution, not deep skill."], "quotes": ["I still find great engineering to be scarce, great data science to be scarce, great creativity to be scarce. —— 我依然发现伟大的工程稀缺、伟大的数据科学稀缺、伟大的创造力稀缺。（Elizabeth Stone）", "The talent density is the non-negotiable. You have to start with that. —— 人才密度是非协商项，一切必须从它开始。（Elizabeth Stone）", "I know I'm getting better performance from this, but I have no idea why. And if this thing breaks, I'm going to have no idea how to fix it. That makes me uncomfortable. —— 我知道它性能更好，但我不知道为什么；它要是坏了我不知道怎么修——这让我不安。（Elizabeth Stone，谈 AI 生成的代码）"], "quotes_en": ["I still find great engineering to be scarce, great data science to be scarce, great creativity to be scarce. (Elizabeth Stone)", "The talent density is the non-negotiable. You have to start with that. (Elizabeth Stone)", "I know I'm getting better performance from this, but I have no idea why. And if this thing breaks, I'm going to have no idea how to fix it. That makes me uncomfortable. (Elizabeth Stone, on AI-written code)"], "data": ["发布于 2026-07-19，时长约 72 分钟；她两年半前的首次做客长期是 Lenny's 第二受欢迎单集（仅次于 Brian Chesky）。", "平台杠杆量化：paved paths 能让多数团队“80% 直接到位”。", "Netflix 收购 InterPositive——Ben Affleck 创办，拍摄后可重打光、重构图、重拍、改台词的电影人主导型后期模型公司。", "组织变化坐标：Netflix 直到近年才引入正式职级阶梯；新毕业生与实习生项目也是“几年前才有”，此前只招成熟人才。", "历史锚点：Netflix Prize（约 100 万美元悬赏改进推荐算法）被引为 Netflix AI 基因的起点。"], "data_en": ["Published 2026-07-19, ~72 minutes; her first appearance 2.5 years ago was long Lenny's #2 most-popular episode (behind Brian Chesky).", "Platform leverage, quantified: paved paths get most teams '80% of the way there.'", "Netflix acquired InterPositive — founded by Ben Affleck; filmmaker-led models that relight, reframe, reshoot and change dialogue after shooting.", "Org markers: Netflix added formal career ladders only recently; new-grad and intern programs are just a few years old — previously experienced hires only.", "Historical anchor: the Netflix Prize (~$1M contest to improve the recommendation algorithm) cited as the origin of Netflix's AI DNA."], "note": ""}, {"id": "2026-07-16-timferriss-875-random-show-kevin-rose", "podcast": "The Tim Ferriss Show", "tier": "A", "category": "人物访谈", "title": "#875 The Random Show — Retreats, Mortality, AI Predictions, Rock Climbing at (Almost) 50, and Not Waiting for 'Someday'", "title_en": "#875 The Random Show — Retreats, Mortality, AI Predictions, Rock Climbing at (Almost) 50, and Not Waiting for 'Someday'", "guest": "Kevin Rose（Digg/True Ventures，连续创业者与投资人）", "guest_en": "Kevin Rose (Digg / True Ventures, serial entrepreneur and investor)", "host": "Tim Ferriss", "host_en": "Tim Ferriss", "date": "2026-07-16", "durationMin": 115, "worthScore": 3, "worthReason": "老友闲谈体、信息密度不均，但有几段真东西：Om Malik 离世引出的“悲伤即爱”、MM120（LSD）三期焦虑试验的剂量数据、挪威 4×4 与海马体、以及两人用 AI 审计自我叙事的实操。有官方全文逐字稿。", "worthReason_en": "A loose two-friends format with uneven density, but real substance in patches: grief-as-love after Om Malik's passing, dose data from the MM120 (LSD) Phase 3 GAD trial, Norwegian 4x4 and the hippocampus, and their hands-on use of AI to audit self-narratives. Official full transcript available.", "originalUrl": "https://tim.blog/2026/07/16/the-random-show/", "transcriptUrl": "https://tim.blog/2026/07/16/the-random-show-transcript/", "noteFile": "", "status": "done", "tldr": "一杯龙舌兰下的年度盘点：Kevin 在禅修闭关中得知挚友 Om Malik 离世，两人把悲伤讲成“爱的另一面”；由此推到“别再说 someday”——Tim 宣布 50 岁前要去优胜美地爬多段线路。硬信息集中在健康区：MM120（LSD）三期焦虑试验 100μg 即最小有效剂量、挪威 4×4 对海马体的长期改变、外源性酮体让痴呆亲属 20 分钟内语句长度翻五倍的个人观察。", "tldr_en": "An annual stocktake over tequila: Kevin learned of Om Malik's death mid-silent-retreat, and the two frame grief as the other face of love — leading to 'stop saying someday' (Tim commits to multi-pitch climbing in Yosemite before 50). The hard information clusters in health: 100 micrograms as the minimum effective dose in the MM120 (LSD) Phase 3 GAD trial, the Norwegian 4x4's durable hippocampal changes, and Tim's observation of exogenous ketones quintupling sentence length in relatives with dementia within 20 minutes.", "detail": "情感主线从死亡开始：Kevin 在新墨西哥州的五日止语禅修中得知 Om Malik（True Ventures 圈内挚友、著名科技写作者）离世，出关才知道消息。他把丧失讲成一个罕见清晰的框架：“Om 走后我感到剧烈的失落与悲伤，但我意识到那个缺口就是爱——如果不是深爱这个人，根本不会有这个洞。”两人由此谈到 Tim Urban 的《The Tail End》：到高中毕业时你已用掉与父母相处总时数的约 90-95%——这直接改变了 Tim 安排家庭旅行的方式。结论落在行动上：“别再骗自己说 one day”——Kevin 要开始日本木工，Tim 公布了 50 岁前在优胜美地完成多段攀登的目标（尽管恐高，右肘术后限制了他 15 年）。\n健康与科学区是本期硬通货。其一，MM120：2025 年 9 月 JAMA 发表的 Lysergide 治疗广泛性焦虑障碍的随机对照试验（Definium/前 MindMed 赞助，五臂：安慰剂/25/50/100/200μg），HAM-A 随访 12 周呈剂量依赖改善，100μg 与 200μg 几乎等效——即最小有效剂量约为一个“标准剂量”的 LSD；Kevin 当场发现试验就在两人老友 Adam Gazzaley 的 UCSF Neuroscape 实验室做的。Tim 借此公开自己被临床诊断过 GAD 与强迫症。其二，运动与大脑：引 Tommy Wood 的说法，挪威 4×4（4 分钟高强度/3 分钟恢复×4，每周约 3 次，坚持 5-6 个月）带来的海马体体积改变可维持长达 5 年。其三，外源性酮体：deltaG（BHB 结合 1,3-丁二醇）——Tim 称给患痴呆的亲属服用后 20 分钟内“语句长度翻了五倍、言语更敏锐”，同时提醒 1,3-丁二醇对老人平衡与跌倒风险的担忧。此段属个人观察与单臂轶事，须批判性看待。\nAI 区两人都拿出了实货。Kevin 的 AI 之家：约 200 美元一只的 Ubiquiti 摄像头+开放 API+用 Claude 写胶水代码——人脸/人形识别播报访客、逗留超 30 秒自动喊话驱离、看球时识别他戴的队帽播报比分、车牌识别自动开门。Tim 的用法更内省：用 Claude Code 接 Gmail API 复盘自己 20 年天使投资史——哪些 intro 是他做的、哪些错过的 deal 后来成了——用硬数据校准自我叙事；他最推荐的 prompt 是让有跨对话记忆的模型回答“你觉得我接下来五年该做什么？给我 3-5 条有回报的探索路径”，得到的答案“出乎意料地好”。Kevin 补充了一个可穿戴的发现：AI 记录显示你以为的自己与实际言行大约有 20% 的偏差。\n取材说明：官方全文逐字稿存在；本卡片引语均出自逐字稿。抓取版本在约 1:20 后截断，show notes 中“let your winners run / buy the company not the product / Digg 重启”等后段话题未纳入展开，避免无稿转述。", "detail_en": "The emotional spine starts with death: Kevin learned of Om Malik's passing (a close friend via True Ventures and a celebrated tech writer) only after finishing a five-day silent retreat in New Mexico. His framing of loss is unusually clean: the gap left behind is love itself — you wouldn't have the hole if you hadn't loved the man. That leads to Tim Urban's 'The Tail End' — by high-school graduation you've used ~90-95% of the total hours you'll ever spend with your parents — which changed how Tim schedules family trips. The conclusion is action: stop saying 'one day.' Kevin commits to Japanese woodworking; Tim announces a goal of multi-pitch climbing in Yosemite before 50, despite a fear of heights and an elbow that limited him for 15 years.\nThe health-science block is the episode's hard currency. First, MM120: the September 2025 JAMA randomized trial of lysergide for generalized anxiety disorder (sponsored by Definium, formerly MindMed; five arms — placebo/25/50/100/200 micrograms) showed dose-dependent HAM-A improvement out to 12 weeks, with 100 and 200 micrograms nearly equivalent — i.e., the minimum effective dose is about one standard 'hit' of LSD. Kevin realizes mid-conversation the trial ran at their friend Adam Gazzaley's UCSF Neuroscape lab. Tim discloses his own clinical GAD and OCD diagnoses. Second, exercise and the brain: per Tommy Wood, the Norwegian 4x4 (4 min hard / 3 min easy x4, ~3x/week for 5-6 months) produces hippocampal volumetric changes lasting up to five years. Third, exogenous ketones: deltaG (BHB bonded to 1,3-butanediol) — Tim says relatives with dementia '5Xed' their sentence length within 20 minutes, while flagging fall-risk concerns of 1,3-butanediol in the elderly. This is personal anecdote, to be read critically.\nBoth bring real goods on AI. Kevin's AI home: ~$200 Ubiquiti cameras + open APIs + Claude-written glue code — face/person recognition announcing visitors, auto voice warnings for loiterers beyond 30 seconds, sports scores read aloud when he walks in wearing a team hat during a game, license-plate recognition opening the gate. Tim's use is more introspective: Claude Code plus the Gmail API to audit his 20 years of angel investing — which intros he made, which passed deals later won — testing his self-narrative against hard data; his favorite prompt asks a memory-enabled model 'what should I do in the next five years — give me 3-5 rewarding paths,' with 'outstanding' results. Kevin adds a wearable finding: AI logs show your self-image runs ~20% off from what you actually said and did.\nSourcing: the official full transcript exists and all quotes here are from it. The fetched copy truncates around 1:20, so later show-notes topics (let your winners run / buy the company not the product / the Digg relaunch) are not expanded here to avoid unsourced paraphrase.", "points": ["悲伤的重新定义：Kevin 在五日止语闭关中得知 Om Malik 离世——“那个缺口就是爱”；悼念与感恩可以是同一个动作。", "《The Tail End》的算术：到高中毕业你已用掉与父母相处总时数的约 90-95%——把“陪父母”从情绪题变成日程题。", "别再说 someday：Kevin 启动日本木工；Tim 公布 50 岁前优胜美地多段攀登目标（恐高+右肘术后 15 年限制之下）——用具体承诺替代模糊愿望。", "MM120 三期数据（JAMA 2025.9）：五臂 RCT，HAM-A 12 周剂量依赖改善，100μg≈200μg——最小有效剂量约一个标准 LSD 剂量；试验在 UCSF Neuroscape（Adam Gazzaley 实验室）进行；Tim 借此公开 GAD+OCD 诊断。", "挪威 4×4 与大脑：4 分钟高强/3 分钟恢复×4、每周 3 次、5-6 个月——海马体体积改变可持续至多 5 年（引 Tommy Wood）。", "deltaG 外源性酮体的个人观察：痴呆亲属服后 20 分钟语句长度约翻五倍；但 1,3-丁二醇的肝毒争议与老人跌倒风险需警惕——属轶事证据，须批判看待。", "Kevin 的 AI 之家：200 美元级 Ubiquiti 摄像头+Claude 写胶水代码=人脸播报/驱离逗留者/戴帽播比分/车牌开门——消费级硬件即可实现。", "Tim 的 AI 自我审计：Claude Code+Gmail API 复盘 20 年天使投资，用数据校准自我叙事；可穿戴记录显示自我认知与实际言行偏差约 20%。", "禅修技术细节：Kevin 参的公案是“无”（Mu）；他描述的微开悟是约 2 秒的“无所欠缺感”——不是情绪，而是一种稳定的存在状态。"], "points_en": ["Grief redefined: Kevin learned of Om Malik's death mid-silent-retreat — 'that gap is just love'; mourning and gratitude can be the same act.", "The Tail End arithmetic: by high-school graduation you've spent ~90-95% of your lifetime hours with your parents — turning 'see your parents' from sentiment into scheduling.", "Stop saying someday: Kevin starts Japanese woodworking; Tim commits to multi-pitch Yosemite climbing before 50 (despite fear of heights and a 15-year elbow limitation) — concrete commitments over vague wishes.", "MM120 Phase 3 data (JAMA, Sep 2025): five-arm RCT, dose-dependent HAM-A improvement at 12 weeks, 100ug ~= 200ug — minimum effective dose is about one standard LSD hit; run at UCSF Neuroscape (Adam Gazzaley's lab); Tim discloses his GAD+OCD diagnoses.", "Norwegian 4x4 and the brain: 4 min hard / 3 min easy x4, 3x/week for 5-6 months — hippocampal changes lasting up to 5 years (per Tommy Wood).", "deltaG exogenous ketones, personal observation: dementia relatives' sentence length ~5x within 20 minutes; but 1,3-butanediol liver debate and elderly fall risk warrant caution — anecdotal evidence.", "Kevin's AI home: $200-class Ubiquiti cameras + Claude glue code = face announcements, loiterer warnings, hat-triggered sports scores, license-plate gate opening — all consumer-grade.", "Tim's AI self-audit: Claude Code + Gmail API to review 20 years of angel investing, calibrating self-narrative with data; wearable logs show ~20% gap between self-image and actual words/deeds.", "Zen specifics: Kevin's koan is Mu; his micro-insight was ~2 seconds of 'nothing lacking' — not an emotion but a steady state of being."], "takeaways": ["把“someday 清单”变成日期清单：选一件你说了五年的事，本季度给它排上第一次练习/第一次预订。", "用 AI 审计而非安慰自己：把邮件、决策记录喂给模型问“我错过了什么模式”，自我叙事与事实的 20% 偏差值得每年校一次。", "父母时间做算术题：按《The Tail End》计算你剩余的相处小时数，然后把它变成机票和日历块。", "对健康轶事保持双轨态度：MM120 是有对照的三期数据、酮体逆转痴呆语言是 n=几 的家庭观察——学会区分证据等级再行动。"], "takeaways_en": ["Turn your someday list into a dated list: pick one thing you've said for five years and schedule its first session this quarter.", "Audit yourself with AI instead of consoling yourself: feed emails and decision logs to a model and ask what patterns you missed — the ~20% narrative gap deserves an annual calibration.", "Do the arithmetic on parent time: compute your remaining shared hours per The Tail End, then convert them into flights and calendar blocks.", "Hold health anecdotes to a two-track standard: MM120 is controlled Phase 3 data; ketones-reversing-dementia-speech is an n-of-a-few family observation — grade the evidence before acting."], "quotes": ["When Om passed, what I felt was a severe sense of loss and sorrow and sadness. But I realized that that gap is just love, at the end of the day. —— Om 走后我感到剧烈的失落与悲伤，但我意识到，那个缺口说到底就是爱。（Kevin Rose）", "I want to stop bullshitting myself and stop saying like, 'Hey, one day.' —— 我想停止骗自己，别再说“嘿，总有一天”。（Kevin Rose）", "Doing something well does not make it important or worth doing in the first place. —— 把一件事做好，并不能使它变得重要、或本来就值得做。（Tim Ferriss）"], "quotes_en": ["When Om passed, what I felt was a severe sense of loss and sorrow and sadness. But I realized that that gap is just love, at the end of the day. (Kevin Rose)", "I want to stop bullshitting myself and stop saying like, 'Hey, one day.' (Kevin Rose)", "Doing something well does not make it important or worth doing in the first place. (Tim Ferriss)"], "data": ["MM120（Lysergide）RCT：JAMA 2025 年 9 月发表，五臂（安慰剂/25/50/100/200μg），HAM-A 随访 12 周，100μg 与 200μg 几乎等效；由 Definium（前 MindMed）赞助，在 UCSF Neuroscape 进行。", "挪威 4×4：每周约 3 次、持续 5-6 个月，海马体等区域的体积改变可持续至多 5 年（引 Tommy Wood）。", "deltaG=BHB 结合 1,3-丁二醇；Tim 观察痴呆亲属服后 20 分钟内语句长度约 5 倍（轶事证据）。", "Kevin 的 AI 之家：Ubiquiti 摄像头约 200 美元/只；逗留超 30 秒触发语音警告；车牌识别自动开门。", "《The Tail End》：到高中毕业已用掉与父母相处总时数的约 90-95%；Kevin Rose 现年 49 岁。"], "data_en": ["MM120 (lysergide) RCT: JAMA, Sep 2025; five arms (placebo/25/50/100/200ug); HAM-A followed to 12 weeks; 100ug ~= 200ug; sponsored by Definium (ex-MindMed), run at UCSF Neuroscape.", "Norwegian 4x4: ~3x/week for 5-6 months; hippocampal volumetric changes persist up to 5 years (per Tommy Wood).", "deltaG = BHB bonded to 1,3-butanediol; Tim observed ~5x sentence length in dementia relatives within 20 minutes (anecdotal).", "Kevin's AI home: Ubiquiti cameras ~$200 each; >30-second loitering triggers voice warnings; license-plate recognition opens the gate.", "The Tail End: ~90-95% of lifetime parent hours used by high-school graduation; Kevin Rose is 49."], "note": ""}, {"id": "2026-07-20-trainingdata-e94-anthropic-platform", "podcast": "Training Data (Sequoia)", "tier": "A", "category": "科技/AI", "title": "Anthropic's Katelyn Lesse & Angela Jiang: Building an Ecosystem, not a Walled Garden [E94]", "title_en": "Anthropic's Katelyn Lesse & Angela Jiang: Building an Ecosystem, not a Walled Garden [E94]", "guest": "Katelyn Lesse & Angela Jiang（Anthropic 开发者平台负责人）", "guest_en": "Katelyn Lesse & Angela Jiang (leads of Anthropic's developer platform)", "host": "Sonya Huang & Lauren Reeder（红杉合伙人）", "host_en": "Sonya Huang & Lauren Reeder (Sequoia partners)", "date": "2026-07-20", "durationMin": null, "worthScore": 4, "worthReason": "Anthropic 平台一号位首次系统讲出“知识-执行-协调”三层抽象与“给 token 分配工作”的 strategies 概念，是理解 agent 基础设施走向的一手路线图；官方全文逐字稿可核。与同日 Odd Lots×Cherny 互为表里。", "worthReason_en": "Anthropic's platform leads lay out, for the first time systematically, the knowledge-execution-coordination stack and 'strategies' (giving tokens jobs) — a first-hand roadmap of where agent infrastructure is heading; official full transcript. The other half of the same-day Odd Lots x Cherny story.", "originalUrl": "https://sequoiacap.com/podcast/anthropics-katelyn-lesse-angela-jiang-building-an-ecosystem-not-a-walled-garden/", "transcriptUrl": "https://sequoiacap.com/podcast/anthropics-katelyn-lesse-angela-jiang-building-an-ecosystem-not-a-walled-garden/", "noteFile": "", "status": "done", "tldr": "Anthropic 平台团队把开发者平台讲成三层蛋糕：知识层（Messages API/工具/skills/memory）→执行层（低阶 harness+托管基础设施，产品即 Claude Managed Agents）→协调层（strategies：给每个 token 分配不同工作——建议/执行/反思/记忆）。生态哲学：不执着于拥有技术栈（skills 与 MCP 直接送给全行业），唯一守住的是模型路由——harness 应该为一个模型家族调优。类比是电力：变革性在于人人可接入，没有一家公司能独自铺完电网。", "tldr_en": "Anthropic's platform team frames the developer platform as a three-layer cake: knowledge (Messages API/tools/skills/memory) -> execution (low-level harness + managed infra; the product is Claude Managed Agents) -> coordination (strategies: giving each token a different job — advising/executing/reflecting/memory). Ecosystem philosophy: not precious about owning the stack (skills and MCP are handed to the whole industry); the one closed piece is model routing — harnesses should be tuned to one model family. The metaphor is electricity: transformative because everyone can plug in, and no one wires it alone.", "detail": "本集是理解 2026 年 agent 基础设施格局的一手文本。Angela Jiang 给出的三层抽象是全集骨架：最底层是“知识”——关于模型的知识与模型需要的知识（Messages API 的参数形状、标准化的工具、skills 与 memory 等上下文注入点）；中间是“执行”——当模型从回答问题变成完成工作（编辑多系统文件、长程运行、无人值守），需要低阶 harness+托管基础设施（沙箱的生成与回收、会话存储与恢复、prompt caching、上下文管理），当前的产品形态是 Claude Managed Agents；最上层是“协调”——strategies（元 harness）：token 不是同质的，要给每个 token 分配不同工作——这个 token 在建议、那个在执行、另一个在反思过往会话并把经验写入 memory，或由大模型指导小模型执行、由 grader 判定重做。她明确说：看我们的路线图，就是从知识层一路向协调层迁移。\n开放与封闭的边界划得异常清楚：他们“不执着于”基础设施归属——自托管沙箱已与 Modal、Vercel、Cloudflare 乃至 Amazon micro VMs 打通，MCP tunnels 允许穿透防火墙调用自家 MCP 服务器；skills 与 MCP 作为标准直接送给全行业，甚至帮助非 Claude 的 agent 互操作（客户把自家 agent 暴露成 MCP server 让另一个 agent 调用，官方答复是“完全可以”）。唯一守住的是模型路由：harness 应该为一个模型家族调优，而不是跨模型路由——Vercel 的 Harness Agent 被引为行业同向证据。\n几个具体判断值得记录：任务专用 harness 有必要——法律/金融这类验证密集领域，模型与执行之间的错误处理逻辑是产品差异所在；“上下文那部分其实被过度渲染了”——任何 harness 都能吞大量上下文，真正的 alpha 在高阶策略如 best-of-N（第三根杠杆，收益超预期但工程上“非常难”，平台的任务就是把它变容易）；对 token 成本焦虑（token rationalization 时代）的建议不是设上限，而是按任务复杂度路由+用更聪明的策略在更低成本内达成同样结果。Claude Tag 被当作案例：形态只是 Slack 里 @ 一下，真正的产品是水面下的组织级 harness（Karpathy 语）与上下文工程。\n收录说明：Training Data 为本库新增频道（红杉出品，全部单集配官方全文 transcript，嘉宾为一线 AI 构建者，过硬门槛），列 Tier A。本集与同日 Odd Lots×Boris Cherny 构成同一故事的两面：一个讲 harness 的产品与人，一个讲 harness 之上的平台与生态。", "detail_en": "This episode is a primary text for understanding the 2026 agent-infrastructure landscape. Angela Jiang's three-layer abstraction is the skeleton: at the bottom, knowledge — knowledge about the model and what it needs (the Messages API's parameter shapes, standardized tools, skills and memory as context-injection points); in the middle, execution — when models go from answering to doing work (editing files across systems, long-running, unattended), you need a low-level harness plus managed infrastructure (sandbox spawn/teardown, session storage and resume, prompt caching, context management), productized today as Claude Managed Agents; on top, coordination — strategies (meta-harnesses): tokens aren't fungible, so give each a job — this one advises, that one executes, another reflects on past sessions and writes learnings to memory; a big model advises a small executor; a grader forces retries. She says it plainly: read our roadmap as a migration from knowledge to execution to coordination.\nThe open/closed boundary is unusually crisp: they are 'not precious' about owning infrastructure — self-hosted sandboxes integrate with Modal, Vercel, Cloudflare and Amazon's micro VMs; MCP tunnels punch through firewalls; skills and MCP are given to the whole industry, and they actively help non-Claude agents interoperate (a customer exposing an agent as an MCP server for another agent to call got 'yeah, totally'). The one closed piece is model routing: harnesses should be tuned to a model family, not route across models — Vercel's Harness Agent cited as the industry moving the same way.\nSpecific judgments worth recording: task-specific harnesses are real — in verification-heavy domains like legal and finance, the error-handling logic between model and execution is where products differentiate; 'the context bit is actually a little overdone' — any harness can swallow context; the alpha is in higher-order strategies like best-of-N (the third lever, outsized returns but 'really freaking hard' to productionize — the platform's job is to make it easy); on token-cost anxiety (the token-rationalization era), don't cap usage — route by task complexity and reach the same outcome cheaper with smarter strategies. Claude Tag is the case study: the form factor is just @-ing in Slack; the product is the underwater org-level harness (Karpathy's phrase) and context engineering.\nCollection note: Training Data is a new channel for this library (Sequoia-produced, official full transcripts on every episode, frontline AI builders as guests — passes the gate), listed Tier A. With the same-day Odd Lots x Boris Cherny episode it forms two sides of one story: the product and person of the harness, and the platform and ecosystem above it.", "points": ["三层蛋糕是理解 Anthropic 平台路线图的钥匙：知识（API/工具/skills/memory）→执行（低阶 harness+托管基础设施=Claude Managed Agents）→协调（strategies/元 harness）；路线图就是逐层上移。", "strategies 的核心洞见：token 不是同质的，要“给 token 分配工作”——建议/执行/反思/写 memory/大模型指导小模型/grader 判定重做；这是 harness 之后的下一个抽象层。", "开放到什么程度：自托管沙箱对接 Modal/Vercel/Cloudflare/Amazon micro VMs；MCP tunnels 穿防火墙；skills 与 MCP 送给全行业；甚至支持客户把 agent 暴露成 MCP server 供其他家 agent 调用。", "唯一的封闭点是模型路由：harness 应为一个模型家族调优而非跨模型路由——Vercel Harness Agent 被引为行业同向。", "任务专用 harness 有必要：法律/金融等验证密集领域，模型与执行之间的错误处理逻辑是产品差异所在；而“上下文被过度渲染”——alpha 在高阶策略。", "best-of-N 是被低估的第三根杠杆（前两根是换更大模型、跑更久）：收益超预期但生产化“非常难”，平台的使命是把难的事变成容易的。", "token rationalization 时代的正确姿势：不要设上限扼杀创新，而是按任务复杂度路由——难任务给大模型、简单任务给便宜模型，用策略在更低成本达成同样结果。", "Claude Tag 案例：界面只是 Slack @ 一下，产品是水下的组织级 harness（Karpathy 语）与上下文工程——界面可换（Teams/WhatsApp/邮件），agent 将占据人类占据过的协作形态。", "模型正在吃掉旧脚手架：两年前 harness 是“扶着模型从 A 到 B 的墙”，现在模型足够可控、该删掉转向类脚手架——harness 的新职责是让模型跑得更久，而非扶它走直线。"], "points_en": ["The three-layer cake is the key to Anthropic's platform roadmap: knowledge (API/tools/skills/memory) -> execution (low-level harness + managed infra = Claude Managed Agents) -> coordination (strategies/meta-harness); the roadmap is a climb up the layers.", "The core insight of strategies: tokens aren't fungible — give tokens jobs: advising/executing/reflecting/writing memory/big-model-advises-small/grader-forces-retry. This is the next abstraction after the harness.", "How open: self-hosted sandboxes integrate Modal/Vercel/Cloudflare/Amazon micro VMs; MCP tunnels punch firewalls; skills and MCP are given to the industry; customers can expose agents as MCP servers for other vendors' agents to call.", "The single closed piece is model routing: harnesses should be tuned to one model family, not route across models — Vercel's Harness Agent cited as the industry converging.", "Task-specific harnesses are legitimate: in verification-heavy domains (legal, finance) the error-handling logic between model and execution is the product differentiator; meanwhile 'the context bit is overdone' — alpha lives in higher-order strategies.", "Best-of-N is the underrated third lever (after bigger model, longer runs): outsized returns but 'really freaking hard' to productionize — the platform's mission is making the hard easy.", "The right posture for the token-rationalization era: don't cap usage and kill innovation — route by task complexity: hard tasks to big models, easy ones to cheap models, same outcome at lower cost via strategies.", "The Claude Tag case: the interface is just @-ing in Slack; the product is the underwater org-level harness (Karpathy) and context engineering — interfaces are swappable (Teams/WhatsApp/email); agents will occupy the collaboration form factors humans occupy.", "Models are eating the old scaffolding: two years ago harnesses were walls guiding the model from A to B; models are now steerable enough to delete steering scaffolds — the harness's new job is letting the model run longer, not walking it in a straight line."], "takeaways": ["评估 AI 基础设施公司时用三层框架定位：它卖的是知识层（API 套壳）、执行层（harness+infra）还是协调层（策略）？越往上越接近未来的 alpha。", "自己用 AI 也该学会“给 token 分工”：别用一个会话做所有事——让一个负责规划、一个执行、一个校验，成本相同、产出显著更好。", "记住“上下文被过度渲染”这句话：堆上下文不构成壁垒，独占数据+验证逻辑+策略设计才是。", "职业信号：Anthropic 把“把难的事变容易”定义为平台使命——凡是今天“非常难但收益超预期”的工程（如 best-of-N 生产化），都是未来两年的岗位与创业机会所在。"], "takeaways_en": ["Use the three-layer frame to place any AI-infra company: is it selling knowledge (API wrappers), execution (harness+infra) or coordination (strategies)? The higher, the closer to future alpha.", "Learn to give tokens jobs in your own AI use: don't run everything in one session — one plans, one executes, one verifies; same cost, markedly better output.", "Remember 'the context bit is overdone': piling in context isn't a moat; proprietary data + verification logic + strategy design are.", "Career signal: Anthropic defines the platform's mission as making hard things easy — whatever is 'really hard but outsized-return' today (e.g., productionizing best-of-N) is where jobs and startups will be for the next two years."], "quotes": ["You have knowledge, then you have execution, then you have coordination... it's almost like a meta harness. —— 先有知识层，然后是执行层，再往上是协调层……它几乎是一个元 harness。（Angela Jiang）", "It's a little bit like electricity... the reason why it's such a transformative technology is because you can actually wire it into everything. That's not something that anybody can do by themselves. —— 这有点像电力……它之所以是变革性技术，是因为你能把它接进一切。而这不是任何一家能独自做到的事。（Angela Jiang）", "We have a strong belief that harnesses and the agentic layer should be tuned to the model family you use it with. —— 我们坚信 harness 与 agent 层应该为你所用的模型家族调优。（Katelyn Lesse）"], "quotes_en": ["You have knowledge, then you have execution, then you have coordination... it's almost like a meta harness. (Angela Jiang)", "It's a little bit like electricity... the reason why it's such a transformative technology is because you can actually wire it into everything. That's not something that anybody can do by themselves. (Angela Jiang)", "We have a strong belief that harnesses and the agentic layer should be tuned to the model family you use it with. (Katelyn Lesse)"], "data": ["Training Data 第 94 期，页面更新时间 2026-07-20；红杉官网提供全文 transcript 与视频。", "自托管沙箱合作方：Modal、Vercel、Cloudflare、Amazon micro VMs；另有 MCP tunnels 穿透防火墙调用自有 MCP 服务器。", "一年前 Anthropic 平台“基本上只是 Messages API”（Katelyn 入职时点），一年内长出执行层与协调层雏形。", "内部策略“工作”种类现约 5 种；开放给生态后预计组合可达十万级（Angela 的量级估算）。", "行业旁证：Vercel 推出 Harness Agent——整套 harness+agent 绑定模型家族接入，与 Anthropic 的“为模型家族调优”判断同向。"], "data_en": ["Training Data episode 94; page updated 2026-07-20; full transcript and video on Sequoia's site.", "Self-hosted sandbox partners: Modal, Vercel, Cloudflare, Amazon micro VMs; plus MCP tunnels to reach MCP servers behind firewalls.", "A year ago the platform 'was basically just the Messages API' (when Katelyn joined); execution and early coordination layers grew within a year.", "About 5 internal token 'jobs' today; opened to the ecosystem, combinations could reach the hundred-thousands (Angela's order-of-magnitude estimate).", "Industry corroboration: Vercel's Harness Agent ships whole harness+agent tied to a model family — same direction as Anthropic's 'tune to the model family' thesis."], "note": ""}, {"id": "2026-07-21-iltb-ep483-matthew-smith-gas-crisis", "podcast": "Invest Like the Best", "tier": "S", "category": "财经/投资", "title": "America's Next Energy Crisis（EP.483）", "title_en": "America's Next Energy Crisis (EP.483)", "guest": "Matthew Smith（Chronometer Partners 创始人/CIO，能源与基础设施投资人）", "guest_en": "Matthew Smith (Founder & CIO of Chronometer Partners, energy and infrastructure investor)", "host": "Patrick O'Shaughnessy", "host_en": "Patrick O'Shaughnessy", "date": "2026-07-21", "durationMin": 60, "worthScore": 5, "worthReason": "五维打分均为满分：信息密度（井级自下而上建模的一手供需数据）、反共识度（挑战「美国天然气永远廉价充裕」的市场共识，远期曲线完全未定价）、论证严谨度（18 个月建模每口井、管道、处理与储气设施，flow vs stock 框架自洽）、可操作性（明确点名赢家输家与观察指标）、时效性（2028 年缺口临近，未来 6-12 个月是关键验证窗口）。一线能源投资人给出可证伪的结构性论点，属本年度必听集。", "worthReason_en": "Full marks on all five dimensions: information density (proprietary well-level supply-demand modeling), contrarianism (challenges the consensus that US gas is forever cheap and abundant, with a forward curve pricing none of it), analytical rigor (18 months modeling every well, pipeline, processing and storage facility, with a coherent flow-vs-stock framework), actionability (explicit winners, losers and watch-list indicators), and timeliness (the 2028 deficit is near; the next 6-12 months are the validation window). A first-rate energy investor presenting a falsifiable structural thesis — a must-listen of the year.", "originalUrl": "https://colossus.com/episode/americas-next-energy-crisis/", "transcriptUrl": "https://colossus.com/episode/americas-next-energy-crisis/", "noteFile": "", "status": "done", "tldr": "Smith 团队用 18 个月自下而上建模了美国几乎每一口天然气井、管道、处理与储气设施，结论：已签约的 LNG 出口（+20 Bcf/d）加上 AI 数据中心用气（P50 约 +5 Bcf/d）将从 2028 年起超过美国产量与输送体系的极限（最多增至约 128-132 Bcf/d），2028 年中储气跌破历史最低区间，2030 年可能耗尽工作储气——价格上行风险无界且凸性，气价将通过电价传导给全社会；唯一持久解是立即启动大规模 AP-1000 核电建设。", "tldr_en": "Smith's team spent 18 months building a bottom-up model of nearly every gas well, pipeline, processing plant and storage facility in America. Conclusion: contracted LNG exports (+20 Bcf/d) plus AI data-center demand (~+5 Bcf/d P50) will exceed what the US can produce and deliver (max ~128-132 Bcf/d) starting in 2028; storage breaks below its historic floor by mid-2028 and working gas storage could be exhausted by 2030. The upside price risk is unbounded and convex, transmitted to everyone via electricity bills; the only durable fix is ordering large-scale AP-1000 nuclear now.", "detail": "结论与方法。Smith 团队花 18 个月做了一件几乎没人做过的事：把美国天然气系统整体数字化——每口在产井及其递减曲线、每个作业者剩余地块的多边形边界、处理厂、集输管线、州际管道与储气库，逐一建模。得出的结论是结构性的而非天气驱动的：从 2028 年起美国进入史无前例的天然气短缺，2028 年年中储气量将实质性跌破历史最低区间，2029 年跌破所有已知历史记录，按其测算 2030 年美国可能耗尽全部工作储气（季节性总量约 4 Tcf）。\n大局在 AI 之前已定。页岩革命制造了「廉价且永远充裕」的表象，促成 LNG 出口终端在数据中心需求出现之前就大规模上马：出口能力将从目前约 15 Bcf/d 增至 2030 年底约 35 Bcf/d，净增 20 Bcf/d。这些项目背后是已落地的数十亿美元项目融资和与日本公用事业、欧洲买家签订的长约，停止出口意味着违约与地缘政治灾难——届时美国将占全球天然气供应约三分之一，盟友高度依赖，所以「不出口不就行了」走不通。AI 是加速器而非始作俑者：Smith 的 P50 基准情形只计入已签 PPA、并网协议的高确定性项目，得出约 +5 Bcf/d 的增量用气；若 P30 情形兑现则可达 12-15 Bcf/d。而供给端自下而上的极限约为 128-132 Bcf/d（增量约 20 Bcf/d），面对约 +25 Bcf/d 的需求增量，结构性缺口只能靠储气弥补。\nflow vs stock：问题不是地下有没有气，而是能否按时按量流出。核心优质井库存（Haynesville、Marcellus/Utica、Permian）按当前钻速约 4-5 年耗尽；处理厂建设周期 2-3 年；集输管线规划不足；过去 10-12 年因审批困局美国只建成一条大型州际管道（Mountain Valley）。远期曲线平躺在 3.5-3.6 美元/MMBtu 直到 2030 年，钻探激励低迷，EQT 甚至关井保值。当储气趋近于零时金融对冲毫无意义，只有物理分子有价值——这正是价格上行风险「无界且凸性」的含义，Patrick 甚至追问价格会不会到 20 美元。Smith 预言 2028 年将出现抢夺物理天然气的「刀战」，类比 DRAM 内存短缺：先是缓慢，然后突然。\n赢家与输家。赢家：Expand Energy（掌握 Haynesville 剩余核心井约 70%，仅 4 倍 EBITDA 交易）、Range Resources（阿巴拉契亚最优质产商）；公用事业级光伏零燃料成本，坐享气价推高的边际电价，是纯粹的意外之财；居民光伏+电池将进入指数增长；Cameco/Westinghouse（持股 49%）受益于核电重启。输家：美国消费者首当其冲（气定电价，电费全面上涨）；Bloom Energy 燃料电池——系统里根本没有足够的气支撑 24/7 运行；Caterpillar 与 GE Vernova 在 2029 年前后扩张涡轮机产能，恰逢气荒与监管转向，时点踩错；hyperscalers 的能源成本占比可能从约 10% 升至 20-30%，冲击其盈利拐点。\n解法与观察窗口。唯一能解决 2030 年代缺口的是大规模核电：立即下单 2-4 座 AP-1000，用 DOE 的 2600 亿美元贷款授权兜底融资、去风险供应链，2033-34 年投运后私人资本即可复制；SMR 仍是「科学实验」，本十年指望不上。辅助措施：重新激励居民屋顶光伏（家庭对冲电价的唯一工具）、修一条 1-2 Bcf/d 的加拿大管道进入 MISO/PJM 市场。没有银弹，必须多轨并行。未来 6-12 个月是验证期：盯住 2028 年远期曲线是否启动、hyperscalers 或公用事业是否开始签订 2028 年后的实物供气合约、管道审批与大型核电订单进展。", "detail_en": "Conclusion and method. Smith's team spent 18 months digitizing the entire US natural gas system — every producing well and its decline curve, polygon boundaries of each operator's remaining acreage, processing plants, gathering lines, interstate pipelines and storage. The conclusion is structural, not weather-driven: starting in 2028 the US enters an unprecedented gas shortage; by mid-2028 storage breaks materially below its historic floor, by 2029 it drops below all known historical evidence, and by 2030 working gas storage (~4 Tcf seasonal total) could be exhausted entirely.\nThe die was cast before AI. The shale revolution created the appearance of permanent cheap abundance, prompting a massive LNG export buildout before data-center demand existed: export capacity rises from ~15 Bcf/d today to ~35 Bcf/d by end-2030, a net +20 Bcf/d. These projects sit on multibillion-dollar financings and long-term contracts with Japanese utilities and European buyers; halting exports means defaults and geopolitical rupture — the US will supply roughly a third of global gas, and allies depend on it. AI is the accelerant, not the cause: Smith's P50 base case, counting only projects with signed PPAs and interconnection agreements, adds ~5 Bcf/d; a P30 scenario reaches 12-15 Bcf/d. Bottom-up supply maxes out around 128-132 Bcf/d (+~20 Bcf/d) against ~+25 Bcf/d of demand — the structural deficit must be drawn from storage.\nFlow versus stock: the question is not whether gas exists underground but whether it can flow on time. Core well inventory (Haynesville, Marcellus/Utica, Permian) depletes in roughly 4-5 years at current drilling rates; processing plants take 2-3 years to build; gathering plans are insufficient; only one major interstate pipeline (Mountain Valley) has been completed in 10-12 years due to permitting gridlock. The forward curve lies flat at $3.50-3.60/MMBtu through 2030, drilling incentives are weak, and EQT is even shutting in production. When storage approaches zero, financial hedges mean nothing — only physical molecules matter. That is what 'unbounded and convex' upside price risk means; Patrick even asks whether prices could hit twenty dollars. Smith foresees a 'knife fight' for physical gas in 2028, drawing the DRAM analogy: slowly at first, then all at once.\nWinners and losers. Winners: Expand Energy (~70% of remaining core Haynesville wells, trading at ~4x EBITDA), Range Resources, utility-scale solar (zero fuel cost capturing gas-driven marginal power prices — a pure windfall), residential solar plus batteries entering exponential growth, and Cameco/Westinghouse (49% stake) on a nuclear restart. Losers: the US consumer first and foremost (gas sets the power price, so electricity bills rise across the board); Bloom Energy fuel cells — there simply is not enough gas in the system to run them 24/7; Caterpillar and GE Vernova expanding turbine capacity into 2029, just as gas turns scarce and regulators turn hostile; and hyperscalers, whose energy share of compute cost could rise from ~10% to 20-30%.\nSolutions and what to watch. The only fix for the 2030s deficit is large-scale nuclear: order 2-4 AP-1000s now, backstopped by the DOE's $260 billion loan authority to de-risk the supply chain, online by 2033-34, after which private capital replicates. SMRs remain 'science experiments' this decade. Complements: re-incentivize rooftop solar (the household's only hedge) and build a 1-2 Bcf/d pipeline from Canada into MISO/PJM. There is no silver bullet. The next 6-12 months are the validation window: watch whether the 2028 forward curve moves, whether hyperscalers or utilities start contracting physical gas for 2028+, and progress on pipeline permits and large nuclear orders.", "points": ["18 个月自下而上建模：数字化每口在产井的递减曲线与每个作业者剩余地块边界，加上处理、集输、管道与储气，得出美国供给极限约 128-132 Bcf/d——这是井口到管口的物理约束，不是资源量估计", "大局在 AI 之前已定：页岩革命的廉价表象促成 LNG 出口终端大上马，已签约产能将使出口从约 15 Bcf/d 增至 2030 年底约 35 Bcf/d，几乎吃掉全部可能的产量增量", "停止出口走不通：项目背后是数十亿美元融资与对日欧的长约，违约与地缘后果不可承受；美国届时约占全球天然气供应三分之一", "AI 是加速器而非始作俑者：P50 口径（只算已签 PPA/并网协议项目）约 +5 Bcf/d，P30 情形达 12-15 Bcf/d；且当下每一种给 AI 供电的方案都要烧更多天然气", "flow vs stock 框架：地下有气不等于气能流出——核心井库存约 4-5 年耗尽、处理厂建设 2-3 年、过去 10-12 年只建成一条州际管道（Mountain Valley）", "储气是唯一缓冲：约 4 Tcf 工作储气面对约 5 Bcf/d 结构性缺口，2028 年中跌破历史最低区间，2029 年跌破所有历史记录，2030 年可能归零；届时金融对冲无用，只有物理分子有价值", "市场完全未定价：远期曲线平躺在 3.5-3.6 美元/MMBtu 到 2030 年，2028 合约流动性差；市场一边给建气电厂的公司 25 倍现金流估值，一边让 Expand Energy 趴在 4 倍 EBITDA——资本配置与物理现实脱节", "赢家输家清晰：气企（Expand、Range）、公用事业级光伏、居民光伏+电池、Cameco/Westinghouse 赢；美国消费者、Bloom Energy、扩产踩错时点的 Caterpillar/GE Vernova、能源成本占比翻倍的 hyperscalers 输", "唯一持久解是大规模核电：用 DOE 2600 亿美元贷款授权立即下单 2-4 座 AP-1000（2033-34 投运）去风险供应链；SMR 仍是科学实验，本十年靠不住"], "points_en": ["18 months of bottom-up modeling: digitized every producing well's decline curve and each operator's remaining acreage, plus processing, gathering, pipelines and storage — yielding a hard physical supply ceiling of ~128-132 Bcf/d, a wellhead-to-pipe constraint, not a resource estimate", "The die was cast before AI: shale-era cheapness triggered the LNG export buildout; contracted capacity takes exports from ~15 Bcf/d to ~35 Bcf/d by end-2030, consuming nearly all feasible production growth", "Stopping exports is not an option: projects sit on multibillion-dollar financings and long-term contracts with Japan and Europe; the US will supply roughly a third of global gas and allies depend on it", "AI is the accelerant, not the cause: the P50 case (only signed PPAs/interconnections) adds ~5 Bcf/d, the P30 scenario 12-15 Bcf/d — and every current solution for powering AI burns more gas", "Flow versus stock: gas in the ground does not mean gas that flows — core well inventory depletes in ~4-5 years, processing plants take 2-3 years to build, and only one interstate pipeline (Mountain Valley) has been completed in 10-12 years", "Storage is the only buffer: ~4 Tcf of working gas against a ~5 Bcf/d structural deficit breaks below the historic floor by mid-2028, below all recorded history by 2029, and could hit zero by 2030 — at which point hedges are worthless and only physical molecules matter", "The market prices none of it: the forward curve is flat at $3.50-3.60/MMBtu through 2030 and 2028 contracts are illiquid; the market pays 25x cash flow for gas-plant builders while Expand Energy sits at 4x EBITDA — capital allocation detached from physical reality", "Clear winners and losers: gas producers (Expand, Range), utility-scale solar, residential solar plus batteries, and Cameco/Westinghouse win; the US consumer, Bloom Energy, ill-timed capacity expanders Caterpillar/GE Vernova, and hyperscalers with doubling energy cost shares lose", "The only durable solution is large-scale nuclear: use the DOE's $260B loan authority to order 2-4 AP-1000s now (online 2033-34) and de-risk the supply chain; SMRs remain science experiments this decade"], "takeaways": ["把 AI 叙事从芯片延伸到燃料：下一个瓶颈不是算力而是天然气与电力，能源公司在 AI 周期中的战略地位可比肩芯片商——检查组合中是否有对气价/电价上行的正暴露", "用 flow vs stock 审视一切大宗商品论点：见公司管理层时要求看具体工程化井位地图与配套地面基础设施计划，而不是听「库存充足」的口头承诺", "未来 6-12 个月盯三个信号：2028 年天然气远期曲线是否开始上移、hyperscalers/公用事业是否签订 2028 年后实物供气合约、大型核电订单与管道审批是否落地", "尾部风险对冲思路：储气归零情形下金融对冲失效，物理资产（低成本气企、零燃料成本光伏、核电产业链）才是真正的凸性保护；家庭层面的对冲是屋顶光伏+电池"], "takeaways_en": ["Extend the AI narrative from chips to fuel: the next bottleneck is gas and electricity, not compute — energy companies may be as strategically important as chipmakers in this cycle; check your portfolio's exposure to rising gas and power prices", "Apply the flow-vs-stock lens to every commodity thesis: when meeting management, ask for exact engineered well locations on a map plus surface infrastructure plans, not verbal assurances of ample inventory", "Watch three signals over the next 6-12 months: whether the 2028 gas forward curve starts moving, whether hyperscalers/utilities begin contracting physical gas for 2028+, and whether large nuclear orders and pipeline permits materialize", "Tail-risk hedging: in a zero-storage scenario financial hedges fail — physical assets (low-cost gas producers, zero-fuel-cost solar, the nuclear supply chain) are the real convex protection; at the household level the hedge is rooftop solar plus batteries"], "quotes": ["The upside risk to prices becomes unbounded and convex —— 价格的上行风险变得无界且凸性（Patrick O'Shaughnessy，官方节目简介）", "You're going to start to see a knife fight to secure natural gas physical in '28 like we really haven't seen before. And the biggest losers of this would be the US consumer. —— 2028 年你会看到一场争夺实物天然气的刀战，前所未见；而最大的输家将是美国消费者（Matthew Smith）", "By 2030, he believes we could exhaust our working natural gas storage entirely. The fuel everyone in AI is counting on, and that everyone assumes is abundant, is not there. —— 到 2030 年，他认为美国可能彻底耗尽工作储气量。所有 AI 从业者指望的、所有人默认充裕的那种燃料，其实并不存在（Patrick O'Shaughnessy，X 帖）"], "quotes_en": ["The upside risk to prices becomes unbounded and convex (Patrick O'Shaughnessy, official episode intro)", "You're going to start to see a knife fight to secure natural gas physical in '28 like we really haven't seen before. And the biggest losers of this would be the US consumer. (Matthew Smith)", "By 2030, he believes we could exhaust our working natural gas storage entirely. The fuel everyone in AI is counting on, and that everyone assumes is abundant, is not there. (Patrick O'Shaughnessy, X post)"], "data": ["供需算术：美国现产量约 110-112 Bcf/d，自下而上建模的供给极限约 128-132 Bcf/d（增量约 20）；LNG 出口从约 15 增至 2030 年底约 35 Bcf/d（+20），叠加 AI P50 约 +5，需求增量约 +25——结构性缺口约 5 Bcf/d", "储气时间表：工作储气季节性总量约 4 Tcf；2028 年年中实质性跌破历史最低区间，2029 年跌破所有已知历史记录，2030 年可能耗尽", "市场未定价：天然气远期曲线平躺在约 3.5-3.6 美元/MMBtu 直到 2030 年；Expand Energy 掌握 Haynesville 剩余核心井约 70%，仅约 4 倍 EBITDA，而建气电厂的公司享受约 25 倍现金流估值", "hyperscaler 成本冲击：能源目前约占其成本结构 10%，若气价翻倍到三倍，2029 年前后可能升至 20-30%，performance per watt 将成为关键指标", "核电方案：DOE 拥有 2600 亿美元贷款计划授权，立即下单 2-4 座 AP-1000 可在 2033-34 年投运；辅以 1-2 Bcf/d 加拿大新管道进入 MISO/PJM"], "data_en": ["Supply-demand arithmetic: US production ~110-112 Bcf/d today with a bottom-up modeled ceiling of ~128-132 Bcf/d (+~20); LNG exports rise from ~15 to ~35 Bcf/d by end-2030 (+20), plus ~+5 Bcf/d AI P50 demand — total demand +~25, a structural deficit of ~5 Bcf/d", "Storage timeline: ~4 Tcf seasonal working gas; breaks materially below the historic floor by mid-2028, below all recorded history by 2029, potentially exhausted by 2030", "Market mispricing: the gas forward curve is flat at ~$3.50-3.60/MMBtu through 2030; Expand Energy controls ~70% of remaining core Haynesville wells at ~4x EBITDA while gas-plant builders trade at ~25x cash flow", "Hyperscaler cost shock: energy is ~10% of the cost structure today and could reach 20-30% by around 2029 if gas prices double or triple; performance per watt becomes a key metric", "Nuclear fix: the DOE holds $260B of loan-program authority; ordering 2-4 AP-1000s now means operation by 2033-34; complemented by a 1-2 Bcf/d new pipeline from Canada into MISO/PJM"], "note": ""}, {"id": "2026-07-23-complexsystems-leila-clark-getting-paid-in", "podcast": "Complex Systems", "tier": "A", "category": "创始人/商业", "title": "What you're actually getting paid in, with Leila Clark", "title_en": "What you're actually getting paid in, with Leila Clark", "guest": "Leila Clark（Stardrift 创始人，AI 旅行规划器，YC/BCV 背书；前 Jane Street 软件工程师）", "guest_en": "Leila Clark (Founder of Stardrift, a YC/BCV-backed AI travel planner; formerly a software engineer at Jane Street)", "host": "Patrick McKenzie (patio11)", "host_en": "Patrick McKenzie (patio11)", "date": "2026-07-23", "durationMin": 64, "worthScore": 4, "worthReason": "把“职业报酬是一篮子货币”讲成完整框架：文化、乐趣、感激、可积累的外部资本都是真实可支付的货币，可执行性极强，且有全文逐字稿可核。", "worthReason_en": "Turns career compensation into a complete multi-currency framework — culture, fun, gratitude, and portable capital are all real currencies — highly actionable, with a full transcript to verify.", "originalUrl": "https://www.complexsystemspodcast.com/episodes/what-youre-actually-getting-paid-in-with-leila-clark/", "transcriptUrl": "https://www.complexsystemspodcast.com/episodes/what-youre-actually-getting-paid-in-with-leila-clark/", "noteFile": "", "status": "done", "tldr": "前 Jane Street 工程师、现 AI 创业者 Leila Clark 与 patio11 拆解她的爆款随笔《What Are You Getting Paid In?》：大多数人从未盘点过自己真正被什么支付——现金只是职业报酬篮子里的一种货币，文化、乐趣、地位、感激、自主与可携带的资本同样在计价。", "tldr_en": "Ex-Jane Street engineer and AI founder Leila Clark joins patio11 to unpack her sleeper-hit essay What Are You Getting Paid In?: most people never audit what they are actually paid in — cash is only one currency in the career compensation bundle, alongside culture, fun, status, gratitude, autonomy, and portable capital.", "detail": "本期的原点是 Clark 在 Jane Street 观察到的一个结构性悖论：金融公司里人人都是为最高薪而来的优化者，但公司最重要、最无聊的技术后台（对账、清算、资金运营）恰恰付不出组织里最高的钱——在“按钱排序”的人才市场里它注定招不到人。她的一位中层经理朋友却把这个部门做成了全公司文化最好的团队，方法是换一种货币支付：亲手挑选彼此合拍的人、刻意分配“商业价值可疑但写起来极有趣”的代码、给足感激与自主。这个管理实验成为整篇 essay 的种子：文化是可以真实支付的货币，而且在结构性付不起现金的地方尤其有效。两人由此展开另一个关键观察——在纽约把高薪翻倍买不到生活质变（10 倍才是另一个故事），很多金融从业者入行几年后才发现钱早已不是约束，自己真正想被支付的东西另有其物。\n框架的第二层是 Ken Griffin vs Taylor Swift 的对照：Griffin 净资产约 500 亿美元，约等于 50 个 Taylor Swift（约 10-20 亿美元），而 Kendrick Lamar 据公开估计仅约 4 亿——音乐这条“文化最高声望路径”的财务上限被严重高估。patio11 补充了残酷的微观证据：歌手 Afroman 在诉讼证词中披露，20 年演艺生涯加一首全国爆款之后，生活水平接近就业不稳定人群；名人离婚与破产文件一再揭示同类事实。反过来，一个在 Google 安静干了 15-20 年的产品经理会积累出“格莱美获奖歌手级”的净资产——patio11 断言 Google 工程师干满 10 年“必然是百万富翁”（起薪 20 万美元起步一路上调），却曾因此被公众反驳，说明世界在合谋阻止人们学会这些显而易见的算术。但 Swift 手里也有 Griffin 用 500 亿都买得别扭的货币：纽约任何餐厅的即时预订，以及 fame 作为一种在世界中行走的方式——不同货币之间并不完全可兑换，这正是“盘点你被什么支付”的意义。\n第三层是“剧本（scripts）”的社会学：一路成绩优异的人本质上在连续赢得“猜老师密码”的精英竞赛，直到撞上资本主义；而资本主义的创造性（也是可怕之处）在于为需要老师的人发明了代理老师和假的作文竞赛。学术是最典型的陷阱——锦标赛结构下一个领域一年可能只有个位数终身教职，但结构上不可能一年只毕业三个 PhD，而劝你入行的导师恰恰全是赢了锦标赛的幸存者。YC 的聪明之处是给需要剧本的人发了一份通往创业的剧本：申请制、每周 partner 会议模拟老师反馈回路（“他们完全不是你的教授，wink wink”），并且刻意不问你父亲是谁——与好莱坞 nepo baby 的准入机制形成鲜明对照。\n最后落到可执行层：patio11 重提他的名篇 Don't End the Week with Nothing——优先选择允许你在公司结构外积累可展示、可携带的智力与社会资本的行业和岗位（essay、开源、社媒可见性），而交易公司恰恰以保密文化为由拒绝支付这种货币；识别自己的 quirky preference（有人在允许对同事咆哮的环境里眼睛发光，有人绝不接受——同一维度可以异号），据此不要按别人的方式对机会集排序；感激是几乎零成本却被严重短缺的货币，管理者应当有意识地支付它。本集与 ILTB×Giffon 的“注意力取代资本”论互为姊妹篇：当现金报酬趋同，真正拉开人生差距的是你选择被哪些非现金货币支付。", "detail_en": "The episode starts from a structural paradox Clark observed at Jane Street: everyone at a trading firm came optimizing for the highest salary, yet the firm's most important and most boring technical back office (reconciliation, settlement, treasury ops) structurally cannot pay top-of-market — so in a sort-by-salary talent market it can never hire. A middle-manager friend of hers nonetheless built it into one of the best cultures in the firm by paying in a different currency: hand-picking people who worked well together, deliberately assigning code that was 'of dubious business value but extremely fun to write', and paying generously in gratitude and autonomy. That management experiment seeded the essay's thesis: culture is a real, payable currency, most effective precisely where cash structurally runs out. The pair add a second observation — doubling an already-good New York salary buys surprisingly little life change (10x is a different story), and many finance professionals discover a few years in that money stopped being the constraint long ago.\nThe second layer is the Ken Griffin vs Taylor Swift comparison: Griffin is worth roughly $50 billion, about fifty Taylor Swifts (~$1-2B), while Kendrick Lamar is reportedly worth only ~$400M despite a Super Bowl halftime show — the financial ceiling of music's most celebrated path is wildly overrated. patio11 supplies brutal micro-evidence: rapper Afroman testified under oath that after a 20-year career with one national hit, his lifestyle approximated employment precarity; celebrity divorce and bankruptcy filings repeatedly reveal the same. Conversely, a Google product manager who quietly compounds for 15-20 years ends up with Grammy-winner net worth — patio11 notes a 10-year Google engineer is 'invariably a millionaire' (base salaries start at $200k+), a claim he once got public pushback for, evidence that the world conspires against people learning this obvious arithmetic. Yet Swift holds one currency Griffin's $50B buys only awkwardly: a restaurant reservation anywhere in New York, and fame as a way of moving through the world — currencies are not fully convertible, which is exactly why auditing what you are paid in matters.\nThe third layer is the sociology of scripts: high achievers spend two decades winning guess-the-teacher's-password tournaments until they hit capitalism — which then creatively (and terribly) assigns surrogate teacher figures to those who need them. Academia is the archetypal trap: a tournament structure where a field may tenure a handful of people a year while structurally graduating far more PhDs, and the mentors urging you in are all survivors who won. YC's genius, they argue, is handing script-followers a legible script to founderdom: an application, weekly partner meetings that replicate the teacher feedback loop ('they are totally not your professor, wink wink') — and pointedly never asking who your father is, in sharp contrast to Hollywood's nepo-baby admissions.\nThe episode lands on the actionable layer: patio11 revisits Don't End the Week with Nothing — prefer industries and roles that let you accumulate visible, portable intellectual and social capital outside the firm (essays, open source, being seen doing the work); trading firms notoriously refuse to pay this currency in the name of secrecy. Know your quirky preferences (some people's eyes light up in yell-at-your-coworkers environments; others would pay to avoid them — same dimension, opposite signs) and stop sorting the opportunity set the way your class does. Gratitude is a nearly free currency most people are starving for; managers should pay it deliberately. The episode reads as a sister piece to ILTB×Giffon's attention-over-capital thesis: as cash compensation converges, life outcomes diverge on which non-cash currencies you choose to be paid in.", "points": ["Jane Street 后台经理的困境与解法：在人人为最高薪而来的组织里，最重要但结构性付不起钱的部门，靠“文化 + 有趣的代码 + 感激”支付，建成了全公司最好的团队文化——证明文化是真实可支付的货币。", "薪酬的边际效用断崖：在纽约把高薪翻倍买不到生活质变，10 倍才是另一个故事；很多金融人入行数年后才意识到钱早已不是约束，自己真正想要的支付方式另有其物。", "Ken Griffin（约 500 亿美元）≈ 50 个 Taylor Swift（约 10-20 亿）；Kendrick Lamar 据公开估计仅约 4 亿，尽管刚登上超级碗中场——音乐路径的财务上限被文化叙事严重高估。", "Afroman 在诉讼证词中披露：20 年演艺生涯 + 一首全国爆款之后，生活水平接近就业不稳定人群；名人离婚/破产文件反复揭示“多白金歌手净资产远低于想象”。", "在 Google 干满 10 年的工程师“必然是百万富翁”（起薪 20 万美元+，逐年上调）；干 15-20 年的产品经理会安静积累出格莱美获奖歌手级净资产——但社会叙事合谋让人学不会这道算术。", "学术是残酷锦标赛：一个领域一年可能只有三个终身教职名额，结构上却不可能一年只毕业三个 PhD；劝你读博的导师恰恰全是赢了锦标赛的幸存者，存在系统性偏差。", "YC 是发给“需要剧本的人”的创业剧本：申请制 + 每周 partner 会议复刻老师反馈回路，且刻意不问你父亲是谁——与好莱坞 nepo baby 机制形成对照；它把资本主义这个最严酷的老板延迟了几周才见面。", "Don't End the Week with Nothing：优先选择能在公司外积累可展示、可携带资本（essay/开源/社媒）的行业；交易公司以保密为由恰恰不支付这种货币，这是入行前就该定价的隐性扣减。", "不同货币不完全可兑换：Taylor Swift 拥有 Griffin 用 500 亿也买得别扭的“纽约任意餐厅预订”；而顶级酒店礼宾其实是这个隐性市场的合法做市商——盘点货币篮子才能看清真实报酬。"], "points_en": ["The Jane Street back-office dilemma and its solution: in an organization where everyone came for top pay, the most important department that structurally cannot pay top-of-market built the firm's best culture by paying in culture, fun code, and gratitude — proving culture is a real payable currency.", "The marginal-utility cliff of salary: doubling a good New York salary buys little life change, 10x is a different story; many finance professionals realize years in that money stopped being the constraint long ago.", "Ken Griffin (~$50B) equals roughly fifty Taylor Swifts (~$1-2B); Kendrick Lamar is reportedly worth only ~$400M despite a Super Bowl halftime show — music's financial ceiling is wildly overrated by cultural narrative.", "Afroman testified in litigation that after a 20-year career plus one national hit, his lifestyle approximated employment precarity; celebrity divorce and bankruptcy filings repeatedly reveal multi-platinum artists worth far less than assumed.", "A 10-year Google engineer is 'invariably a millionaire' (base $200k+ and rising); a 15-20 year product manager quietly compounds to Grammy-winner net worth — yet the world pushes back on this obvious arithmetic.", "Academia is a brutal tournament: a field may offer three tenure slots a year while structurally graduating far more PhDs; the mentors urging you in are precisely the survivors who won, a systematic bias.", "YC is a script to founderdom for people who need scripts: an application plus weekly partner meetings replicating the teacher feedback loop, and it pointedly never asks who your father is — unlike Hollywood's nepo-baby admissions.", "Don't End the Week with Nothing: prefer industries where you can accumulate visible, portable capital outside the firm (essays, open source, social presence); trading firms refuse to pay this currency in the name of secrecy — price that in before joining.", "Currencies are not fully convertible: Swift holds the 'any restaurant reservation in New York' currency that Griffin's $50B buys only awkwardly — and top hotel concierges are the quiet market makers of that hidden market."], "takeaways": ["盘点你当前工作支付你的完整货币篮子——现金、学习速率、文化、自主、可见性、感激——绝不要按薪水倒序排列然后选最高的那个。", "找出你的 quirky preference：你与共识异号的偏好维度就是你的套利空间——去别人避之不及、你却甘之如饴的地方拿超额报酬。", "每周别空手离场：刻意选择能在公司结构外积累可携带智力与社会资本的岗位，写下来、发出去、让别人看见你在做事。", "警惕剧本替你做决定：入行前问一句——这个行业赢家的人生，在我眼里像赢吗？如果不像，赢了也是输。"], "takeaways_en": ["Audit the full currency bundle your job pays you — cash, learning rate, culture, autonomy, visibility, gratitude — and never reverse-sort by salary and pick the top item.", "Find your quirky preference: the dimension where your preference has the opposite sign from consensus is your arbitrage — go where others refuse to and collect the premium.", "Don't end the week with nothing: deliberately choose roles that let you accumulate portable intellectual and social capital outside the firm — write it, ship it, be seen doing the work.", "Don't let scripts decide for you: before entering an industry, ask whether the winners' lives look like winning to you — if not, winning is losing."], "quotes": ["Think very carefully about the bundle of things you're getting paid in, other than just salary. Do not reverse-sort by salary and pick the top thing. —— 认真想清楚你被支付的是一整篮东西，而不只是工资。不要按薪水倒序排列然后选最高的那个。（Leila Clark）", "My performance evaluations for the last 10 years have been delivered by capitalism. What can you possibly say to me that would make me worried about life? —— 过去十年我的绩效评估都是资本主义亲自打的分，你还能说出什么让我对人生感到害怕的话？（Patrick McKenzie）", "Gratitude is a thing that you can be paid in, and many people are starving for it. —— 感激是一种可以用来支付的货币，而许多人正对它极度饥渴。（Patrick McKenzie）"], "quotes_en": ["Think very carefully about the bundle of things you're getting paid in, other than just salary. Do not reverse-sort by salary and pick the top thing. (Leila Clark)", "My performance evaluations for the last 10 years have been delivered by capitalism. What can you possibly say to me that would make me worried about life? (Patrick McKenzie)", "Gratitude is a thing that you can be paid in, and many people are starving for it. (Patrick McKenzie)"], "data": ["Ken Griffin 净资产约 500 亿美元，约等于 50 个 Taylor Swift（约 10-20 亿美元）", "Kendrick Lamar 据公开估计净资产约 4 亿美元，尽管刚完成超级碗中场演出", "Google 全职工程师底薪至少 20 万美元/年，干满 10 年“必然”成为百万富翁（patio11）", "学术锦标赛：一个领域全美一年可能仅约 3 个终身教职名额，结构上多数 PhD 注定失望", "Leila Clark 2016 年首次在 Jane Street 实习，在金融业做了约 4 年软件工程师后创办 Stardrift（YC/BCV 背书）"], "data_en": ["Ken Griffin's net worth is roughly $50 billion — about fifty Taylor Swifts (~$1-2B)", "Kendrick Lamar is reportedly worth only ~$400M despite performing the Super Bowl halftime show", "A full-time Google engineer makes a bare minimum of $200,000/year; ten years in, they are 'invariably millionaires' (patio11)", "The academic tournament: a field may offer only ~3 tenure-track slots per year in the entire US, so most PhDs are structurally set up for disappointment", "Leila Clark first interned at Jane Street in 2016, spent ~4 years as a software engineer in finance, then founded Stardrift (YC/BCV-backed)"], "note": ""}, {"id": "2026-07-20-econtalk-dwayne-betts-iliad", "podcast": "EconTalk", "tier": "A", "category": "人物访谈", "title": "Dwayne Betts on the Iliad", "title_en": "Dwayne Betts on the Iliad", "guest": "Dwayne Betts（诗人/律师，Freedom Reads 创始人，16 岁入狱、服刑逾 8 年）", "guest_en": "Dwayne Betts (poet, lawyer, founder of Freedom Reads; incarcerated for over 8 years starting at age 16)", "host": "Russ Roberts", "host_en": "Russ Roberts", "date": "2026-07-20", "durationMin": null, "worthScore": 4, "worthReason": "嘉宾经历极稀缺（少年监禁—诗人—律师），把 2800 年前的史诗读成关于选择、哀恸与父职的生命之书，长青且动人，但可执行性有限。", "worthReason_en": "A guest of rare lived experience (teen incarceration to poet-lawyer) reads a 2,800-year-old epic as a book about choice, grief, and fatherhood; evergreen and moving, though light on actionable takeaways.", "originalUrl": "https://www.econtalk.org/dwayne-betts-on-the-iliad/", "transcriptUrl": "https://www.econtalk.org/dwayne-betts-on-the-iliad/", "noteFile": "", "status": "done", "tldr": "曾在少年时入狱的诗人 Dwayne Betts 用三天读完《伊利亚特》，与 Russ Roberts 共谈：这不是战争故事，而是关于父亲、友谊，以及在无可逃避的命运里依然做出选择的尊严。Betts 把 Achilles 的暴怒与恸哭直接连到自己 16 岁入狱与成年后抑郁的经历。", "tldr_en": "Poet Dwayne Betts, imprisoned as a teenager, read the Iliad in three days and joins Russ Roberts to argue it is not a war story but a book about fathers, friendship, and the dignity of making choices inside inescapable fates — connecting Achilles's rage and weeping to his own incarceration at 16 and his later depression.", "detail": "这是 EconTalk《伊利亚特》书友会的第二集（首集嘉宾为古典学者 Ido Hevroni），录制于 2026 年 6 月 23 日，也是 Betts 第五次做客节目。Betts 因纪录片首映和个人画展耽搁，直到录制前三天才真正开读，结果三天内读完 Fagles 英译本约 500-600 页的全书——某天他走了 28000 步，每一步手里都攥着 Kindle。他说自己读到结尾时哭了，尽管早知道结局；这种“沉浸式共读”让他重新体会到少年时代那种被一本书完全占据的状态，也让这次对谈成为两人友谊的一部分：读书即共修（reading as communion）。\n本集最核心的论证链来自 Betts 的生命经验：《伊利亚特》是一个“看似有无数选择、实则没有选择”的世界，而人物依然在最严酷的约束下不断演示何为做选择。他直接连到自己的经历——16 岁犯罪入狱时，他觉得进监狱是注定的结局，“像是我自己把自己开车送进去的”，但在狱中幸存并不注定，他学会了在注定的结局里依然去发现选择。由此他重读 Achilles：借 Roberts 转述 Ido Hevroni 的洞见，Agamemnon 抢走 Briseis 恰恰重演了 Paris 抢走 Helen 的罪——这场战争的起因；所以 Achilles 罢战不是小气，而是“统帅已丧失道德合法性”后的原则立场，哪怕这原则带来尸山血海。\n两人还拆解了史诗的技术与质感：暴力描写极其具体（长矛如何穿透头盔、脑浆如何迸溅），但每次杀戮都附带死者的家世与故乡——上千个只出现一次的名字，功能不是让你记住个人，而是标记战争的涟漪波及每一位父母；Betts 引在狱中读到的 Amichai《炸弹的直径》：苦难的圆圈最终把整个世界圈进去。他还指出一个常被忽略的“铠甲经济学”：战场上剥取敌人铠甲不只是战利品，穷困的士兵下一场仗真的要穿它——Hector 杀死 Patroclus 后穿上的正是 Achilles 的铠甲，而许多人死于装备的缝隙。Betts 谈自己的名字（狱中叫 Shahid、家人叫 Dwayne、以父名 Reginald 出版）时说，呼名本身就是给一种未能实现的人生以荣光——这正是荷马为阵亡者点名的意义。\n结尾聚焦 Achilles 的软化与 Priam 赎尸：从不哭的最强战士在 Patroclus 死后连日恸哭——Betts 说这让他想起自己重度抑郁时“每天以泪洗面”写信给 Russ 的日子；Lycaon 求饶被拒的名场面（“Come, friend, you too must die”）恰是结尾转折的铺垫，让 Achilles 归还 Hector 遗体的转变显得真实。Priam 亲吻杀子仇人的手，以“想想你自己的父亲”打动 Achilles，两个死敌共同进食；Betts 用 Robert Hayden 的诗句“love's austere and lonely offices”（爱那严峻而孤独的职守）总结父职，并讲了朋友 Randall Horton 的父亲在法庭上为儿子求情的现代版 Priam 故事。谈到为何遗体如此重要——从 bin Laden 海葬到中东为遗体谈判——Betts 说遗体是哀悼仪式的起点，11 天的休战让哀悼有了结构，而监禁式的“流放”恰恰剥夺人参与这些仪式的资格。\n最后 Betts 介绍 Freedom Reads：把三个 44 英寸高、双面可取的手工书架、共 500 本书（含《伊利亚特》《奥德赛》）直接放进牢房区，一个监狱一个牢区一座“自由图书馆”，愿景是“监狱里放一百万本书，因为我们把数百万人放进了监狱”。弗吉尼亚在押者 Anthony 借它读了约 60 本书，并向同伴滔滔不绝地安利 Adam Smith 的《道德情操论》与 Roberts 的书。对今天的读者，这集的价值在于示范了一种罕见的阅读姿态：让经典与你最深的创伤和爱互相照亮，并借一本书与另一个人成为“不同种类的朋友”。", "detail_en": "This is the second installment of the EconTalk Book Club on the Iliad (the first featured classicist Ido Hevroni), recorded June 23, 2026 — Betts's fifth appearance. Delayed by a documentary premiere and his first solo art show, Betts did not start reading in earnest until three days before recording, then devoured the entire 500-600 page Fagles translation in three days — walking 28,000 steps one day with the Kindle in his hand. He wept at the ending despite knowing the story, and the binge-immersion recovered a childhood feeling of being wholly possessed by a book. The episode itself becomes an act of friendship: reading as communion.\nThe core argument grows from Betts's life: the Iliad depicts a world that seems full of choices yet has none, whose characters nonetheless keep animating what it means to choose under the most dire constraints. He connects this to going to prison at 16 — it felt like a foregone conclusion, as if he drove himself there — yet surviving prison was not foregone; he survived by finding choices inside a fixed fate. This reframes Achilles: via Ido Hevroni's insight (relayed by Roberts), Agamemnon's seizure of Briseis exactly reenacts Paris's theft of Helen — the very injustice the war was fought over — so Achilles's withdrawal is not petulance but a principled verdict that his commander has lost moral legitimacy, whatever carnage the principle causes.\nThey also unpack Homer's craft: the violence is graphically specific (spears through helmets, brains bursting), yet every killing carries the dead man's home and parents. The thousand-odd names that appear once are not there to be remembered individually but to mark how war's ripples touch every family — Betts invokes Yehuda Amichai's poem The Diameter of the Bomb, which he first read in prison: the circle of suffering eventually includes the entire world. He highlights an overlooked economics of armor: stripping the dead is not mere trophy-taking — poor soldiers wear the gear into the next fight; Hector puts on Achilles's own armor after killing Patroclus, and men die through gaps in inferior equipment. Discussing his own names (Shahid in prison, Dwayne to family, publishing as Reginald — his father's name), Betts argues that invoking a name honors the possibility of a life, which is exactly what Homer's roll call of the dead does.\nThe finale centers on Achilles's softening and the ransom of Hector: the strongest man alive weeps uncontrollably for pages after Patroclus dies — Betts says it mirrored his own severe depression, when he wrote Russ that he was weeping every day. The Lycaon scene (“Come, friend, you too must die”) sets up the turn, making the return of Hector's body feel earned rather than god-coerced. Priam kisses the hands of his sons' killer and reaches Achilles by saying remember your own father; the two enemies break bread. Betts frames fatherhood through Robert Hayden's line about love's austere and lonely offices, and tells a modern Priam story — his friend Randall Horton's father pleading for his incarcerated son in court. On why bodies matter — from bin Laden's burial at sea to hostage-body negotiations in the Middle East — Betts argues the body is where the ritual of becoming whole begins; the 11-day truce gives grief a structure, and the tragedy of exile (including prison) is being stripped of those rites.\nFinally Betts describes Freedom Reads: handcrafted Freedom Libraries — three double-sided bookcases about 44 inches high holding 500 books, including the Iliad and Odyssey — placed directly on prison cell blocks, with a vision of putting a million books in prison because we put millions of people in prison. Anthony, incarcerated in Virginia, read some 60 books through one and riffed for minutes on Adam Smith's Theory of Moral Sentiments. For today's reader, the episode models a rare posture: letting a classic and your deepest wounds and loves illuminate each other, and becoming, through a book, a different kind of friend to another person.", "points": ["核心框架：《伊利亚特》呈现一个“看似有选择、实则没有选择”的世界，人物却不断示范在最严酷约束下做选择。Betts 直接连到自己 16 岁入狱——入狱像注定，但在狱中幸存不是，他靠“在注定里找选择”活下来。", "重估 Achilles 的罢战：Ido Hevroni 的洞见指出 Agamemnon 抢走 Briseis 恰恰重演了 Paris 抢 Helen 的开战罪行，所以 Achilles 不是小气赌气，而是认定统帅丧失了道德合法性后的原则立场。", "上千个只出现一次的人名不是要你记住个体，而是标记战争涟漪波及每一位父母与故乡；Betts 引狱中读到的 Amichai《炸弹的直径》——苦难的圆圈最终把全世界圈进去，直到“没有尽头、没有上帝”。", "铠甲经济学：剥取敌尸的铠甲不只是战利品，穷士兵下一仗真的要穿它作战——Hector 杀 Patroclus 后穿上的正是 Achilles 的铠甲，许多人死于装备的裂缝与缺口。", "Lycaon 场面是结尾的铺垫：Achilles 拒绝赎金、称将死者为“friend”——凭什么？因为二人共享必死性（“连 Patroclus 都死了，他比你强得多；连我也终有一死”）。Roberts 引 George Steiner《Errata》解读此段。", "Achilles 之盾（第 18 卷）：Hephaestus 铸的新盾上有活动的城镇与人间百态，Betts 解读为——护住你的从来不是铜甲，而是你背在身上的整个人间；而 Achilles 抚琴“从和平中起身”说明人可以在讲述战争中保有和平。", "Priam 赎尸是全书最动人的场景：他亲吻杀死自己至少六个儿子的凶手之手，以“想想你自己的父亲”唤起共通的父职；神促成了会面，人却真实地彼此看见、共同进食。Betts 用 Hayden 诗句“love's austere and lonely offices”概括，并举友人 Randall Horton 之父法庭求情为现代版 Priam。", "遗体为何重要：从 bin Laden 海葬到中东为遗体谈判，2800 年未变——遗体是哀悼仪式的起点，11 天休战给悲伤以结构；Patroclus 遗愿与 Achilles 骨殖同葬，是文学中罕见的男性友谊的深度亲密。", "Freedom Reads：三个 44 英寸高的手工书架、500 本书（含《伊利亚特》），直接放进牢房区让人“在社群中阅读”；弗吉尼亚在押者 Anthony 借它读了约 60 本书，向狱友滔滔安利 Adam Smith——书是通向社群与自省的门。"], "points_en": ["Core frame: the Iliad depicts a world that seems full of choices yet has none, whose characters keep demonstrating choice under dire constraints. Betts links it to going to prison at 16 — prison felt foregone, but surviving it was not; he survived by finding choices inside a fixed fate.", "Reassessing Achilles's strike: Ido Hevroni's insight is that Agamemnon seizing Briseis reenacts exactly Paris's theft of Helen — the war's founding injustice — so Achilles's withdrawal is a principled verdict that his commander lost moral legitimacy, not petulance.", "The thousand names that appear once are not for memorizing individuals but for marking how war's ripples reach every parent and homeland; Betts invokes Amichai's The Diameter of the Bomb, read in prison — the circle of suffering widens until it has no end and no God.", "The economics of armor: stripping the dead is not mere trophy-taking — poor soldiers wear the gear into the next fight. Hector dons Achilles's own armor after killing Patroclus, and men die through the gaps and cracks of inferior equipment.", "The Lycaon scene sets up the ending: Achilles refuses ransom yet calls his victim 'friend' — because they share mortality ('Even Patroclus died, a far, far better man than you... even for me, Death and the strong force of fate are waiting'). Roberts credits George Steiner's Errata for the reading.", "The shield of Achilles (Book 18): Hephaestus forges a shield alive with towns and ordinary life; Betts reads it as a reminder that what protects you is the whole human world you carry — and Achilles rising 'from his peace' while singing of war shows one can hold peace while recounting violence.", "The ransom of Hector is the book's most moving scene: Priam kisses the hands of the man who killed at least six of his sons, reaching Achilles with 'remember your own father.' Gods arrange the meeting, but the recognition is fully human — they break bread. Betts frames it with Hayden's 'love's austere and lonely offices' and a modern parallel: Randall Horton's father pleading for his son in court.", "Why bodies matter: from bin Laden's burial at sea to hostage-body negotiations in the Middle East, nothing has changed in 2,800 years — the body is where the ritual of grief begins, and the 11-day truce gives mourning a structure; Patroclus asking that his bones be buried with Achilles's is a rare portrait of intimate male friendship.", "Freedom Reads: handcrafted libraries of three 44-inch bookcases holding 500 books (including the Iliad) placed on prison cell blocks so people can read in community; Anthony, incarcerated in Virginia, read some 60 books and evangelized Adam Smith to fellow prisoners — books as portals to community and self-reflection."], "takeaways": ["在看似毫无选择的处境（坏工作、坏运气、坏决定的后果）里，练习 Betts 的狱中方法论：承认结局也许注定，但接下来几小时做什么依然是你的选择——尊严藏在这个缝隙里。", "找一个朋友限时共读一本难啃的经典（哪怕三天冲刺式沉浸），让书里的每个情绪与你的生活互相缠绕——你收获的不只是这本书，还有一段被升级的友谊。", "愤怒值得先问一句：我是在捍卫原则，还是在喂养自尊？Achilles 的悲剧是二者混在一起，代价是挚友的命；学会他最终的功课——公开承认“我是何等愚蠢”。", "你的决定波及的圈子远比你以为的大（炸弹的直径），而哀悼需要身体在场与仪式结构——别用效率跳过葬礼、守夜和纪念，那是人重新变得完整的起点。"], "takeaways_en": ["When a situation feels choiceless (bad job, bad luck, consequences of bad decisions), practice Betts's prison methodology: the ending may be foregone, but what you do in the next few hours is still yours — dignity lives in that gap.", "Pick a hard classic and read it with a friend on a deadline (even a three-day sprint of immersion), letting the book entangle with every emotion of your week — you gain not just the book but an upgraded friendship.", "Interrogate your anger: am I defending a principle or feeding my ego? Achilles's tragedy is that the two were fused, and the price was his best friend's life; learn his final lesson — openly admitting what kind of fool you have been.", "Your decisions ripple far wider than you think (the diameter of the bomb), and grief requires bodies and ritual structure — do not optimize away funerals, vigils, and remembrance; they are where a person becomes whole again."], "quotes": ["It's this world in which the characters seemingly have no choices, but still consistently animate what it means to make choices under the most dire constraints. —— 这是一个人物看似毫无选择的世界，但他们始终在演示：在最严酷的约束下做选择意味着什么。（Dwayne Betts）", "By the time you get to the end, you recognize that you haven't read a war story at all. You read a story about all of the ways in which the human condition frustrates our ability to know each other, and still, somehow, we do know each other. —— 读到结尾你会发现，你读的根本不是战争故事，而是一个关于人性如何百般阻挠我们彼此了解、而我们竟仍然彼此了解的故事。（Dwayne Betts）", "I would put a million books in prison because we put millions of people in prison. —— 我要往监狱里放一百万本书，因为我们把数百万人放进了监狱。（Dwayne Betts）"], "quotes_en": ["It's this world in which the characters seemingly have no choices, but still consistently animate what it means to make choices under the most dire constraints. (Dwayne Betts)", "By the time you get to the end, you recognize that you haven't read a war story at all. You read a story about all of the ways in which the human condition frustrates our ability to know each other, and still, somehow, we do know each other. (Dwayne Betts)", "I would put a million books in prison because we put millions of people in prison. (Dwayne Betts)"], "data": ["本集录制于 2026 年 6 月 23 日，是 EconTalk《伊利亚特》书友会第二集（首集嘉宾为 Ido Hevroni），也是 Betts 第五次做客（上次为 2024 年 6 月谈马丁·路德·金《伯明翰狱中书信》）。", "Betts 三天读完 Robert Fagles 英译本《伊利亚特》——全书 24 卷、约 500-600 页；其中一天他手持 Kindle 边走边读，走了 28000 步。", "Betts 16 岁犯罪入狱（服刑逾 8 年）；狱中改名 Shahid，如今以父亲之名 Reginald Dwayne Betts 出版作品。", "Freedom Reads 的“自由图书馆”：三个约 44 英寸高、双面可取的手工书架，共 500 本书，直接安放在牢房区；弗吉尼亚在押者 Anthony 借它读了约 60 本书（其中书友会共读 24 本）。", "节目提及的关键文本：Amichai《炸弹的直径》、Robert Hayden《Those Winter Sundays》、George Steiner《Errata》、Tim O'Brien《The Things They Carried》、Betts 诗集《Bastards of the Reagan Era》（内含 100 行五步抑扬格长诗）。"], "data_en": ["Recorded June 23, 2026; second installment of the EconTalk Book Club on the Iliad (the first featured Ido Hevroni), and Betts's fifth appearance (last in June 2024 on MLK's Letter from Birmingham Jail).", "Betts read Robert Fagles's translation — 24 books, roughly 500-600 pages — in three days; one day he walked 28,000 steps reading the Kindle as he went.", "Betts went to prison at 16 (serving over 8 years); in prison he took the name Shahid, and now publishes under his father's name, Reginald Dwayne Betts.", "Freedom Reads's Freedom Libraries: three handcrafted double-sided bookcases about 44 inches high holding 500 books, placed directly on prison cell blocks; Anthony, incarcerated in Virginia, read about 60 books through one (24 in a book club).", "Key texts cited: Amichai's The Diameter of the Bomb, Robert Hayden's Those Winter Sundays, George Steiner's Errata, Tim O'Brien's The Things They Carried, and Betts's Bastards of the Reagan Era (with its 100-line poem in iambic pentameter)."], "note": ""}, {"id": "2026-07-18-allin-e281-ai-self-regulation-stripe-paypal", "podcast": "All-In Podcast", "tier": "A", "category": "科技/AI", "title": "Can the AI Industry Regulate Itself? Stripe Wants PayPal, China Catches Up, NY Bans Datacenters", "title_en": "Can the AI Industry Regulate Itself? Stripe Wants PayPal, China Catches Up, NY Bans Datacenters", "guest": "四人组常规期（Chamath / Sacks / Friedberg / Calacanis）", "guest_en": "Regular besties episode (Chamath / Sacks / Friedberg / Calacanis)", "host": "Chamath / Sacks / Friedberg / Calacanis", "host_en": "Chamath / Sacks / Friedberg / Calacanis", "date": "2026-07-18", "durationMin": 90, "worthScore": 4, "worthReason": "AI 自律监管（FINRA 式 SRO）与支付业超级并购两条主线信息密度极高，且 Sacks 曾任特朗普政府 AI 顾问、身处政策一线，稀缺一手视角；但节目立场鲜明（反监管、反 Anthropic），需批判性收听。", "worthReason_en": "Extremely dense on two fronts — the FINRA-style AI SRO debate and the payments mega-deal — with rare first-hand policy perspective from Sacks (former Trump administration AI advisor); but the show has a strong deregulatory, anti-Anthropic slant that demands critical listening.", "originalUrl": "https://www.youtube.com/watch?v=9IMwRIei-Xc", "transcriptUrl": "https://finance.biggo.com/podcast/a55a67774a49543a", "noteFile": "", "status": "done", "tldr": "四人组围绕 Demis Hassabis 提出的 FINRA 式 AI 行业自律组织（SRO）展开辩论，Sacks 开出五项条件以防监管俘获；同时拆解 Stripe/Advent/Block 对 PayPal 的联合收购要约（意在打造绕开 Visa/万事达的支付闭环）、中国 Kimi K3 逼近前沿的追赶信号，以及纽约州数据中心禁令背后的能源政治经济学。", "tldr_en": "The besties debate Demis Hassabis's FINRA-style self-regulatory organization for frontier AI (Sacks attaches five anti-capture conditions), dissect the Stripe/Advent/Block joint bid for PayPal aimed at building payment rails that bypass Visa/Mastercard, and weigh China's Kimi K3 catch-up signal against New York's data center moratorium and America's looming energy deficit.", "detail": "本期 All-In 的第一主线是 AI 行业能否自我监管。DeepMind 的 Demis Hassabis 发表提案，主张建立一个仿照美国金融业 FINRA 的、由美国主导的国际 AI 标准机构：行业出资、联邦监督、由独立技术专家运营；前沿实验室须在模型发布前 30 天提交审查（先自愿、后强制），机构评估网络安全、国家安全与生物风险，每季度更新基准，必要时可协调放缓开发节奏。提案获得 Musk、Altman、Jack Clark、Pichai、Nadella、Dorsey 等人公开支持。曾与 Hassabis 直接讨论过该提案的 Sacks 提出五项前提条件：一、须纳入创业公司与开源阵营（如 Jensen、Elon、Zuckerberg、Mira Murati），防止被三大实验室俘获；二、只审查真正最前沿的模型，不管增量改进；三、范围限于灾难性风险（网络攻击与 CBRN），明确排
