y Aaron Levie; current market cap >$4B", "Levie turned down multiple large acquisition offers including a widely-discussed Microsoft offer"], "note": ""}, {"id": "2026-07-07-iltb-ep481-giffon-billion-dollar-pdf", "podcast": "Invest Like the Best", "tier": "S", "category": "财经/投资", "title": "Jeremy Giffon - The Billion Dollar PDF [EP.481]", "title_en": "Jeremy Giffon - The Billion Dollar PDF [EP.481]", "guest": "Jeremy Giffon（横跨风险投资/成长股权/特殊机会的独立投资人，前 Tiny 董事总经理）", "guest_en": "Jeremy Giffon (independent investor across VC, growth equity & special situations; former Managing Director at Tiny)", "host": "Patrick O'Shaughnessy", "host_en": "Patrick O'Shaughnessy", "date": "2026-07-07", "durationMin": null, "worthScore": 5, "worthReason": "把「注意力取代资本成为稀缺资源」这一模糊直觉，升级成一整套可操作的世界观：Billion Dollar PDF、timeline-native、peak guy、SaaS 零边际成本终结。反共识密度极高，是本期最值得精读的一集。", "worthReason_en": "Turns the vague intuition that attention has replaced capital as the scarce resource into a full operating worldview: the Billion Dollar PDF, timeline-native institutions, peak guy, and the end of zero-marginal-cost SaaS. Extremely high contrarian density — the must-read of the week.", "originalUrl": "https://podcasts.apple.com/us/podcast/invest-like-the-best-with-patrick-oshaughnessy/id1154105909", "transcriptUrl": "https://finance.biggo.com/news/fc081c48b1d67a99", "noteFile": "notes/2026-07-07-iltb-ep481-giffon-billion-dollar-pdf.md", "status": "done", "tldr": "Giffon 的核心命题：金融资本不再稀缺，注意力才是。掌握如何捕获、塑造、投放注意力的人——常常靠 X 上一条帖子——正在支配数十亿资金的流向。同时软件的零边际成本优势在 AI 时代消失，SaaS 正走向沃尔玛式的低毛利、超大规模、赢家通吃格局。", "tldr_en": "Giffon's core claim: financial capital is no longer scarce — attention is. Those who capture, shape and deploy attention, often from a single X post, now steer billions. Meanwhile software's zero-marginal-cost edge dies in the AI era, pushing SaaS toward a Walmart-style low-margin, massive-scale, winner-take-most world.", "detail": "这集是 Giffon 在 18 个月、数百场与创始人和资金方对话之后的世界观总结，主线是一个反共识判断：金融资本不再是稀缺资产，注意力才是。\n他给这股力量起名叫「Billion Dollar PDF」——一份文档、一条推文、一篇宣言，在最大不确定性的时刻把故事「定下来」。他的原话是：所有人都有点慌、都不知道发生了什么，这时只要有人出来把叙事定住、说「就是这样，跟我走」，资本就会像追着球跑的十岁小孩一样跟着这份 PDF 满场跑。它不一定要对，只要够自信。这解释了为什么某些没有业绩的公司能融到数十亿，为什么「SaaS 已死」「AI capex 超级周期」这类叙事能在几周内重新分配巨额资金。\n背后的结构性推手是他所谓的 uni-feed：X 每天推给你约 500 条帖子，算法筛选、与你关注谁无关。发帖者对潜水者的比例极低——大多数 CEO、基金经理、政策制定者只看不发，而极少数「posters」为所有人设定议程。Giffon 说「发帖是最后一块伟大的精英制」：一个零粉丝的新账号写出一条好帖，几小时内就能触达数亿人，绕过所有旧守门人。X 因此成了事实上的全球报纸，也成了政策与资本配置的反应场。\n由此他提出机构必须「timeline-native」——既对时间线做出反应，自身行动又反过来影响时间线，形成无尽回路；当下白宫是第一个完全 timeline-native 的政府。他还画出一条「臣服链」：科学阶层臣服于亿万富翁阶层（Epstein 教训），如今亿万富翁阶层又臣服于 posting 阶层——在一场富豪聚会上，大家争的不是坐在最有钱的人旁边，而是坐在最有影响力的「poster-philosopher」旁边。他称亿万富翁崇拜已见顶（peak guy）：「亿万富翁」一词通胀到失去分辨率（Grant Cardone 和马斯克都叫 billionaire），net worth 是历史上很新且随一条推文就能蒸发的概念。\n最可操作的投资洞见是软件商业模式的结构性转变：SaaS 的零边际成本优势正在消失，每一次推理都要真金白银的算力，边际成本不为零。未来是「低毛利、极薄净利、超大规模」，类比零售业是沃尔玛而非精品店。他还给出资本吸收论：2016–2020 VC 回报太好、钱涌入，但伟大企业受限于伟大创始人数量，资本无处可去，于是高 capex 的 AI 公司「被资本从下游创造出来」，作为吸收过剩资金的海绵——这些公司融的钱与它们需要的钱无关。", "detail_en": "This is Giffon's worldview after 18 months and hundreds of conversations with founders and capital allocators, built around one contrarian claim: financial capital is no longer the scarce asset — attention is.\nHe names the force the Billion Dollar PDF — a document, tweet or manifesto that fixes the story at the moment of maximum uncertainty. In his words, everyone is a little panicked and doesn't know what's going on, and someone just needs to set the narrative and say this is happening, follow me; capital then follows the PDF around the field like ten-year-olds chasing a soccer ball. It doesn't even have to be right, just confident. This explains why firms with no track record raise billions and why narratives like the death of SaaS or the AI-capex super-cycle reallocate enormous sums in weeks.\nThe structural driver is the uni-feed: roughly 500 algorithmically chosen tweets a day, independent of who you follow. The poster-to-lurker ratio is tiny — most CEOs, fund managers and policymakers consume but never post, while a small group of posters sets the agenda. Posting, Giffon says, is the last great meritocracy: a zero-follower account can write one good post and reach hundreds of millions within hours, bypassing every old gatekeeper. X has become the de facto global newspaper and the arena where policy and capital react.\nHence institutions must become timeline-native — reactive to the timeline and reflexive (their own actions move it, which they then react to). The current White House, he argues, is the first fully timeline-native administration. He traces a chain of subservience: the science class became subservient to the billionaire class (the Epstein lesson), and now the billionaire class is subservient to the posting class — at a billionaire gathering the competition was to sit next to the prominent poster-philosopher, not the richest person. He calls billionaire worship peak guy: the word has inflated past all resolution (Grant Cardone and Musk are both billionaires), and net worth is a historically novel mark that a single tweet can erase.\nThe most actionable investing insight is the structural shift in software: SaaS's zero-marginal-cost edge is disappearing because every inference costs real compute. The future is low gross margins, razor-thin net margins, huge scale — Walmart, not a boutique. He adds a capital-absorption thesis: 2016–2020 VC returns were strong and money poured in, but great businesses are limited by great founders, so high-capex AI companies were effectively created downstream of capital as a sponge for excess funds — the amounts they raise are unrelated to what they need.", "points": ["「Billion Dollar PDF」：在最大不确定性时刻把叙事定下来的一份文档/推文/宣言，资本会像追球的孩子一样跟着它跑；不需要正确，只需要自信。", "mega-cap 科技股 52 周波动率接近 100%——世界最大的三四万亿美元公司，其边际定价被群聊、爆款帖和算法叙事左右，而非「定价至完美」。", "uni-feed：X 每天算法推送约 500 条帖子、与关注无关；极少数 posters 为 CEO、基金经理、政策制定者设定议程。", "「发帖是最后一块伟大的精英制」：零粉丝新账号一条好帖数小时可达数亿人，绕过精英媒体与所有旧守门人。", "timeline-native：机构要同时对时间线做出反应、又意识到自身行动会反过来改变时间线；白宫是第一个完全 timeline-native 的政府。", "臣服链 + peak guy：科学阶层→亿万富翁阶层→posting 阶层；「billionaire」一词已通胀失去分辨率，net worth 随一条推文可蒸发，亿万富翁崇拜见顶。", "SaaS 零边际成本终结：每次推理都要付算力，毛利从 70–85% 降向估计 40–60%，未来是低毛利、极薄净利、超大规模的沃尔玛式赢家通吃。", "资本吸收论：高 capex 的 AI 公司是「资本在下游创造出来的海绵」，它们融的钱与需要的钱无关；东西海岸薪酬结构对调（华尔街转 RSU、硅谷靠二级市场年年套现）。", "私募配额的「新封建制」：马斯克/Altman/扎克伯格/Amodei 像领主分封 SpaceX/OpenAI 配额，中介靠关系收 10% 一次性费+永久 2%、零 GP 出资、零个人风险。"], "points_en": ["The Billion Dollar PDF: a document/tweet/manifesto that fixes the narrative at peak uncertainty; capital chases it like kids chasing a ball. It need not be right, only confident.", "Mega-cap tech 52-week variance is nearly 100% — the world's $3–4T companies are marginally priced by group chats, viral posts and algorithmic narratives, not priced to perfection.", "The uni-feed: X pushes ~500 algorithmically selected tweets a day regardless of who you follow; a tiny group of posters sets the agenda for CEOs, fund managers and policymakers.", "Posting is the last great meritocracy: a zero-follower post can reach hundreds of millions in hours, bypassing elite media and every old gatekeeper.", "Timeline-native: institutions must be both reactive to the timeline and reflexive (their actions move it); the White House is the first fully timeline-native administration.", "Chain of subservience + peak guy: science class -> billionaire class -> posting class; 'billionaire' has inflated past resolution and net worth can evaporate with one tweet — billionaire worship has peaked.", "End of zero-marginal-cost SaaS: every inference costs compute, gross margins fall from 70–85% toward an estimated 40–60%; the future is low-margin, thin-net, massive-scale, winner-take-most (Walmart).", "Capital-absorption thesis: high-capex AI firms are sponges created downstream of capital; the sums raised are unrelated to need. Coast comp has flipped (Wall St -> RSUs; Valley -> annual secondary liquidity).", "A neo-feudal private-allocation market: Musk/Altman/Zuckerberg/Amodei act as lords granting SpaceX/OpenAI allocations; intermediaries charge 10% upfront + perpetual 2% with no GP commit and no personal risk."], "takeaways": ["别人讲故事时，回去算价值：Rainwater 的一页黄纸+「投入净资产百分之几」这一个数字，比 40 页 PPT 更能暴露真实信念。", "把「读懂并塑造叙事注意力」当成一项可训练的高杠杆技能——它现在的边际回报可能高于传统的建模与尽调。", "认清自己所处的激励：职业经理人被强制部署、要显得忙碌，反而更难跑赢；业余投资者的最大优势是可以耐心等待、什么都不做。", "对 AI/软件资产估值时，先问「它的边际成本是否真的为零」——零边际成本时代结束，毛利结构会重估整条 SaaS 赛道。"], "takeaways_en": ["When others tell stories, go back and do the math: Rainwater's one-page yellow-pad thesis plus one number — the % of net worth committed — reveals conviction better than a 40-page deck.", "Treat reading and shaping narrative attention as a trainable, high-leverage skill; its marginal return may now exceed classic modeling and diligence.", "Know your incentives: professionals are forced to deploy and look busy, which makes beating the market harder; the amateur's edge is the freedom to wait and do nothing.", "When valuing AI/software assets, first ask whether marginal cost is truly zero — the end of that era re-rates gross margins across the whole SaaS complex."], "quotes": ["Capital just follows the billion dollar PDF around the field. —— 资本就是跟着这份「十亿美元 PDF」满场跑。（Jeremy Giffon）", "The era of high gross margins being the norm is going away. —— 高毛利成为常态的时代正在消失。（Jeremy Giffon）", "I actually think it's more difficult for the professional money manager to beat the market than the average amateur. —— 我真心认为职业基金经理跑赢市场，比普通业余投资者更难。（Jeremy Giffon）"], "quotes_en": ["Capital just follows the billion dollar PDF around the field. (Jeremy Giffon)", "The era of high gross margins being the norm is going away. (Jeremy Giffon)", "I actually think it's more difficult for the professional money manager to beat the market than the average amateur. (Jeremy Giffon)"], "data": ["mega-cap 科技股 52 周波动率接近 100%（Giffon 引用）。", "X 算法每天向用户推送约 500 条帖子（uni-feed）。", "SaaS 毛利结构：AI 前约 70–85%，AI 时代估计降至 40–60%（节目内估算）。", "主持人 Patrick O'Shaughnessy 自陈约 60% 个人组合已在纯软件之外，转向实物/非软件资产。", "部分私募 SPV 结构：10% 一次性前端费、零 GP 出资、无期限，中介永久收 2%。"], "data_en": ["Mega-cap tech 52-week variance near 100% (per Giffon).", "X's algorithm surfaces ~500 tweets per user per day (the uni-feed).", "SaaS gross margins: ~70–85% pre-AI, an estimated 40–60% in the AI era (episode estimate).", "Host Patrick O'Shaughnessy says ~60% of his own portfolio now sits outside pure software.", "Some private SPVs: 10% one-time upfront fee, no GP commit, no term limit, intermediary collects 2% forever."], "note": "# 〔Invest Like the Best〕Jeremy Giffon - The Billion Dollar PDF [EP.481]\n\n- 元信息: Invest Like the Best | 主持 Patrick O'Shaughnessy | 嘉宾 Jeremy Giffon（横跨风险投资/成长股权/特殊机会的独立投资人，前 Tiny 董事总经理） | 发布 2026-07-07 | Tier S | 分类 财经/投资\n- 🔗 原片链接: https://podcasts.apple.com/us/podcast/invest-like-the-best-with-patrick-oshaughnessy/id1154105909\n- 🔗 文字版/整理来源: https://finance.biggo.com/news/fc081c48b1d67a99 （BigGo Finance 深度整理，含大量直接引语）\n\n> 取材说明：本笔记基于上述第三方深度整理稿（含 Giffon 大量直接引语）与 Colossus 官方节目页整理。引用句取自该整理稿所标注的嘉宾原话；未获取到 Colossus 官方逐字全文 transcript，个别措辞可能与最终逐字稿略有出入，核心论点与数据已交叉核对。\n\n## 30 秒速览 (TL;DR)\n\nGiffon 在 18 个月、数百场与创始人和资金方的对话之后，抛出一个反共识主命题：**金融资本不再是稀缺资产，注意力才是**。谁能捕获、塑造、投放注意力——常常只靠 X 上一条帖子——谁就在支配数十亿资金的流向。他给这股力量命名为「Billion Dollar PDF」：一份在最大不确定性时刻把叙事「定下来」的文档/推文/宣言，资本会像追球的十岁小孩一样跟着它满场跑。与此并行的是软件商业模式的结构性转变：AI 时代每次推理都要真金白银的算力，SaaS 的零边际成本优势消失，行业走向「低毛利、极薄净利、超大规模」的沃尔玛式赢家通吃。\n\n## 一句话主线\n\n当叙事注意力取代金融资本成为最稀缺资源，投资的最高杠杆技能，从「算清价值」变成了「读懂并塑造那份让资本追着跑的 Billion Dollar PDF」——但真正的 alpha，恰恰藏在别人追叙事时你回去算价值的那一刻。\n\n## 核心论点与展开\n\n### 1. Billion Dollar PDF：叙事如何凭空塑造资本\nGiffon 观察到，现代金融最强大的力量之一是一份能在恐慌与不确定的时刻把故事定住的文档。他的原话是：「所有人都有点不确定、有点慌，不知道发生了什么，这时只要有人出来把故事和叙事定下来。它甚至不必是对的，但就是有那种自信——就是这样，跟我走。资本就跟着这份十亿美元 PDF 满场跑。」他把资本比作「一群追着球跑的十岁小孩」，而 PDF 就是那颗球。这解释了为什么某些毫无业绩的公司能融到数十亿，为什么「SaaS 已死」「AI capex 超级周期」这类叙事能在几周内重新分配巨额资金。\n\n### 2. uni-feed 与「发帖是最后一块伟大的精英制」\n结构性推手是他所谓的 **uni-feed**：X 每天算法推送给你约 500 条帖子，与你关注谁无关。发帖者对潜水者的比例极低——绝大多数 CEO、基金经理、政策制定者只看不发，而极少数「posters」为所有人设定议程。「发帖是最后一块伟大的精英制」：一个零粉丝新账号写出一条好帖，几小时内可触达数亿人，绕过精英媒体、信用背书机构与所有旧的权力网络。X 因此成了事实上的全球报纸，也成了政策与资本配置直接反应的场所。\n\n### 3. timeline-native 机构与「新祭司」\n生存的新条件是「timeline-native」：既要持续监控时间线并对其做出反应，又要意识到自身行动会反过来改变时间线，从而进入无尽回路。Giffon 认为当下白宫是第一个完全 timeline-native 的政府，但这一动力学同样适用于 VC、对冲基金和公司董事会。由此他画出一条「臣服链」：科学阶层臣服于亿万富翁阶层（他称之为 Epstein 教训——科学家围着金钱与光环打转），如今亿万富翁阶层又臣服于 **posting 阶层**。证据是：在一场富豪投资者聚会上，大家争的不是坐在最有钱的人旁边，而是坐在最有影响力的「poster-philosopher」旁边。\n\n### 4. peak guy：亿万富翁崇拜见顶\n社会大体已抛弃传统宗教与科学权威，亿万富翁曾是文化祭司的最后候选，但这个阶层已经太多、太稀释、失去了光环。Giffon 称之为 **peak guy**。理由：其一「billionaire」一词通胀到失去分辨率——Grant Cardone 和马斯克都叫 billionaire，这个类别不再提供任何有用信息；他提议改用「流动的、通胀调整后的亿万富翁」这一更严格标准。其二 net worth 是历史上很新的概念——他举《傲慢与偏见》中 Darcy 先生的财富是「每年一万英镑的地产现金流」，没人去 DCF 那处地产或问他的保证金贷款；而我们今天称为 net worth 的市值分数，可以随一条推文蒸发。其三权力已明显与单纯财富脱钩——卡内基能对罢工工人动用武力，而今天一个亿万富翁发错一条帖就可能被迫辞去自己基金会的职务。\n\n### 5. AI 时代 SaaS 的商业模式危机\n最可操作的投资洞见：软件的历史优势——每多卖一份边际成本约为零——在 AI 时代正在瓦解。「你不能只写一次 prompt 然后卖输出的副本，你每一次都要做 compute，边际成本不为零。高毛利成为常态的时代正在消失。」传统 SaaS 能维持 70–85% 毛利，是因为多发一份代码几乎零成本；AI 时代每次查询都烧真实资源，未来「看起来是低毛利、极薄净利、超大规模」，类比是沃尔玛而非精品店——「Walmart's coming to town」，遭殃的是夫妻店式的 SaaS 提供商。\n\n### 6. 资本吸收论与东西海岸薪酬对调\n他给出一个结构性解释：2016–2020 VC 回报太好，钱涌入这个资产类别，但伟大企业的数量受限于伟大创始人的数量，资本无处可去。「资本市场拼命想找地方投，却没有地方……于是这些公司几乎是在资本的下游被创造出来。资产是资本的海绵，如果钱无处可去，它就会创造一个去处。」AI 的巨额算力需求正好成了这块海绵——「这些公司融的钱与它们需要的钱无关」。与此同时薪酬结构完成对调：华尔街从「高现金无股权」变成 RSU（与母公司长期价值绑定），硅谷从「纸面财富、遥远退出」变成靠成熟二级市场每年套现现金（SpaceX、OpenAI 员工），反而更「雇佣兵化」。\n\n## 关键数据与事实\n- mega-cap 科技股 52 周波动率接近 100%（Giffon 引用），世界最大的三四万亿美元公司被群聊/爆款帖/算法叙事左右定价。\n- X 算法每天向每位用户推送约 500 条帖子（uni-feed）。\n- SaaS 毛利：AI 前约 70–85%，AI 时代估计降至 40–60%（节目内估算）。\n- 主持人 Patrick O'Shaughnessy 自陈约 60% 个人组合已转向纯软件之外的实物/非软件资产。\n- 部分私募 SPV 结构：10% 一次性前端费、零 GP 出资、无期限，中介永久收 2%；部分 Capital Group 十年前的结构至今仍在产生费用。\n\n## 金句 (Quotes)\n- \"Capital just follows the billion dollar PDF around the field.\" —— 资本就是跟着这份「十亿美元 PDF」满场跑。（Jeremy Giffon）\n- \"The era of high gross margins being the norm is going away.\" —— 高毛利成为常态的时代正在消失。（Jeremy Giffon）\n- \"Businesses and assets are sponges for capital. If it has nowhere to go, it will create somewhere for it to go.\" —— 企业和资产是资本的海绵；如果钱无处可去，它就会创造一个去处。（Jeremy Giffon）\n- \"I actually think it's more difficult for the professional money manager to beat the market than the average amateur.\" —— 我真心认为职业基金经理跑赢市场，比普通业余投资者更难。（Jeremy Giffon）\n\n## 思维模型 / 框架\n- **Billion Dollar PDF / 追球的孩子**：用「谁在场上定住了叙事」来解释资本流向，而非只看基本面。\n- **timeline-native / 反身回路**：机构既反应于时间线，又改变时间线——评估任何组织时可问它是否被这个回路支配。\n- **peak guy / 净资产是新发明**：对「财富=权力/权威」的祛魅，提醒把 mark-to-market 的分数与真实现金流、真实权力区分开。\n- **零边际成本终结 → 护城河/毛利重估**：给 AI/软件资产估值的第一性问题——它的边际成本是否真的为零。\n- **Rainwater 一页纸法**：一页黄纸写清 thesis，再加一个数字——「你投入了净资产的百分之几」，用敞口暴露真实信念。\n\n## 争议与反方视角\n- **是描述还是规范？** Giffon 精彩地描述了「注意力驱动资本」的现状，但这更多是对当下市场失灵/情绪化的刻画。若你相信长期基本面终会主导，那么「叙事定价」恰恰是 alpha 来源而非新常态——这也正是他自己「回去算价值」建议的隐含反面。\n- **SaaS 毛利下滑被夸大的可能**：推理成本随芯片/算法效率快速下降，若单位推理成本以数量级速度下探，AI 软件仍可能回到高毛利；「40–60%」只是当下估算而非定局。\n- **peak guy 的证伪风险**：「亿万富翁崇拜见顶」是关于文化拐点的判断，极难证伪；也可能只是精英圈层内部的审美疲劳，而非全社会权力结构的真实转移。\n- **利益相关**：Giffon 本人投资了本节目背后的公司，其「实物资产/非软件」倾向与主持人 60% 组合外移的自陈，可能存在叙事自证成分——恰好是他所批判的「Billion Dollar PDF」机制的一个现场样本。\n\n## 给 30 岁年轻人的 Takeaways\n1. **别人讲故事时，回去算价值**：把 Rainwater 的一页纸+「投入净资产百分之几」当成自己的决策模板，用敞口而非辞藻检验信念。\n2. **把「读懂并塑造叙事注意力」当成可训练的高杠杆技能**：它现在的边际回报，可能高于传统的建模与尽调；但要清醒它是工具而非信仰。\n3. **认清你所处的激励结构**：职业经理人被迫部署、要显得忙碌，反而更难跑赢；业余投资者最大的、也最被低估的优势，是可以耐心等待、什么都不做。\n4. **给 AI/软件资产估值先问边际成本**：零边际成本时代结束会重估整条 SaaS 赛道——分清「护城河建在界面/习惯上」还是「建在数据/网络/执行上」。\n\n## 延伸 (Rabbit Holes)\n- Richard Rainwater 的一页纸投资法与其传奇履历。\n- 「注意力经济」学术脉络：Herbert Simon「信息消耗注意力」的原始论断。\n- 与本期 a16z《Is Software Losing Its Head?》并读——从护城河位置看 SaaS 范式重写。\n- Kindleberger《Manias, Panics, and Crashes》与 Howard Marks 周期框架，用来对冲「叙事定价」的兴奋。\n- Blackstone/Apollo/KKR 的 LBO 起源 vs「如果核心种子是 seed investing 会长成什么样」的思想实验。\n"}, {"id": "2026-07-06-oddlots-prediction-markets-sharps", "podcast": "Odd Lots", "tier": "S", "category": "财经/投资", "title": "These Are the Sharps Actually Making Money on Prediction Markets", "title_en": "These Are the Sharps Actually Making Money on Prediction Markets", "guest": "Brian Golden、Daniel Reichman（私密 Discord「Maga Kiwi Club」的职业预测市场交易者）；Adam Iscoe（《纽约时报杂志》记者，刚撰文剖析这群人）", "guest_en": "Brian Golden & Daniel Reichman (professional prediction-market traders from the private 'Maga Kiwi Club' Discord); Adam Iscoe (NYT Magazine journalist who profiled them)", "host": "Joe Weisenthal、Tracy Alloway", "host_en": "Joe Weisenthal & Tracy Alloway", "date": "2026-07-06", "durationMin": 48, "worthScore": 4, "worthReason": "预测市场是 2026 最被热议、也最被误解的市场结构之一。这集罕见地请来真正稳定盈利的「sharps」，讲清楚钱到底怎么赚、系统性偏差在哪、以及内幕交易灰色地带——比泛泛而谈的政治押注深得多。", "worthReason_en": "Prediction markets are one of 2026's most hyped and most misunderstood market structures. This episode rarely gets the actual winning 'sharps' to explain how money is really made, where the systematic biases are, and the insider-trading grey zone — far deeper than generic election-betting talk.", "originalUrl": "https://omny.fm/shows/odd-lots/these-are-the-sharps-actually-making-money-on-prediction-markets", "transcriptUrl": "", "noteFile": "", "status": "done", "tldr": "预测市场里大量是纯投机和赌博，多数新手会亏光；但确实有一小群专注政治、经济议题的职业交易者在稳定赚钱。本集请到「Maga Kiwi Club」的两位 sharps 与刚为《纽约时报杂志》撰稿的记者，拆解他们如何发现机会、交易者的系统性偏差、以及如何看待内幕交易。", "tldr_en": "Much of prediction markets is pure speculation and gambling, and most newcomers lose; but a small group of professionals focused on politics and economics consistently make money. This episode brings two 'sharps' from the Maga Kiwi Club plus the NYT Magazine writer who profiled them, to unpack how they find edges, the systematic biases among traders, and how they view insider trading.", "detail": "随着 Kalshi、Polymarket 等平台在 2025–2026 的机构化与合法化，预测市场从边缘走向主流，但公众对「到底有没有人真赚钱、怎么赚」始终一知半解。这集 Odd Lots 直接请来两位圈内公认的 sharp——Brian Golden 和 Daniel Reichman，他们属于一个名为「Maga Kiwi Club」的私密 Discord，职业玩家在里面交换情报、真金白银下注；另外还请来刚在《纽约时报杂志》发表深度报道、剖析这群人的记者 Adam Iscoe。\n主持人 Joe 与 Tracy 首先摆出两个基本事实：其一，预测市场里很大一部分是纯粹的投机与赌博，押的很多是经济意义极小的事件；其二，如果你今天贸然入场，大概率会亏光。真正赚钱的是一小撮高度专注、通常聚焦政治与经济议题的交易者。\n对话的价值在于讲清「edge 从哪来」：sharps 会为一个看似简单的问题做出常人难以想象的功课——挖官方文件、追地方数据、盯计票流程、监控信息发布的时间差，本质上是在别人被情绪和噪音左右时保持纪律。他们还谈到交易者群体中的系统性偏差（例如对热门叙事、对「自己希望发生的结果」的持续性高估），这些偏差正是稳定盈利的来源。\n最具争议的一段是关于内幕交易与信息不对称：在政治、政策类合约里，什么算「内幕」、什么只是「做得更细」，边界远比股票市场模糊。嘉宾坦率讨论了他们如何看待这条灰线，以及这个空间面临的其他治理难题。整体来看，这集是把预测市场从「政治押注娱乐」拉回到「市场结构与信息经济学」视角的一次高质量对话；因无公开全文 transcript，本卡片基于官方节目简介与彭博相关报道整理，未逐字引用嘉宾原话。", "detail_en": "As Kalshi, Polymarket and peers institutionalized and gained legal footing through 2025–2026, prediction markets moved from the fringe to the mainstream — yet the public still barely understands whether and how anyone actually makes money. This Odd Lots brings in two widely acknowledged sharps, Brian Golden and Daniel Reichman, members of a private Discord called the Maga Kiwi Club where pros swap intel and bet real money, alongside Adam Iscoe, the NYT Magazine writer who just profiled the group.\nJoe and Tracy set out two base facts: first, much of the space is pure speculation and gambling on events with little economic relevance; second, if you jump in cold today you'll probably lose your shirt. The people who make money are a small, highly focused cohort usually concentrated on politics and economics.\nThe value is in explaining where the edge comes from: sharps do remarkable homework on seemingly simple questions — digging through official documents, chasing local data, watching the counting process, and monitoring the timing of information releases — essentially staying disciplined while others are driven by emotion and noise. They also discuss systematic biases among traders (persistent overweighting of popular narratives and of the outcomes people want to happen), which are exactly what the pros harvest.\nThe most contentious stretch concerns insider trading and information asymmetry: in political and policy contracts, the line between 'inside information' and 'just doing deeper work' is far blurrier than in equities. The guests candidly discuss how they view that grey line and the other governance problems the space faces. Overall it drags prediction markets back from 'election-betting entertainment' toward market structure and information economics. With no public full transcript, this card is built from the official episode notes and related Bloomberg reporting, without verbatim guest quotes.", "points": ["预测市场里很大一部分是纯投机/赌博，押注对象常常经济意义极小；贸然入场的散户大概率亏损。", "真正稳定赚钱的是一小撮高度专注、通常聚焦政治与经济议题的职业交易者（sharps）。", "「Maga Kiwi Club」是一个私密 Discord，职业玩家在里面交换情报并真金白银下注。", "edge 来自极端的功课密度：挖官方文件、追地方数据、盯计票流程、监控信息发布时间差。", "sharps 的盈利很大程度来自利用交易者群体的系统性偏差（对热门叙事与「希望发生的结果」的持续高估）。", "内幕交易边界模糊：在政治/政策合约里，什么算「内幕」、什么只是「做得更细」，远比股票市场难界定。", "本集同时请到《纽约时报杂志》记者 Adam Iscoe，从外部观察者视角补充了对这群人的画像。", "主线是把预测市场从「政治押注娱乐」重新框定为「市场结构 + 信息经济学」问题。"], "points_en": ["A large share of prediction markets is pure speculation/gambling on economically trivial events; retail newcomers usually lose.", "The consistent winners are a small, highly focused cohort of pros usually concentrated on politics and economics (the 'sharps').", "The 'Maga Kiwi Club' is a private Discord where professional traders swap intel and bet real money.", "Edge comes from extreme homework: digging official documents, chasing local data, watching the count, and monitoring information-release timing.", "Much of the sharps' profit comes from exploiting systematic biases (persistent overweighting of popular narratives and wished-for outcomes).", "The insider-trading line is blurry: in political/policy contracts, 'inside information' vs 'deeper work' is far harder to define than in equities.", "NYT Magazine writer Adam Iscoe adds an outside-observer portrait of the group.", "The through-line reframes prediction markets from election-betting entertainment to market structure + information economics."], "takeaways": ["别把预测市场当成随手押注的娱乐——没有信息优势和纪律的散户，长期几乎必然是被收割的一方。", "任何市场里，可持续的 edge 往往来自「愿意为看似简单的问题做别人不愿做的功课」。", "识别并反向利用群体的系统性偏差（尤其是「希望它发生」带来的高估），是稳定盈利的通用心法。"], "takeaways_en": ["Don't treat prediction markets as casual entertainment — retail without information edge and discipline is, over time, the one being harvested.", "In any market, durable edge tends to come from being willing to do the homework on 'simple' questions that others won't.", "Spotting and fading a crowd's systematic biases — especially wishful overweighting — is a general recipe for consistent profit."], "quotes": [], "quotes_en": [], "data": ["单集时长约 48 分钟，2026-07-06 发布。", "嘉宾所属私密 Discord 名为「Maga Kiwi Club」。", "记者 Adam Iscoe 的相关深度报道刊于《纽约时报杂志》。"], "data_en": ["About 48 minutes long, published 2026-07-06.", "The guests' private Discord is called the 'Maga Kiwi Club'.", "Journalist Adam Iscoe's related feature ran in The New York Times Magazine."], "note": ""}, {"id": "2026-07-04-cogrev-ramin-hasani-liquid-edge-ai", "podcast": "The Cognitive Revolution", "tier": "A", "category": "科技/AI", "title": "Intelligence on the Edge: Liquid AI's Ramin Hasani on the Search for Device-Native Foundation Models", "title_en": "Intelligence on the Edge: Liquid AI's Ramin Hasani on the Search for Device-Native Foundation Models", "guest": "Ramin Hasani（Liquid AI 联合创始人兼 CEO，MIT CSAIL liquid time-constant networks 提出者之一）", "guest_en": "Ramin Hasani (Co-founder & CEO, Liquid AI; co-originator of liquid time-constant networks at MIT CSAIL)", "host": "Nathan Labenz", "host_en": "Nathan Labenz", "date": "2026-07-04", "durationMin": 107, "worthScore": 4, "worthReason": "在「scale is all you need」几乎成为共识的当下，这集是技术最扎实的「反对派」陈词：为什么高效、硬件感知的架构会长得和前沿注意力模型很不一样，以及端侧基础模型的真实商业化路径。", "worthReason_en": "With 'scale is all you need' now near-consensus, this is the most technically grounded loyal-opposition case: why efficient, hardware-aware architectures look very different from frontier attention models, and the real commercialization path for on-device foundation models.", "originalUrl": "https://www.cognitiverevolution.ai/intelligence-on-the-edge-liquid-ai-s-ramin-hasani-on-the-search-for-device-native-foundation-models/", "transcriptUrl": "", "noteFile": "", "status": "done", "tldr": "如果现代 AI 的主流叙事是「规模就是一切」，这集是技术上最扎实的反方陈词。Hasani 从 MIT 的 liquid time-constant networks 讲到「自动化基础模型设计」，论证高效、硬件感知的架构可以与前沿注意力模型长得完全不同，并聚焦手机/笔记本/汽车/可穿戴的端侧基础模型，包括 Liquid 开源的 LFM 系列及在 Shopify、Mercedes-Benz 的落地。", "tldr_en": "If the dominant AI story is 'scale is all you need', this is the most technically grounded rebuttal. Hasani goes from MIT's liquid time-constant networks to Automated Foundation Model Design, arguing efficient, hardware-aware architectures can look very different from frontier attention models — focused on device-native models for phones, laptops, cars and wearables, including Liquid's open-weight LFM family and deployments at Shopify and Mercedes-Benz.", "detail": "这集的核心张力是与「scale is all you need」正面交锋。Hasani 不否认规模的价值，但主张：一旦把约束从「云端刷榜」换成「在手机、笔记本、汽车、可穿戴设备上以低延迟、低功耗运行」，最优架构就会长得和前沿的超大注意力模型很不一样——门控卷积（gated convolutions）、选择性注意力等结构在端侧的性价比会反超单纯堆规模。\n他把 Liquid 的技术脉络讲清楚：起点是 MIT CSAIL 的 liquid time-constant networks（一类受生物神经元启发、以连续时间动力学刻画的网络），强调用更少参数捕捉时间结构；发展到今天的「Automated Foundation Model Design（自动化基础模型设计）」——不再靠人手工设计架构，而是让搜索/优化过程针对具体硬件与任务自动生成最合适的模型骨架。这条路线的价值主张是硬件感知：架构不是先设计好再想办法塞进设备，而是从一开始就围绕目标设备的内存、带宽、能耗来生成。\n落地层面，他谈到 Liquid 开源的 LFM（Liquid Foundation Models）系列，以及在 Shopify、Mercedes-Benz 的生产部署——把「端侧基础模型」从论文口号变成了有真实客户的产品形态。对一个 30 岁的读者，这集的价值不在于站队「规模派 vs 效率派」，而在于理解一个正在展开的分叉：云端前沿模型继续追逐能力上限，而端侧、隐私敏感、低延迟场景可能长出另一套完全不同的技术与商业逻辑。\n因暂无公开全文 transcript，本卡片基于官方节目页与配套 newsletter 摘要整理，未逐字引用嘉宾原话；具体基准数字（如某模型在某设备的时延/能耗）以官方后续披露为准，此处不强行给出。", "detail_en": "The core tension is a head-on clash with 'scale is all you need.' Hasani doesn't deny scale's value but argues that once you swap the constraint from 'topping cloud leaderboards' to 'running at low latency and low power on phones, laptops, cars and wearables,' the optimal architecture looks very different from frontier mega-attention models — gated convolutions and selective attention become more cost-effective on-device than brute scale.\nHe lays out Liquid's technical lineage: it starts with MIT CSAIL's liquid time-constant networks (biologically inspired networks described by continuous-time dynamics) that capture temporal structure with fewer parameters, and evolves into Automated Foundation Model Design — instead of hand-designing architectures, a search/optimization process auto-generates the best model backbone for specific hardware and tasks. The value proposition is hardware-awareness: architecture is generated around a target device's memory, bandwidth and energy from the start, not designed first and squeezed in later.\nOn commercialization he covers Liquid's open-weight LFM (Liquid Foundation Models) family and production deployments at Shopify and Mercedes-Benz — turning 'device-native foundation models' from a slogan into products with real customers. For a 30-year-old reader the value isn't picking sides in scale-vs-efficiency, but grasping an unfolding fork: cloud frontier models keep chasing the capability ceiling, while on-device, privacy-sensitive, low-latency use cases may grow an entirely different technical and business logic.\nWith no public full transcript yet, this card is built from the official episode page and companion newsletter summary, without verbatim quotes; specific benchmark figures are left to official disclosure rather than asserted here.", "points": ["正面挑战「scale is all you need」：换成端侧低延迟、低功耗约束后，最优架构会与前沿注意力模型长得很不一样。", "技术起点是 MIT CSAIL 的 liquid time-constant networks——受生物神经元启发、以连续时间动力学刻画，用更少参数捕捉时间结构。", "核心方法论是「Automated Foundation Model Design」：让搜索/优化针对具体硬件与任务自动生成模型骨架，而非人工手搓架构。", "强调硬件感知：架构从一开始就围绕目标设备的内存、带宽、能耗来生成，而不是先设计再硬塞。", "端侧基础模型的目标载体明确：手机、笔记本、汽车、可穿戴设备。", "Liquid 走开源路线，发布 LFM（Liquid Foundation Models）系列开源权重模型。", "已有真实生产部署：Shopify、Mercedes-Benz，说明端侧路线不只是论文口号。", "更宏观的含义：云端前沿模型与端侧高效模型可能分叉出两套完全不同的技术与商业逻辑。"], "points_en": ["A direct challenge to 'scale is all you need': under on-device low-latency, low-power constraints, the optimal architecture looks very different from frontier attention models.", "The technical root is MIT CSAIL's liquid time-constant networks — biologically inspired, continuous-time dynamics capturing temporal structure with fewer parameters.", "The core methodology is Automated Foundation Model Design: search/optimization auto-generates model backbones for specific hardware and tasks rather than hand-crafting them.", "Hardware-awareness is central: architectures are generated around a target device's memory, bandwidth and energy from the outset.", "Clear target devices for on-device foundation models: phones, laptops, cars, wearables.", "Liquid takes an open route, releasing the open-weight LFM (Liquid Foundation Models) family.", "Real production deployments exist at Shopify and Mercedes-Benz, showing the on-device path is more than a paper slogan.", "The bigger implication: cloud frontier models and efficient on-device models may fork into two entirely different technical and business logics."], "takeaways": ["「更大」不总是「更好」——当约束条件变化（设备、功耗、延迟、隐私），最优解会随之改变；对任何工程/职业决策同理。", "关注「自动化设计」这一元趋势：当设计过程本身被自动化，护城河从「手艺」转向「目标函数与约束的定义能力」。", "端侧 AI 是一个容易被云端叙事淹没、但商业化正在真实发生的赛道，值得放进个人的技术与投资雷达。"], "takeaways_en": ["Bigger isn't always better — when constraints change (device, power, latency, privacy), the optimum changes too; the same holds for engineering and career decisions.", "Watch the meta-trend of automated design: when the design process itself is automated, the moat shifts from craft to the ability to define objectives and constraints.", "On-device AI is easily drowned out by cloud narratives but is commercializing for real — worth keeping on your tech and investing radar."], "quotes": [], "quotes_en": [], "data": ["单集时长约 1 小时 47 分钟，2026-07-04 发布。", "Liquid 开源模型系列名为 LFM（Liquid Foundation Models）。", "已披露的生产部署客户包括 Shopify 与 Mercedes-Benz。", "技术源头为 MIT CSAIL 的 liquid time-constant networks。"], "data_en": ["About 1 hour 47 minutes long, published 2026-07-04.", "Liquid's open model family is called LFM (Liquid Foundation Models).", "Disclosed production deployments include Shopify and Mercedes-Benz.", "The technical origin is MIT CSAIL's liquid time-constant networks."], "note": ""}, {"id": "2026-07-07-timferriss-874-guy-oseary", "podcast": "The Tim Ferriss Show", "tier": "A", "category": "人物访谈", "title": "Guy Oseary — The Legendary Hollywood Power Broker on 5-Minute Decisions, 36 Years of Managing Madonna, 26 IPOs, and Spotting Magic First (#874)", "title_en": "Guy Oseary — The Legendary Hollywood Power Broker on 5-Minute Decisions, 36 Years of Managing Madonna, 26 IPOs, and Spotting Magic First (#874)", "guest": "Guy Oseary（Madonna/U2/Red Hot Chili Peppers 经纪人，Maverick 唱片；Sound Ventures 联合创始人，管理规模近 20 亿美元）", "guest_en": "Guy Oseary (manager of Madonna, U2, Red Hot Chili Peppers; Maverick Records; co-founder of Sound Ventures, ~$2B AUM)", "host": "Tim Ferriss", "host_en": "Tim Ferriss", "date": "2026-07-07", "durationMin": 88, "worthScore": 4, "worthReason": "一个把「识别人才」做了近四十年、横跨音乐/影视/风投三界的顶级操盘手，讲清楚「magic 先于一切」的判断法、5 分钟决策、以及把创始人当摇滚明星看的投资视角——方法论迁移性极强。", "worthReason_en": "A top operator who has spotted talent for nearly four decades across music, film and VC, articulating his 'magic first' judgment, 5-minute decisions, and treating founders like rock stars — highly transferable methodology.", "originalUrl": "https://tim.blog/2026/07/07/guy-oseary/", "transcriptUrl": "https://tim.blog/2026/07/08/guy-oseary-transcript/", "noteFile": "", "status": "done", "tldr": "Oseary 从西好莱坞的一个阳台起步，15 岁做起自己的厂牌，最终成为 Madonna、U2、Red Hot Chili Peppers 的经纪人，又把同一套「识别 magic」的能力搬进风投，在 Sound Ventures 收获 86 次退出、26 次 IPO（Airbnb/Uber/Spotify）。核心方法：一切始于 magic，把每个创始人当成有音乐要分享给世界的摇滚明星。", "tldr_en": "From a West Hollywood balcony to running his own label at 15, Oseary became manager to Madonna, U2 and Red Hot Chili Peppers, then carried the same 'spot the magic' skill into VC — 86 exits and 26 IPOs at Sound Ventures (Airbnb/Uber/Spotify). Core method: it all starts with magic, and treat every founder like a rock star with music to share with the world.", "detail": "这集是一位跨界近四十年的顶级「人才猎手」的方法论自述。Oseary 的起点极具张力：少年时在 Pico Boulevard 遭遇持刀事件后当机立断转学，甚至伪造比佛利山地址挤进另一个世界；15 岁就靠 Wise Guy Records 白手起家攒出一个作品集。当 Bernie Brillstein 提出给他 2.5 万美元时，他反而提出了自己的条件；随后进入 Freddy DeMann 与 Maverick 唱片的体系——甚至以「不要薪水」换来一张办公桌。\n他反复强调的判断内核是「magic」：不管是科技公司、电影、产品还是书，「一切都始于 magic，必须有某种东西把你拉进去」。他讲了几个极端的快速判断案例——在只有 30 人的房间里看 Candlebox，却「看见了成千上万人」；仅凭一首歌就签下 Alanis Morissette（后来那张首专卖出约 3000 万张）；在 Muse 试音中途就叫停拍板。这些都是「5 分钟决策」的注脚：他信任被高强度训练过的直觉，且认为「有时没有选择、没有退路，反而是最好的选择」。\n从音乐到影视，他把《Twilight》做成累计超 35 亿美元的系列，靠的是「空白画布」的想象力；他说 Madonna 教会他「不设墙地思考」。进入投资后，他把同一视角迁移过来：「我投的每一个创始人，我都把他们当成摇滚明星——那个人有音乐想分享给世界。」A-Grade 时期押中 Airbnb、Uber、Spotify；Sound Ventures 从不到 1 亿美元起步，做到近 20 亿美元管理规模、86 次退出、26 次 IPO。他还谈到用「三个月的窗口」抓住 OpenAI 与 Anthropic，以及在 AI 音乐浪潮里为「让人类音乐人拿到报酬」而战——直言「fair use is not fair」。\n难得的是结尾的反鸡汤：他说自己「不觉得功成名就，甚至没什么感觉，觉得还有太多要证明、太多要做」，也提到与 Ashton Kutcher 二十年合作后的分道扬镳。本卡片引用均取自 tim.blog 官方页发布的嘉宾原话与结构化时间戳。", "detail_en": "This is a methodology memoir from a top talent-spotter spanning nearly four decades. Oseary's origin has real tension: after a knife incident on Pico Boulevard as a teen he switched schools on the spot, even faking a Beverly Hills address to get inside another world; at 15 he bootstrapped a portfolio via Wise Guy Records. When Bernie Brillstein offered him $25,000, he countered with his own terms, then entered Freddy DeMann's orbit and Maverick Records — trading 'no salary' for a desk.\nHis judgment core is 'magic': whether a tech company, film, product or book, 'it always starts with the magic — something has to pull you in.' He recounts extreme fast calls — seeing Candlebox in a room of 30 and 'seeing thousands'; signing Alanis Morissette off a single song (that debut sold ~30 million); stopping Muse mid-audition to commit. These footnote his '5-minute decisions': he trusts a heavily trained gut, and holds that 'sometimes having no options and no choice is really the best option.'\nFrom music to film he turned Twilight into a >$3.5B franchise via a 'blank canvas' imagination; he says Madonna taught him to think 'without walls.' In investing he ports the same lens over: 'every founder I invest in, I look at them like they are the rock star — that person has music they want to share with the world.' At A-Grade he hit Airbnb, Uber and Spotify; Sound Ventures launched with under $100M and grew to ~$2B AUM, 86 exits and 26 IPOs. He describes a 'three-month window' that caught OpenAI and Anthropic, and fighting to ensure human musicians get paid amid AI music — bluntly, 'fair use is not fair.'\nRefreshingly anti-cliché at the end: he says he 'doesn't feel accomplished, doesn't feel at all,' still with 'so much to prove and so much to do,' and touches on splitting with Ashton Kutcher after 20 years. All quotes here are from the guest's own words and structured timestamps published on tim.blog.", "points": ["「magic 先于一切」：无论科技/电影/产品/书，第一判据永远是「有没有某种东西把你拉进去」，而非履历或数据。", "5 分钟决策：在只有 30 人的房间里看 Candlebox 就「看见成千上万人」；仅凭一首歌签下 Alanis（首专卖约 3000 万张）；Muse 试音中途就拍板。", "「有时没有选择、没有退路，反而是最好的选择」——把约束当成聚焦而非限制。", "把投资对象当摇滚明星：每个创始人都是「有音乐想分享给世界的人」，用做经纪的眼光做风投。", "从音乐到影视：把《Twilight》做成累计 >35 亿美元的系列，靠的是「空白画布」式想象；Madonna 教他「不设墙地思考」。", "投资战绩：A-Grade 押中 Airbnb/Uber/Spotify；Sound Ventures 从 <1 亿美元起步，做到近 20 亿美元 AUM、86 次退出、26 次 IPO。", "用「三个月窗口」抓住 OpenAI 与 Anthropic，显示他把「快速识别+果断下注」从艺人复制到前沿科技。", "在 AI 音乐上为人类音乐人争取报酬，直言「fair use is not fair」，是内容版权与 AI 冲突的一线视角。", "反鸡汤收尾：坦承「不觉得功成名就、甚至没什么感觉，还有太多要证明」；并谈与 Ashton Kutcher 二十年后的分手。"], "points_en": ["Magic first: for tech, film, product or book, the first criterion is always whether 'something pulls you in,' not résumé or metrics.", "5-minute decisions: seeing 'thousands' in a 30-person Candlebox room; signing Alanis off one song (debut sold ~30M); committing to Muse mid-audition.", "'Sometimes having no options and no choice is really the best option' — constraint as focus, not limitation.", "Treat investees like rock stars: every founder is 'someone with music to share with the world' — VC through a talent-manager's eyes.", "From music to film: Twilight became a >$3.5B franchise via 'blank canvas' imagination; Madonna taught him to think 'without walls.'", "Track record: A-Grade hit Airbnb/Uber/Spotify; Sound Ventures went from <$100M to ~$2B AUM, 86 exits, 26 IPOs.", "A 'three-month window' caught OpenAI and Anthropic — porting fast-recognition-plus-decisive-betting from artists to frontier tech.", "On AI music he fights for human musicians to get paid, bluntly calling 'fair use is not fair' — a front-line view on content rights vs AI.", "Anti-cliché ending: admits he 'doesn't feel accomplished, doesn't feel at all,' with 'so much to prove'; and discusses splitting with Ashton Kutcher after 20 years."], "takeaways": ["先找「magic」再谈其他：无论招人、选项目还是做产品，先问「它有没有把我拉进去的那种拉力」，别被履历和指标带偏。", "训练你的直觉，然后敢于 5 分钟拍板：快速判断不是鲁莽，而是长期高强度输入后的压缩结果。", "把「约束」重新框定为「聚焦」——没有退路时反而更容易做出最好的决定。", "把你评估的人当成「有东西想分享给世界的主角」，这种共情视角能帮你看见别人错过的潜力。"], "takeaways_en": ["Find the 'magic' first: when hiring, picking projects or building product, ask whether it pulls you in — don't be led astray by résumés and metrics.", "Train your gut, then dare to decide in 5 minutes: fast judgment isn't recklessness but the compressed output of long, intense input.", "Reframe 'constraint' as 'focus' — with no way out you often make your best decisions.", "See the person you're evaluating as a protagonist with something to share with the world; that empathy helps you see potential others miss."], "quotes": ["It always starts with the magic... You've got to have magic. Something has to pull you in. —— 一切都始于 magic……你必须要有 magic，得有某种东西把你拉进去。（Guy Oseary）", "Every founder I invest in, I look at them like they are the rock star. —— 我投的每一个创始人，我都把他们当成摇滚明星。（Guy Oseary）", "Sometimes having no options and no choice is really the best option. —— 有时没有选择、没有退路，反而是最好的选择。（Guy Oseary）"], "quotes_en": ["It always starts with the magic... You've got to have magic. Something has to pull you in. (Guy Oseary)", "Every founder I invest in, I look at them like they are the rock star. (Guy Oseary)", "Sometimes having no options and no choice is really the best option. (Guy Oseary)"], "data": ["Maverick 唱片在其领导下销量超 1 亿张；《Twilight》系列累计 >35 亿美元。", "Sound Ventures 起步资金 <1 亿美元，现管理规模近 20 亿美元，86 次退出、26 次 IPO。", "早期投资命中 Airbnb、Uber、Spotify（A-Grade Investments 时期）。", "2022 年获《Variety》评为年度音乐大亨（Music Mogul of the Year）。"], "data_en": ["Maverick Records sold >100M albums under his leadership; the Twilight franchise grossed >$3.5B.", "Sound Ventures launched with <$100M and now has ~$2B AUM, 86 exits and 26 IPOs.", "Early hits include Airbnb, Uber and Spotify (A-Grade Investments era).", "Named Variety's Music Mogul of the Year in 2022."], "note": ""}, {"id": "2026-07-07-mfm-839-nyc-business-lessons", "podcast": "My First Million", "tier": "A", "category": "创始人/商业", "title": "5 Ruthless Business Lessons From One Week in NYC [EP.839]", "title_en": "5 Ruthless Business Lessons From One Week in NYC [EP.839]", "guest": "（无外部嘉宾，双主持漫谈）", "guest_en": "(no outside guest; two-host riff)", "host": "Sam Parr、Shaan Puri", "host_en": "Sam Parr & Shaan Puri", "date": "2026-07-07", "durationMin": null, "worthScore": 3, "worthReason": "双主持把 Shaan 一周纽约行提炼成 5 条关于「邻近性/信任/城市品牌/营销」的实战观察，框架清晰、可迁移；属于轻量但有干货的一集，适合通勤时快速吸收。", "worthReason_en": "The two hosts distill Shaan's week in NYC into 5 practical observations on proximity, trust, city brands and marketing — clear, transferable frameworks. A light but useful episode, good for a quick commute listen.", "originalUrl": "https://www.mfmpod.com/5-ruthless-business-lessons-from-one-week-in-nyc/", "transcriptUrl": "", "noteFile": "", "status": "done", "tldr": "Shaan 用一周纽约行提炼 5 条商业启示，核心围绕「邻近性」（proximity）——身处高能量、高密度的环境如何改变你接触到的人、机会与野心；并延伸到信任如何加速交易、城市作为品牌的势能、以及线下场景里的营销心法。", "tldr_en": "Shaan distills a week in NYC into 5 business lessons centered on proximity — how being in a high-energy, high-density environment changes the people, opportunities and ambition you're exposed to — extending to how trust accelerates deals, cities as brands, and marketing lessons from offline settings.", "detail": "这是 MFM 典型的「双主持把一次亲身经历拆成可复用框架」的一集。触发点是 Shaan 在纽约待了一周，回来后和 Sam 一起把体感提炼成 5 条商业启示，主线是「邻近性（proximity）」。\n第一条也是最重的一条就是 proximity：当你把自己放进一个高密度、高能量、野心外溢的环境，你能接触到的人、听到的对话、被激发的标准都会不同——地理上的靠近本身就是一种杠杆。这与他们长期主张的「环境塑造人」一脉相承：想变成什么样的人，先把自己搬到那种人聚集的地方。\n随后几条围绕展开：「这到底意味着什么」（追问表象背后的真实机制）、「信任」（在纽约这种高频交易的城市，信任如何成为压缩交易时间与成本的核心资产）、「城市品牌」（纽约作为一个品牌所积累的势能，如何让身处其中的人和公司免费搭上叙事顺风车）、以及「营销」（从线下、面对面的场景里观察到的、可迁移到任何生意的营销心法）。\n需要如实标注的是节目定位：MFM 是双主持漫谈型节目，风格轻快、偶有鸡汤化倾向，长处是「点子密度」和「框架直觉」，而非严谨论证或一手数据。因此本集更适合当作「思维触发器」来听——把 proximity、trust、city brand 这几个词当成检查自己处境的透镜，而不必把每条都奉为定论。本卡片基于官方 show notes 的分段结构整理，未逐字引用主持人原话。", "detail_en": "This is a classic MFM episode where the hosts turn a personal experience into reusable frameworks. The trigger is Shaan's week in NYC; back home he and Sam distill it into 5 business lessons, anchored on proximity.\nThe first and heaviest lesson is proximity: put yourself in a high-density, high-energy, ambition-spilling environment and the people you meet, the conversations you overhear and the standards you're held to all change — geographic closeness is itself leverage. This tracks their long-standing 'environment shapes you' thesis: to become a certain kind of person, first move to where those people cluster.\nThe rest build on it: 'what does it really mean' (interrogating the mechanism behind appearances); 'trust' (in a high-frequency deal city like NYC, how trust becomes the key asset compressing deal time and cost); 'city brands' (the accumulated momentum of NYC as a brand, letting people and companies ride its narrative tailwind for free); and 'marketing' (lessons observed in offline, face-to-face settings that transfer to any business).\nA fair caveat on format: MFM is a two-host riff — breezy, occasionally self-help-ish — strong on idea density and framework intuition rather than rigorous argument or first-hand data. So treat this as a thinking trigger: use proximity, trust and city-brand as lenses on your own situation rather than gospel. This card is built from the segmented official show notes, without verbatim host quotes.", "points": ["Proximity 是主线：把自己放进高密度、高能量、高野心的环境，会实质改变你接触的人、机会与标准。", "「环境塑造人」的落地版：想成为某类人，先搬到那类人聚集的地方，地理靠近本身就是杠杆。", "「这到底意味着什么」：训练自己追问表象背后的真实机制，而不是停在第一层观察。", "信任是交易加速器：在高频交易的城市，信任是压缩时间与成本的核心资产。", "城市即品牌：纽约作为品牌的势能，让身处其中的人和公司免费搭上叙事顺风车。", "线下营销心法：从面对面场景观察到的、可迁移到任何生意的营销直觉。", "节目定位需注意：双主持漫谈、风格轻快、偶有鸡汤化，长处在点子密度与框架直觉，而非严谨论证或一手数据。"], "points_en": ["Proximity is the through-line: placing yourself in a high-density, high-energy, high-ambition environment materially changes the people, opportunities and standards you meet.", "The applied version of 'environment shapes you': to become a certain kind of person, move to where they cluster — geographic closeness is leverage.", "'What does it really mean': train yourself to interrogate the mechanism behind appearances, not stop at first-order observation.", "Trust is a deal accelerator: in a high-frequency deal city, trust is the key asset compressing time and cost.", "Cities as brands: NYC's brand momentum lets people and companies ride its narrative tailwind for free.", "Offline marketing intuition: lessons from face-to-face settings that transfer to any business.", "Format caveat: a two-host riff, breezy and sometimes self-help-ish; strong on idea density and framework intuition, not rigorous argument or first-hand data."], "takeaways": ["认真对待 proximity：主动把自己搬进你想进入的圈子和环境，接触面本身就会改变你的机会集。", "把信任当资产来经营：在任何高频协作/交易的场景里，可信度是最能压缩时间与成本的护城河。", "遇到亮眼现象时多问一层「这到底意味着什么」，把观察转成可迁移的机制，而不是停在感叹。"], "takeaways_en": ["Take proximity seriously: deliberately move yourself into the circles and environments you want to enter — exposure alone reshapes your opportunity set.", "Manage trust as an asset: in any high-frequency collaboration or dealmaking, credibility is the moat that most compresses time and cost.", "When you see a striking phenomenon, ask one layer deeper — 'what does it really mean' — turning observation into transferable mechanism rather than stopping at awe."], "quotes": [], "quotes_en": [], "data": ["官方 show notes 分段：Proximity / What does it really mean / Trust / City Brands / Marketing。", "单集编号 Episode 839，2026-07-07 发布。"], "data_en": ["Official show-note segments: Proximity / What does it really mean / Trust / City Brands / Marketing.", "Episode 839, published 2026-07-07."], "note": ""}, {"id": "2026-07-07-a16z-is-software-losing-its-head", "podcast": "a16z Podcast", "tier": "A", "category": "科技/AI", "title": "Is Software Losing Its Head?", "title_en": "Is Software Losing Its Head?", "guest": "Steven Sinofsky（a16z board partner，前微软 Windows 负责人）、Seema Amble（a16z 合伙人）、Elena Burger（a16z 合伙人）", "guest_en": "Steven Sinofsky (a16z board partner, former head of Windows), Seema Amble (a16z partner), Elena Burger (a16z partner)", "host": "a16z 团队", "host_en": "a16z team", "date": "2026-07-07", "durationMin": null, "worthScore": 4, "worthReason": "直击企业软件最大问题：当 AI agent 而非人成为软件的主要用户，SaaS 的护城河（人待在界面里）会失效——防御性向下沉到数据/权限/合规、向上升到网络与真实世界执行。与本期 Giffon 的 SaaS 论形成绝佳对照。", "worthReason_en": "Hits enterprise software's biggest question: when AI agents, not humans, become software's primary users, the SaaS moat (humans living in the UI) weakens — defensibility sinks into data/permissions/compliance and rises into networks and real-world execution. A perfect counterpoint to Giffon's SaaS thesis this week.", "originalUrl": "https://a16z.com/is-software-losing-its-head/", "transcriptUrl": "https://a16z.com/is-software-losing-its-head/", "noteFile": "", "status": "done", "tldr": "当 AI agent 取代人成为软件的主要「用户」，SaaS 时代靠「人待在界面里」建立的护城河开始松动。防御性正在双向迁移：向下沉入数据模型、权限、工作流逻辑与合规，向上升入网络效应、专有数据生成与真实世界执行。触发点是 Salesforce 宣布开放 API、推出 headless 产品，押注价值在数据层而非 UI。", "tldr_en": "When AI agents replace humans as software's primary 'users,' the SaaS-era moat built on humans living in the UI starts to loosen. Defensibility migrates both ways: down into data models, permissions, workflow logic and compliance, and up into network effects, proprietary data generation and real-world execution. The trigger is Salesforce opening its APIs and launching a headless product, betting value sits in the data layer, not the UI.", "detail": "这集把企业软件正在发生的结构性问题摆上台面：如果软件的主要用户从人变成 AI agent，那么整个 SaaS 商业模式的护城河逻辑都要重估。\n在 SaaS 时代，system of record（记录系统）之所以防御性强，是因为人「活在界面里」——UI、习惯、切换成本共同锁住用户。但在 agentic 时代，agent 直接调用 API、在后台跑工作流，人不再需要待在界面里，UI 这层护城河随之削弱。嘉宾据此提出防御性「双向迁移」：向下，护城河沉入数据模型、权限体系、工作流逻辑与合规能力（这些是 agent 也绕不开的底座）；向上，护城河升入网络效应、专有数据的持续生成、以及在真实世界里执行动作的能力。\n直接触发这场讨论的是 Salesforce 的动作：它宣布开放 API、推出 headless（无界面）产品，等于公开下注——在 agent 世界里，它的价值在数据层而不在 UI。文章/对话还给出软件公司的应对策略谱系：既可以「用现有系统 + agent」（如 Salesforce Agentforce、SAP Joule 这类把 agent 叠加在既有系统之上的路径），也可以在这些系统之上自建 agent。Steven Sinofsky 以其 Windows 与平台经验，Seema Amble、Elena Burger 从企业/金融科技视角，一起拆解「当界面不再是人机接触点，软件公司到底卖什么」。\n对读者的价值在于一个清晰的判断框架：评估任何 SaaS 资产时，问它的护城河到底建在「人待在界面里」还是「数据/网络/执行」上——前者在 agentic 时代会贬值，后者才可能长期成立。这也与本期 Giffon「SaaS 零边际成本终结」的判断形成互补：一个从毛利结构、一个从护城河位置，指向同一个结论——旧 SaaS 范式正在被重写。本卡片基于 a16z 官方文章与节目页整理。", "detail_en": "This episode puts enterprise software's structural problem on the table: if software's primary user shifts from humans to AI agents, the entire SaaS moat logic must be re-rated.\nIn the SaaS era the system of record was defensible because humans lived in the interface — UI, habit and switching costs locked users in. In the agentic era agents call APIs directly and run workflows in the background; humans no longer need to sit in the UI, so that moat weakens. The guests argue defensibility migrates both ways: downward into data models, permissions, workflow logic and compliance (the substrate agents still can't bypass); and upward into network effects, ongoing proprietary data generation and the ability to execute actions in the real world.\nThe direct trigger is Salesforce's move: opening its APIs and launching a headless product — a public bet that in an agentic world its value lies in the data layer, not the UI. The piece/discussion lays out a spectrum of responses for software companies: use incumbent systems with agents (e.g., Salesforce Agentforce, SAP Joule layering agents atop existing systems), or build your own agents on top of them. Steven Sinofsky brings Windows and platform experience; Seema Amble and Elena Burger bring enterprise/fintech lenses to 'what does a software company actually sell when the interface is no longer the point of human contact.'\nThe reader value is a clean judgment framework: when evaluating any SaaS asset, ask whether its moat is built on 'humans living in the UI' or on 'data/networks/execution' — the former devalues in the agentic era, the latter can endure. This complements Giffon's 'end of zero-marginal-cost SaaS' this week: one from gross-margin structure, one from moat location, pointing to the same conclusion — the old SaaS paradigm is being rewritten. This card is built from a16z's official article and episode page.", "points": ["核心问题：当 AI agent 而非人成为软件的主要用户，SaaS 靠「人待在界面里」建立的护城河会失效。", "SaaS 时代 system of record 的防御性来自 UI、习惯与切换成本；agentic 时代 agent 直接调 API，UI 这层护城河削弱。", "防御性向下迁移：沉入数据模型、权限体系、工作流逻辑与合规——这些是 agent 绕不开的底座。", "防御性向上迁移：升入网络效应、专有数据的持续生成、以及在真实世界执行动作的能力。", "直接触发点：Salesforce 开放 API、推出 headless 产品，公开下注价值在数据层而非 UI。", "应对策略谱系：既可「现有系统 + agent」（Salesforce Agentforce、SAP Joule），也可在其上自建 agent。", "嘉宾阵容强：Steven Sinofsky（前 Windows 负责人）+ Seema Amble、Elena Burger（企业/金融科技视角）。", "与本期 Giffon「SaaS 零边际成本终结」互补：一从毛利结构、一从护城河位置，共同指向旧 SaaS 范式被重写。"], "points_en": ["Core question: when AI agents, not humans, become software's primary users, the SaaS moat built on 'humans living in the UI' fails.", "In SaaS, the system of record was defensible via UI, habit and switching costs; in the agentic era agents call APIs directly and that UI moat weakens.", "Defensibility migrates down: into data models, permissions, workflow logic and compliance — the substrate agents can't bypass.", "Defensibility migrates up: into network effects, ongoing proprietary data generation, and real-world execution.", "Direct trigger: Salesforce opens its APIs and launches a headless product, publicly betting value sits in the data layer, not the UI.", "Response spectrum: 'incumbent systems + agents' (Salesforce Agentforce, SAP Joule) or build your own agents on top.", "Strong lineup: Steven Sinofsky (former head of Windows) plus Seema Amble and Elena Burger (enterprise/fintech lenses).", "Complements Giffon's 'end of zero-marginal-cost SaaS' this week: gross-margin structure vs moat location, both pointing to the old SaaS paradigm being rewritten."], "takeaways": ["评估任何 SaaS 资产时，先定位它的护城河：建在「人待在界面里」的会在 agentic 时代贬值，建在「数据/网络/真实执行」的才可能长期成立。", "如果你在做软件，尽早想清楚「当用户是 agent 而不是人」时你卖的到底是什么——是界面，还是数据、权限与执行能力。", "关注 headless / API-first 的转向：它不是技术细节，而是企业软件价值链重新分配的信号。"], "takeaways_en": ["When evaluating any SaaS asset, locate its moat first: those built on 'humans in the UI' devalue in the agentic era; those built on data/networks/real-world execution can endure.", "If you build software, decide early what you sell when the user is an agent, not a human — the interface, or data, permissions and execution.", "Watch the headless / API-first shift: it's not a technical detail but a signal of enterprise software's value chain being reallocated."], "quotes": [], "quotes_en": [], "data": ["触发事件：Salesforce 宣布开放 API 并推出 headless 产品。", "既有系统叠加 agent 的代表产品：Salesforce Agentforce、SAP Joule。", "对话嘉宾：Steven Sinofsky、Seema Amble、Elena Burger。"], "data_en": ["Trigger event: Salesforce announced open APIs and a headless product.", "Representative 'agents atop incumbent systems' products: Salesforce Agentforce, SAP Joule.", "Discussants: Steven Sinofsky, Seema Amble, Elena Burger."], "note": ""}, {"id": "2026-07-20-oddlots-boris-cherny-claude-code", "podcast": "Odd Lots", "tier": "S", "category": "科技/AI", "title": "The Creator of Claude Code on The Hottest Piece of Software in the World", "title_en": "The Creator of Claude Code on The Hottest Piece of Software in the World", "guest": "Boris Cherny（Anthropic 工程师，Claude Code 创造者/负责人）", "guest_en": "Boris Cherny (Anthropic engineer, creator and lead of Claude Code)", "host": "Joe Weisenthal & Tracy Alloway", "host_en": "Joe Weisenthal & Tracy Alloway", "date": "2026-07-20", "durationMin": 67, "worthScore": 5, "worthReason": "2026 年最重要软件的缔造者本人第一手复盘：从内部 side project 到引发市场恐慌的 agentic 编码工具，稀缺性与认知增量拉满；但无公开全文逐字稿，本卡片据官方节目简介与同期彭博报道线索整理。", "worthReason_en": "First-hand account from the creator of 2026's most consequential software: from internal side project to the agentic coding tool that incited a market scare. Guest scarcity and cognitive delta are maxed out; no public transcript, card based on the official description and companion Bloomberg reporting.", "originalUrl": "https://omny.fm/shows/odd-lots/the-creator-of-claude-code-on-the-hottest-piece-of-software-in-the-world", "transcriptUrl": "", "noteFile": "", "status": "done", "tldr": "Bloomberg 把 2026 年定义为“所有人都在谈 Claude Code 的一年”：这款始于 Boris Cherny 个人 side project 的 agentic 编码工具，一度引发软件股恐慌、催生 vibe coding 时代。Cherny 亲述早期故事、harness 的商业逻辑、安全对齐研究，以及当“写代码”被降权后他现在招工程师看什么。", "tldr_en": "Bloomberg calls 2026 'the year everyone is talking about Claude Code': the agentic coding tool that began as Boris Cherny's side project incited a software-stock scare and ushered in the vibe-coding era. Cherny tells the origin story, the business logic of a harness, safety and alignment work, and what he now hires engineers for once code-writing is deemphasized.", "detail": "这期的分量首先在于“谁在说”。Claude Code 是 2026 年软件业的中心事件：它把 agentic 编码从演示推向了职业程序员与业余爱好者的日常工作流，一度触发公开市场对传统软件公司的重新定价（即年初的“Claude Code market scare”），也让 vibe coding 成为行业通用词。而它并非 Anthropic 自上而下的战略产物——节目还原了它作为 Boris Cherny 个人 side project 起步的早期史：先在内部被工程师疯抢，再被公司追认为产品。这条“自下而上长出旗舰产品”的路径，本身就是对大公司创新机制的一个案例研究。\n第二层是 harness（模型外壳/执行框架）的商业逻辑。Cherny 讨论了一个此前很少被创造者本人正面回答的问题：像 Claude Code 这样的 harness 对 Anthropic 的商业目标究竟意味着什么——它既是 token 消耗的放大器，也是模型能力的放大镜；harness 做得越好，同一个模型能完成的任务半径越大，这与本周 Training Data 一期中 Anthropic 平台团队“策略层/给 token 分工”的说法互为印证（详见同日收录的 Training Data E94）。\n第三层是人才结构的重估。当“把代码写出来”这件事被模型接管、成为被降权的技能，Cherny 给出了他现在招聘工程师时看重的具体特质——系统判断、任务分解、验证与品味，这与本周 Lenny's 一期 Netflix CPTO Elizabeth Stone “systems thinking 是最重要的上升技能”的判断跨节目共振。节目也谈到当 Claude Code 越来越像 co-worker 而非工具时，人机协作的心理与组织变化。\n第四层是安全与对齐：作为把 agent 放进数百万台生产机器的人，Cherny 谈了安全与对齐研究如何进入产品决策。配套阅读方面，彭博同期两篇文章可作上下文：《For Software Engineers, the AI Reckoning Is Already Here》（7/16）与《Dimon Warns of Broad Mythos Access, Calling It a Real Issue》（7/15，摩根大通 CEO 戴蒙就 Mythos 级模型的宽泛开放提出风险警告）。\n取材说明：本集无公开全文逐字稿，本卡片基于 Odd Lots 官方节目简介与上述彭博报道线索整理，未引用嘉宾逐字原话；待官方 transcript 出现后可升级为深度笔记。", "detail_en": "What makes this episode weighty is who is speaking. Claude Code is the central event of 2026 software: it moved agentic coding from demos into the daily workflows of both professional and amateur developers, triggered a public-market repricing of traditional software companies (the 'Claude Code market scare'), and made vibe coding an industry term. Yet it was not a top-down strategy artifact — the episode recounts its origin as Boris Cherny's personal side project, first devoured by internal engineers, then ratified as a product. That bottom-up path to a flagship product is itself a case study in how innovation actually happens inside big companies.\nSecond layer: the business logic of a harness. Cherny addresses a question rarely answered by the creator himself — what a harness like Claude Code means for Anthropic's business: it is both an amplifier of token consumption and a magnifier of model capability; the better the harness, the larger the task radius of the same model. This dovetails with Anthropic platform team's 'strategies / giving tokens jobs' framing on this week's Training Data E94 (also collected today).\nThird layer: repricing talent. With code-writing deemphasized, Cherny lays out the specific traits he now hires engineers for — system judgment, task decomposition, verification and taste — resonating across shows with Netflix CPTO Elizabeth Stone's 'systems thinking is the top rising skill' on this week's Lenny's. He also discusses what changes psychologically and organizationally when Claude Code feels more like a co-worker than a tool.\nFourth layer: safety and alignment — how research enters product decisions when you are the person putting agents on millions of production machines. Companion Bloomberg reads: 'For Software Engineers, the AI Reckoning Is Already Here' (7/16) and 'Dimon Warns of Broad Mythos Access, Calling It a Real Issue' (7/15).\nSourcing: no public transcript; this card is based on the official episode description and the Bloomberg companion reporting, with no verbatim guest quotes.", "points": ["Claude Code 始于 Boris Cherny 的个人 side project，而非公司自上而下的战略立项——旗舰产品自下而上长出，是大公司创新机制的活案例。", "2026 年被 Bloomberg 定义为“所有人都在谈 Claude Code 的一年”：它引发了针对传统软件股的市场恐慌（market scare），并把 vibe coding 推成行业通用词。", "harness 的商业逻辑被创造者本人正面回答：它既放大 token 消耗、又放大模型能力，harness 质量直接决定同一模型的任务半径。", "当“写代码”成为被降权的技能，Cherny 招工程师的标准转向：系统判断、任务分解、验证能力与品味——与 Netflix Stone 的 systems thinking 判断跨节目共振。", "当 Claude Code 更像 co-worker 而非工具，人机协作的心理与组织形态随之改变——这是他与团队构建 agentic 工具时的核心设计问题之一。", "安全与对齐研究不是外挂，而是进入产品决策的内生环节：把 agent 放上数百万台生产机器的人如何想风险。", "配套语境（彭博同期）：软件工程师的“AI 清算”已经到来（7/16）；戴蒙警告 Mythos 级模型宽泛开放是“真实问题”（7/15）——本集是理解这两条新闻的最佳注脚。", "取材说明：无公开全文逐字稿，卡片据官方简介与彭博报道整理，未引用嘉宾逐字原话。"], "points_en": ["Claude Code began as Boris Cherny's personal side project, not a top-down strategic initiative — a flagship product growing bottom-up is a live case study of big-company innovation.", "Bloomberg frames 2026 as 'the year everyone is talking about Claude Code': it incited a market scare in traditional software stocks and made vibe coding an industry term.", "The business logic of a harness, answered by its creator: it amplifies both token consumption and model capability; harness quality sets the task radius of the same model.", "With code-writing deemphasized, Cherny's hiring bar shifts to system judgment, task decomposition, verification and taste — resonating with Netflix Stone's systems-thinking thesis this same week.", "When Claude Code feels like a co-worker rather than a tool, the psychology and org shape of human-AI collaboration change — a core design question for his team.", "Safety and alignment research is endogenous to product decisions when you put agents on millions of production machines.", "Companion context (Bloomberg, same week): 'For Software Engineers, the AI Reckoning Is Already Here' (7/16); 'Dimon Warns of Broad Mythos Access' (7/15) — this episode is the best footnote to both headlines.", "Sourcing: no public transcript; card built from the official description and Bloomberg companion reporting, no verbatim quotes."], "takeaways": ["职业安全边际的迁移方向已明确：从“会写代码”转向“会分解任务、会验证输出、有品味”——30 岁做技术相关工作的人应主动把时间重新配置到后三者。", "观察一家公司的创新力，看它能否让 side project 长成旗舰：如果你所在组织杀死一切自下而上的东西，这本身是个信号。", "投资视角：harness/agent 层的价值正在被公开市场重新定价，理解“harness 决定任务半径”比追逐模型参数更接近现金流。", "把 AI 当 co-worker 而非工具来设计自己的工作流：给它上下文、给它反馈回路，而不是把它当一次性问答机。"], "takeaways_en": ["The margin of career safety has moved: from writing code to decomposing tasks, verifying output and exercising taste — reallocate your hours accordingly.", "To gauge a company's innovative capacity, watch whether side projects can grow into flagships; an org that kills everything bottom-up is telling you something.", "Investor lens: the harness/agent layer is being repriced by public markets — understanding 'harness sets task radius' gets you closer to cash flows than chasing model parameters.", "Design your workflow treating AI as a co-worker, not a tool: give it context and feedback loops, not one-off Q&A."], "quotes": [], "quotes_en": [], "data": ["本集时长 1:06:36，发布于 2026-07-20（Odd Lots 官方播放列表置顶）。", "Claude Code 于 2026 年初引发针对传统软件公司的市场恐慌（market scare），并催生 vibe coding 一词的普及。", "彭博 7/16 配套文章：《For Software Engineers, the AI Reckoning Is Already Here》；7/15：《Dimon Warns of Broad Mythos Access, Calling It a Real Issue》。", "Claude Code 起源为 Anthropic 内部由 Boris Cherny 主导的 side project，后成为公司旗舰 agentic 编码产品。"], "data_en": ["Runtime 1:06:36, published 2026-07-20 (top of the official Odd Lots playlist).", "Claude Code incited a market scare in traditional software stocks in early 2026 and popularized the term vibe coding.", "Bloomberg companions: 'For Software Engineers, the AI Reckoning Is Already Here' (7/16); 'Dimon Warns of Broad Mythos Access, Calling It a Real Issue' (7/15).", "Claude Code originated as an internal Anthropic side project led by Boris Cherny before becoming the company's flagship agentic coding product."], "note": ""}, {"id": "2026-07-17-oddlots-menand-tankus-fed-independence", "podcast": "Odd Lots", "tier": "S", "category": "财经/投资", "title": "Lev Menand and Nathan Tankus on Why Fed Independence Is Now Hanging by a Thread", "title_en": "Lev Menand and Nathan Tankus on Why Fed Independence Is Now Hanging by a Thread", "guest": "Lev Menand（哥伦比亚法学院教授，货币法学者）、Nathan Tankus（Notes on the Crises 创办人/主席）", "guest_en": "Lev Menand (Columbia Law School professor, monetary law scholar) & Nathan Tankus (writer, president of Notes on the Crises)", "host": "Joe Weisenthal & Tracy Alloway", "host_en": "Joe Weisenthal & Tracy Alloway", "date": "2026-07-17", "durationMin": 66, "worthScore": 4, "worthReason": "Lisa Cook 案最高法院 5-4 判决后最专业的一次拆解：两位最懂货币法律架构的学者，把“Fed 例外”讲成一部从汉密尔顿开始的制度史。宏观投资者理解利率政治化风险的必修课。", "worthReason_en": "The most expert unpacking after the Supreme Court's 5-4 Lisa Cook ruling: two scholars who best understand the legal architecture of money turn the 'Fed exception' into an institutional history starting with Hamilton. Required for macro investors pricing politicized-rates risk.", "originalUrl": "https://omny.fm/shows/odd-lots/lev-menand-and-nathan-tankus-on-why-fed-independence-is-now", "transcriptUrl": "", "noteFile": "", "status": "done", "tldr": "去年 8 月特朗普史无前例地试图解雇美联储理事 Lisa Cook；缠讼一年后，最高法院今年 6 月以 5-4 判 Cook 胜诉——但同期另一案却允许总统解雇 FTC 委员，实质掏空了“独立机构”的宪法地位。两位学者拆解这对矛盾判决：Fed 为什么成了唯一例外，这个例外还能撑多久。", "tldr_en": "Last August Trump moved, unprecedentedly, to fire Fed governor Lisa Cook; after a year in the courts, the Supreme Court ruled 5-4 for Cook this June — while simultaneously allowing the president to fire FTC commissioners, gutting the constitutional status of 'independent agencies.' Two scholars unpack the contradiction: why the Fed became the lone exception, and how long the exception can hold.", "detail": "事件线：2025 年 8 月，特朗普政府以“有因解职”（理由是针对 Cook 的按揭欺诈指控调查）试图解雇美联储理事 Lisa Cook——这是美联储 112 年历史上首次有总统试图解雇在任理事。法律战缠斗近一年后打到最高法院，2026 年 6 月以 5-4 判 Cook 胜诉，Cook 留任。但真正的复杂性在同期另一案：最高法院允许总统解雇 FTC（联邦贸易委员会）个别委员，实质推翻了 1935 年 Humphrey's Executor 案以来“独立机构官员免于总统随意解职”的先例。\n于是出现了本集的核心问题：法院如何一边拆掉 FTC 的独立性、一边保住 Fed 的？Menand 刚在 Just Security 发表《The Federal Reserve Exception to the Slaughter Rule》，他的框架是：法院实际上创造了一个没有一般法理支撑的“美联储例外”——不是因为宪法文本区分了 Fed 与 FTC，而是因为多数派法官清楚市场后果：允许总统随意改组 FOMC，等于把全球无风险利率变成白宫的政策工具。这是一种“后果主义的例外”，它的稳固程度因此存疑。\n两位嘉宾把镜头拉长到“世代级”的法律史：从汉密尔顿设计第一银行开始，美国货币治理的独立性从来不是宪法明文，而是一系列政治妥协、判例与惯例的堆叠——这意味着它可以被同样的方式拆除。Tankus 长期追踪 Fed 的运作管道（他因 2023 年危机报道成名），指出即便 Cook 案胜诉，行政部门仍有大量“操作面”手段影响 Fed：任命、预算施压、公开胁迫、以及对下一任主席人选的市场预期管理。\n对投资者的含义：Fed 独立性如今“悬于一线”（hanging by a thread）不是修辞——它悬在一个 5-4 的、靠后果主义而非原则支撑的判决上。任何一次人事更替或再一次冲突，都可能重开这个口子；长端利率与美元资产的“制度溢价”需要重新定价。\n取材说明：本集无公开全文逐字稿，卡片基于官方节目简介、Menand 文章标题与公开报道的案件事实整理，未引用嘉宾逐字原话。", "detail_en": "Timeline: in August 2025 the Trump administration moved to fire Fed governor Lisa Cook 'for cause' (citing a mortgage-fraud investigation) — the first attempt by a president to remove a sitting Fed governor in the institution's 112-year history. After nearly a year in the courts, the Supreme Court ruled 5-4 in Cook's favor this June. The real complexity is the companion case: the Court simultaneously allowed the president to fire individual FTC commissioners, effectively overturning the Humphrey's Executor (1935) shield for independent-agency officials.\nHence the episode's core puzzle: how can the Court dismantle FTC independence while preserving the Fed's? Menand, who just published 'The Federal Reserve Exception to the Slaughter Rule' in Just Security, argues the Court has created a Fed exception without general legal principle behind it — not because the constitutional text distinguishes Fed from FTC, but because the majority understands the market consequences: letting a president reshuffle the FOMC at will turns the global risk-free rate into a White House policy tool. It is a consequentialist exception, and therefore of uncertain durability.\nThe guests stretch the lens to generations of legal history: from Hamilton's First Bank onward, the independence of American monetary governance was never constitutional text but an accretion of political compromises, precedents and norms — which means it can be dismantled the same way. Tankus, who tracks the Fed's operational plumbing, notes that even with Cook's win, the executive retains many operational levers: appointments, budget pressure, public coercion, and expectations management around the next Chair.\nFor investors: Fed independence 'hanging by a thread' is not rhetoric — it hangs on a 5-4 ruling supported by consequentialism rather than principle. Any personnel turnover or fresh clash can reopen the breach; the institutional premium in long rates and dollar assets needs repricing.\nSourcing: no public transcript; card based on the official description, Menand's article, and public case facts; no verbatim guest quotes.", "points": ["事件核心：2025 年 8 月特朗普以“有因解职”试图解雇 Fed 理事 Lisa Cook（理由为按揭欺诈调查），系美联储历史上首次；2026 年 6 月最高法院 5-4 判 Cook 胜诉留任。", "同期矛盾判决：另一案允许总统解雇 FTC 个别委员，实质掏空 Humphrey's Executor（1935）以来独立机构官员的解职保护。", "Menand 的框架（《The Federal Reserve Exception to the Slaughter Rule》，Just Security）：法院造出了一个缺乏一般法理支撑的“美联储例外”——靠后果主义（市场会崩）而非宪法原则支撑。", "历史纵深：从汉密尔顿的第一银行到今天，美国货币治理独立性从来不是宪法明文，而是政治妥协+判例+惯例的堆叠，因此也可以被逐层拆除。", "Tankus 的操作面视角：即便 Cook 胜诉，行政部门仍可通过任命、预算、公开施压与下任主席预期管理影响 Fed——法律胜利不等于制度安全。", "5-4 的脆弱性：判决建立在一票之差与后果主义逻辑上，任何人事更替或新冲突都可能重开口子。", "投资含义：全球无风险利率的“制度溢价”正在成为可定价的风险因子——长端利率、美元与通胀预期都暴露其中。", "取材说明：无公开全文逐字稿，卡片据官方简介与公开案件事实整理，未引用嘉宾逐字原话。"], "points_en": ["Core event: in Aug 2025 Trump moved to fire Fed governor Lisa Cook 'for cause' (mortgage-fraud probe) — a first in Fed history; in June 2026 the Supreme Court ruled 5-4 for Cook.", "The contradictory companion ruling: the Court allowed the president to fire individual FTC commissioners, gutting the Humphrey's Executor (1935) protection for independent agencies.", "Menand's frame ('The Federal Reserve Exception to the Slaughter Rule,' Just Security): the Court built a Fed exception with no general legal principle — held up by consequentialism (markets would break), not constitutional text.", "Historical depth: from Hamilton's First Bank onward, monetary independence was an accretion of compromises, precedents and norms — and can be dismantled layer by layer.", "Tankus's operational lens: even after Cook's win, the executive retains levers — appointments, budget pressure, public coercion, expectations management around the next Chair.", "Fragility of 5-4: the ruling rests on one vote and consequentialist logic; any turnover or new clash can reopen the breach.", "Investment implication: the institutional premium in the global risk-free rate is now a priceable risk factor — long rates, the dollar and inflation expectations are all exposed.", "Sourcing: no public transcript; card built from the official description and public case facts, no verbatim quotes."], "takeaways": ["把“制度风险”列入宏观清单：Fed 独立性不再是背景假设，而是一个悬在 5-4 判决上的变量——为利率与美元资产加上制度情景分析。", "读懂“后果主义例外”的脆弱性：靠“不敢让市场崩”维系的制度保护，会在政治收益足够大时失效——不要把惯例当宪法。", "关注操作面而非头条：任命、预算与预期管理比“解雇理事”更可能是侵蚀独立性的实际路径。"], "takeaways_en": ["Put institutional risk on your macro checklist: Fed independence is no longer a background assumption but a variable hanging on a 5-4 ruling — run institutional scenarios for rates and dollar assets.", "Understand the fragility of consequentialist exceptions: protection sustained by 'markets would break' fails when the political payoff is large enough — never mistake norms for constitutional text.", "Watch the operational surface, not headlines: appointments, budgets and expectations management are the likelier erosion paths than outright firings."], "quotes": [], "quotes_en": [], "data": ["最高法院 2026 年 6 月以 5-4 判 Lisa Cook 胜诉留任；同期另一案允许总统解雇 FTC 个别委员。", "2025 年 8 月特朗普政府以按揭欺诈调查为由启动对 Cook 的“有因解职”，缠讼近一年。", "Lev Menand 刚在 Just Security 发表《The Federal Reserve Exception to the Slaughter Rule》，本集围绕该文框架展开。", "法律史纵深回溯至汉密尔顿（第一银行），说明美国货币独立性是判例与惯例堆叠而非宪法明文。", "本集时长 1:05:48，发布于 2026-07-17（按 Odd Lots 官方播放列表顺序与周一/四/五更新节奏推定）。"], "data_en": ["June 2026: Supreme Court rules 5-4 for Lisa Cook; a companion case allows the president to fire individual FTC commissioners.", "Aug 2025: the administration moved to fire Cook 'for cause' citing a mortgage-fraud probe; litigation ran nearly a year.", "Lev Menand's new Just Security piece 'The Federal Reserve Exception to the Slaughter Rule' frames the episode.", "Legal history traced back to Hamilton's First Bank: US monetary independence is precedent and norm, not constitutional text.", "Runtime 1:05:48, published 2026-07-17 (inferred from official playlist order and the Mon/Thu/Fri cadence)."], "note": ""}, {"id": "2026-07-19-founders-424-thiel-zero-to-one", "podcast": "Founders Podcast", "tier": "S", "category": "创始人/商业", "title": "#424 Peter Thiel on How to Build a Creative Monopoly (Zero to One)", "title_en": "#424 Peter Thiel on How to Build a Creative Monopoly (Zero to One)", "guest": "无嘉宾（David Senra 独讲，重读 Peter Thiel《Zero to One》）", "guest_en": "No guest (David Senra solo, re-reading Peter Thiel's Zero to One)", "host": "David Senra", "host_en": "David Senra", "date": "2026-07-19", "durationMin": null, "worthScore": 4, "worthReason": "Senra 买了本新书重读《Zero to One》，把它讲成“如何建立创造性垄断”的操作手册：增长 vs 持久、秘密、最后行动者优势。书虽人人读过，但 AI 泡沫语境下重听“竞争是失败者的游戏”别有分量；长青价值满格。", "worthReason_en": "Senra bought a fresh copy and re-read Zero to One as an operating manual for creative monopoly: growth vs. durability, secrets, last-mover advantage. Everyone has read the book, but 'competition is for losers' lands differently amid the AI boom; evergreen value maxed.", "originalUrl": "https://www.founderspodcast.com/", "transcriptUrl": "https://podcastnotes.org/founders-podcast/peter-thiel-on-how-to-build-a-creative-monopoly-founders-podcast-with-david-senra-424/", "noteFile": "", "status": "done", "tldr": "Senra 四年里第三四次重读《Zero to One》，这次买了本没有旧划线的新书。核心线：伟大公司是“创造性垄断”——好到没人能竞争；大多数创业者过度优化增长、低估持久（Thiel 在书里给 endure 而非 grow 加了斜体）；每家伟大公司都建立在一个“秘密”上，而分享秘密的人成为同谋。", "tldr_en": "Senra re-reads Zero to One for the third or fourth time in four years — on a fresh copy with no old highlights. The spine: great companies are creative monopolies — so good no one can compete; most founders over-optimize growth and undervalue durability (Thiel italicized endure, not grow); every great company is built on a secret, and whoever you share it with becomes a co-conspirator.", "detail": "Senra 的切入点是 Edwin Land（宝丽来创始人）的座右铭：“不要做任何别人能做的事”（Don't do anything someone else can do）——这就是“创造性垄断”的一句话版本。Thiel 开篇的论证同构：商业里每个时刻只发生一次，下一个 Bill Gates 不会再做操作系统；如果你在复制这些人，你就没有真正向他们学习。成功者的共同模式是“在意想不到的地方发现价值”——用第一性原理而非公式思考。\n方法论骨架是那个著名的反共识问题：“有什么重要的真相，是极少有人同意你的？”好答案的格式是“大多数人相信 X，但真相是 X 的反面”。Thiel 对互联网泡沫后四条“创业圣经”的逐条反转在今天听来尤其锋利：与其渐进式改良不如冒大胆的险；坏计划好过没有计划；竞争性市场摧毁利润；销售和产品一样重要。真正该问的是：“有什么有价值的公司没有人在做？”\n垄断的构成有四件套：专有技术、网络效应、规模经济、品牌——Apple 四项全中。路径必须从小市场开始向外扩张：Bezos 的计划是统治整个在线零售，但刻意从书开始。“竞争是失败者的游戏”引出最后行动者优势：先研究终局，做市场的 last mover 而非 first mover。\n本次重读 Senra 特别强化的一条主线是“增长 vs 持久”：对任何生意最重要的问题是——十年后这个东西还在吗？为公司估值时，增长必须与 endure 相乘。配上幂律（你的人生不是投资组合，创业者无法分散自己，只能选一件事全押）与“秘密”（人们害怕秘密因为害怕犯错；伟大公司是一场改变世界的阴谋，分享秘密即招募同谋），构成完整的 Thiel 操作系统。地基定律（Thiel's Law）压轴：地基坏掉的创业公司无法修复——最重要的决定是和谁一起创业；Jobs 说前 10 个人各占公司的 10%。最后是被普遍低估的分发：仅靠卓越的销售与分发、哪怕产品零差异化也能造出垄断；分发应被当作产品设计的一部分。\n取材说明：卡片基于 Podcast Notes 的详细笔记（含大量书中直接引语）整理；引语为 Thiel 书中原文或被援引者（Land/Jobs）的有据可查名言，非 Senra 播客逐字稿。", "detail_en": "Senra's entry point is Edwin Land's motto: 'Don't do anything someone else can do' — the one-line version of creative monopoly. Thiel's opening argument is isomorphic: every moment in business happens only once; the next Bill Gates won't build an operating system; if you're copying these people you aren't learning from them. The common pattern of successful people is finding value in unexpected places — thinking in first principles instead of formulas.\nThe methodological spine is the famous contrarian question: 'What important truth do very few people agree with you on?' — good answers take the form 'most people believe X, but the truth is the opposite of X.' Thiel's inversion of the four post-dot-com commandments sounds especially sharp amid today's AI boom: better to risk boldness than triviality; a bad plan beats no plan; competitive markets destroy profits; sales matters as much as product. The real question: 'What valuable company is nobody building?'\nMonopoly has four components — proprietary technology, network effects, economies of scale, branding — and Apple checks every box. The path must start tiny and expand: Bezos planned to dominate all online retail but deliberately began with books. 'Competition is for losers' leads into last-mover advantage: study the end game first.\nThe thread Senra amplifies this time is growth vs. durability: the most important question about any business is whether it will still be around in a decade — Thiel italicized endure, not grow. Add the power law (your life isn't a portfolio; a founder can't diversify herself — pick one thing and go all in) and secrets (people fear secrets because they fear being wrong; a great company is a conspiracy to change the world, and sharing your secret recruits fellow conspirators) and you have the full Thiel operating system. Thiel's Law caps it: a startup messed up at the foundation cannot be fixed — the most important decision is who you start with; Jobs said each of the first ten hires is 10% of the company. Finally, distribution is systematically underrated: superior sales and distribution alone can create a monopoly even with zero product differentiation — treat distribution as part of product design.\nSourcing: card based on the detailed Podcast Notes write-up (rich in direct book quotes); quotes are Thiel's book text or documented lines from cited figures (Land/Jobs), not a verbatim podcast transcript.", "points": ["创造性垄断的一句话版本来自 Edwin Land：“不要做任何别人能做的事”——不是掠夺性垄断，而是好到没人能竞争。", "反共识问题是整个体系的起点：“有什么重要的真相，是极少有人同意你的？”好答案格式：大多数人相信 X，但真相是 X 的反面。", "对互联网泡沫后四条教条的逐条反转：大胆险胜于琐碎；坏计划好过没计划；竞争性市场摧毁利润；销售与产品同等重要。", "垄断四件套：专有技术、网络效应、规模经济、品牌——Apple 四项全中；路径是从极小市场起步（Amazon 从书开始）再向外扩张。", "增长 vs 持久是本次重读的主线：Thiel 给 endure 加斜体——最重要的问题是“十年后它还在吗”，多数创业者在为增长过度优化。", "幂律的个人版：你的人生不是投资组合，创业者无法分散自己——选一件事全押。", "每家伟大公司建立在一个“秘密”上；人们害怕秘密因为害怕犯错；分享秘密的人成为“同谋”（fellow conspirator）。", "Thiel's Law：地基坏掉的创业公司无法修复——最重要的决定是共同创办人；Jobs：前 10 人各占公司 10%。“没有公司拥有文化，每家公司就是一种文化。”", "分发被系统性低估：仅靠卓越销售与分发即可造就垄断；广告的作用是植入日后驱动购买的微妙印象——分发是产品设计的一部分。"], "points_en": ["The one-line creative monopoly, via Edwin Land: 'Don't do anything someone else can do' — not predatory, just too good to compete with.", "The contrarian question starts the whole system: 'What important truth do very few people agree with you on?' Good answers: most believe X, the truth is the opposite of X.", "Point-by-point inversion of the four post-dot-com commandments: boldness over triviality; a bad plan over no plan; competitive markets destroy profits; sales equals product.", "Four monopoly components: proprietary tech, network effects, scale economies, branding — Apple checks all; start in a tiny market (Amazon began with books) and expand.", "Growth vs. durability is the re-read's spine: Thiel italicized endure — the key question is 'will it still be here in a decade'; most founders over-optimize growth.", "The personal power law: your life isn't a portfolio; a founder can't diversify herself — pick one thing, go all in.", "Every great company is built on a secret; people fear secrets because they fear being wrong; sharing yours recruits fellow conspirators.", "Thiel's Law: a startup messed up at the foundation cannot be fixed — the co-founder decision is paramount; Jobs: each of the first 10 hires is 10% of the company. 'No company has a culture; every company is a culture.'", "Distribution is systematically underrated: superior sales and distribution alone can create a monopoly; advertising embeds impressions that drive sales later — distribution is product design."], "takeaways": ["给自己的事业做“十年测试”：你现在优化的指标是增长还是持久？Thiel 的斜体字提醒：可存续性才是估值的主项。", "定期写下你的反共识答案：“大多数人相信 X，但真相是 X 的反面”——写不出来说明你在共识里工作，回报注定平庸。", "职业选择同样服从幂律：你无法分散你自己，与其平均下注，不如选一个你有“秘密”的领域全押。", "无论做产品还是做个人品牌，把分发当作设计的一部分：做出伟大的东西却没有卖出去的路径，等于做了一门坏生意。"], "takeaways_en": ["Run the ten-year test on your own work: are you optimizing growth or durability? Thiel's italics say endurance is the main term in valuation.", "Regularly write down your contrarian answer: 'most people believe X, but the truth is the opposite' — if you can't, you're working inside consensus and returns will be mediocre.", "Careers obey the power law too: you can't diversify yourself — go all in on the field where you hold a secret.", "Whether building a product or a personal brand, treat distribution as design: something great with no path to sell is a bad business."], "quotes": ["Competition is for losers. —— 竞争是失败者的游戏。（Peter Thiel，书中原文）", "A great company is a conspiracy to change the world; when you share your secret, the recipient becomes a fellow conspirator. —— 伟大的公司是一场改变世界的阴谋；当你分享你的秘密，对方就成了同谋。（Peter Thiel，书中原文）", "Don't do anything someone else can do. —— 不要做任何别人能做的事。（Edwin Land，Senra 援引）", "When you're in a startup, the first 10 people will determine whether the company succeeds or not; each is 10% of the company. —— 创业公司的前 10 个人决定公司成败，每个人都是公司的 10%。（Steve Jobs，Senra 援引）"], "quotes_en": ["Competition is for losers. (Peter Thiel, from the book)", "A great company is a conspiracy to change the world; when you share your secret, the recipient becomes a fellow conspirator. (Peter Thiel, from the book)", "Don't do anything someone else can do. (Edwin Land, cited by Senra)", "When you're in a startup, the first 10 people will determine whether the company succeeds or not; each is 10% of the company. (Steve Jobs, cited by Senra)"], "data": ["Senra 四年内读了 3-4 遍《Zero to One》，本次特意买了一本没有旧划线的新书重读。", "垄断四件套：专有技术、网络效应、规模经济、品牌；Apple 被用作四项全中的范例。", "Amazon 案例：Bezos 的目标是统治整个在线零售，但刻意从图书这个极小切口起步。", "书中被 Senra 强调的斜体：公司要有价值必须增长并且 endure（持久）——斜体加在 endure 上。", "小团队创造新技术的两个例子：美国建国之父们；仙童半导体“八叛逆”（Traitorous Eight）。"], "data_en": ["Senra has read Zero to One 3-4 times over 4 years; this time he bought a fresh copy so old highlights wouldn't bias him.", "Four monopoly components: proprietary technology, network effects, economies of scale, branding; Apple cited as checking all four.", "Amazon example: Bezos aimed to dominate all online retail but deliberately started with books.", "Thiel's italics, stressed by Senra: to be valuable a company must grow AND endure — the italics are on endure.", "Two examples of small mission-bound groups creating the new: the Founding Fathers; Fairchild's 'Traitorous Eight.'"], "note": ""}, {"id": "2026-07-19-lennys-elizabeth-stone-netflix-cpto", "podcast": "Lenny's Podcast", "tier": "A", "category": "创始人/商业", "title": "Why Netflix is betting on systems thinkers, not specialists, in the AI era | Elizabeth Stone (CPTO)", "title_en": "Why Netflix is betting on systems thinkers, not specialists, in the AI era | Elizabeth Stone (CPTO)", "guest": "Elizabeth Stone（Netflix 首席产品与技术官 CPTO，统管工程/产品/设计；前 Lyft 科学副总裁、美林交易员）", "guest_en": "Elizabeth Stone (Netflix CPTO overseeing Engineering, Product and Design; ex-VP of Science at Lyft, ex-Merrill Lynch trader)", "host": "Lenny Rachitsky", "host_en": "Lenny Rachitsky", "date": "2026-07-19", "durationMin": 72, "worthScore": 4, "worthReason": "掌管 Netflix 工程+产品+设计的一号技术位，给出 AI 时代组织问题最完整的一线答案：systems thinking 是第一上升技能、AI fluency 是全员“非协商项”、卓越是一套操作系统。有全文逐字稿可核，可执行密度高。", "worthReason_en": "The person running Netflix engineering+product+design gives the most complete frontline answer to the AI-era org question: systems thinking as the top rising skill, AI fluency as a universal non-negotiable, excellence as an operating system. Full transcript available; highly actionable.", "originalUrl": "https://www.lennysnewsletter.com/p/netflix-cpto-on-ai-an
