除虚假信息和言论管制；四、先以自愿形式验证有效，再考虑立法；五、必须替代而非叠加新的政府机构。他对比 Dario Amodei 所谓「AI 版 FAA」路径：FAA 认证一款新飞机要 5-9 年，套到几个月一迭代的 AI 上等于把 AI 竞赛拱手让给不守规则的中国。Chamath 则强调速度：尽快立规、抢在「巨额资金游说两党制造监管俘获」之前。Sacks 还引 Politico 报道指控 Anthropic 推行逐州加码的监管策略并资助减缓数据中心建设的团体——需要注意的立场标注：Sacks 有特朗普政府 AI 顾问（AI 沙皇）背景，全场对 Anthropic 的指控是单方叙事，Anthropic 并无在场辩护，本节目一贯持加速主义、反监管立场，宜批判性阅读。\n第二主线是支付业的世纪要约：估值 530 亿美元的 Stripe 联合私募巨头 Advent 与 Block（出资 170 亿美元股权）对 PayPal 发出约每股 60 美元的收购要约——PayPal 股价曾高见 322 美元，要约前市值已跌至 300-400 亿美元区间。商业逻辑按 Chamath 的框架是打造「Visa/万事达的竞争者」：Stripe 的商户 API 与风控基础设施 + PayPal 的 4.39 亿消费者账户与 Venmo 年轻用户 + Block 的线下 POS 网络 + 双方的稳定币能力（Stripe 以 10 亿美元收购的 Bridge 与 PayPal 的 PYUSD），合并后 6-7 亿账户、交易可全程走自有轨道、彻底绕开卡组织手续费——这正是 agentic commerce（AI 代理下单支付）时代的基础设施卡位。Chamath 预测成交价还会再抬高 10-15%，并点名坐拥四五万亿市值的 Musk「必须认真考虑」竞购。Friedberg 则把它与 Ryan Cohen 竞购 eBay 连成一条线：AI 原生运营者收购无创始人掌舵、AI 利用不足、估值被打压的成熟数字资产（对标米兰的 Bending Spoons 玩法）。\n第三主线是中国追赶与美国的自我设限。Sacks 警告 Kimi K3 已「非常非常接近前沿」，美国对中国的领先「可能只剩几个月」；而 Chamath 展示的 token 成本表显示中国模型每百万输入 token 约 0.5 美元，与 Claude 的约 56 美元相差百倍，成本鸿沟正在结构性分裂 AI 市场。与此同时纽约州长 Hochul 签署全美首个州级超大规模数据中心暂停令，理由是碳足迹、占地、噪音与耗水；Sacks 逐条反驳（自建电源的 behind-the-meter 方案、数据中心用水仅相当于 2.5 家 In-N-Out、北达科他州教师因数据中心税收获 3-4 万美元奖金），Chamath 引 PJM 电力拍卖 7-8 吉瓦需求仅 156 兆瓦供给应标的 50 倍缺口，预测 2050 年美国将短缺 2.5 个加州的用电量。Friedberg 进一步把反数据中心抗议与外国影响行动挂钩（引 OpenAI 关于 PRC 关联影响行动瞄准美国 AI 辩论的博文）——这一归因同样带有明显立场色彩，听者应自行核实。本期还涉及苹果起诉 OpenAI 窃取商业机密、Grok Build 代码库泄露暴露零数据保留承诺之脆弱、以及 Calico 逆转细胞外基质老化的科学角。", "detail_en": "The episode's first thread: can AI regulate itself? Demis Hassabis published a proposal for a US-led international AI standards body modeled on FINRA — industry-funded, federally overseen, run by independent technical experts. Frontier labs would submit models 30 days before release (voluntary first, then mandatory); the body would assess cyber, national-security and biological risks, update benchmarks quarterly, and could coordinate slowdowns. Musk, Altman, Jack Clark, Pichai, Nadella and Dorsey publicly backed it. Sacks, who discussed it directly with Hassabis, attached five conditions: broad representation including startups and open source (Jensen, Elon, Zuckerberg, Mira Murati) to prevent capture by the three largest labs; review of true frontier models only; scope limited to catastrophic risk (cyber, CBRN) with disinformation and speech explicitly excluded; voluntary first; and substitution for — not addition to — a new government agency. He contrasted this with Dario Amodei's 'FAA for AI': FAA certification takes 5-9 years, which applied to models shipping every few months would hand the race to China. Chamath urged speed to preempt a torrent of lobbying money engineering regulatory capture. Sacks also cited a Politico report accusing Anthropic of a state-by-state ratcheting strategy and of funding groups slowing data center construction. Critical-reading note: Sacks served as the Trump administration's AI advisor (AI czar), the anti-Anthropic case is one-sided with no rebuttal present, and All-In has a consistent accelerationist, deregulatory slant.\nSecond thread: the payments mega-bid. Stripe (privately valued at $53B), PE firm Advent, and Block (contributing $17B in equity) offered roughly $60/share for PayPal — a stock down from a $322 peak to a $30-40B market cap pre-offer. Chamath's framing: build a competitor to Visa/Mastercard by combining Stripe's merchant APIs and risk infrastructure, PayPal's 439M consumer accounts plus Venmo's younger base, Block's point-of-sale network, and both sides' stablecoin assets (Stripe's $1B Bridge acquisition, PayPal's PYUSD) — 600-700M combined accounts running end-to-end on proprietary rails, bypassing card network fees entirely, a land-grab for the agentic-commerce era. Chamath predicts the clearing price rises another 10-15% and says Musk 'must look very closely' at a counterbid. Friedberg reads it as the second dot on a line (after Ryan Cohen's eBay bid): AI-native operators acquiring founderless, AI-underutilizing, depressed digital assets — the Bending Spoons playbook at scale.\nThird thread: China's catch-up versus American self-sabotage. Sacks warned Kimi K3 is 'very, very close to the frontier' and the US lead 'may be months, if that.' Chamath's token-cost table shows Chinese models at ~$0.50 per million input tokens versus ~$56 for Claude — a 100x canyon structurally splitting the market. Meanwhile NY Governor Hochul signed the nation's first statewide hyperscale data center moratorium citing carbon, land, noise and water; Sacks rebutted point by point (behind-the-meter power, water use equal to 2.5 In-N-Out restaurants, North Dakota teachers' $30-40K bonuses from data center taxes), and Chamath cited a PJM auction where 7-8 GW of needed capacity drew only 156 MW — a 50x shortfall — forecasting a 2050 US energy deficit of 2.5 Californias. Friedberg linked anti-datacenter protests to foreign influence operations (citing OpenAI's post on PRC-linked operations targeting US AI debates) — an attribution that itself carries a clear ideological charge and deserves independent verification. Also covered: Apple suing OpenAI over trade secrets, the Grok Build codebase leak exposing the fragility of zero-data-retention promises, and a science corner on Calico's extracellular aging reversal.", "points": ["Hassabis 的 SRO 提案框架：仿 FINRA、美国主导、行业出资、联邦监督、独立技术专家运营；前沿模型发布前 30 天提交审查，先自愿后强制，评估网络/国安/生物风险，季度更新基准，获 Musk、Altman、Pichai、Nadella 等公开背书。", "Sacks 的五项防俘获条件：纳入创业公司与开源、只审真前沿模型、只管灾难性风险（网络与 CBRN，排除虚假信息与言论）、先自愿验证、替代而非叠加新政府机构；他警告 FAA 式认证 5-9 年的周期套用于 AI 等于输掉对华竞赛。", "Sacks 引 Politico 报道指控 Anthropic 推行逐州加码的监管策略（已在加州、伊利诺伊、纽约得手）并资助 Public First 等减缓数据中心建设的团体——注意此为单方指控，且 Sacks 有特朗普政府 AI 顾问背景。", "Stripe（估值 530 亿美元）联合 Advent 与 Block（出资 170 亿美元股权）对 PayPal 发出约每股 60 美元要约；PayPal 拥有 4.39 亿消费者账户、Braintree 与 Venmo，年处理约 1.7 万亿美元交易量（Stripe 约 2 万亿美元）。", "合并逻辑是打造 Visa/万事达的竞争者：商户 API + 消费者账户 + 线下 POS + 稳定币（Bridge/PYUSD），合计 6-7 亿账户走自有轨道绕开卡组织费率；Chamath 预测成交价再涨 10-15%，Musk 可能竞购。", "AI token 成本百倍鸿沟：Claude 约 56 美元/百万输入 token，中国模型约 0.5 美元；Ramp CEO 称客户 token 支出一年增长 21 倍并推出 token 支出管理，Chamath 预言 CFO 限流将引发一场清算，估计 98% 的 Claude 5 提示可用便宜百倍的模型跑。", "Kimi K3 逼近前沿，Sacks 称美国领先中国「可能只剩几个月」；若美国以监管和禁令自我减速，中国无需追赶、只需继续建设。", "纽约州 Hochul 签署全美首个州级超大规模数据中心暂停令；Sacks 逐条反驳（behind-the-meter 自建电力、用水仅相当于 2.5 家 In-N-Out、北达科他教师获 3-4 万美元数据中心税收奖金），Chamath 引 PJM 拍卖 7-8 吉瓦需求对 156 兆瓦供给的 50 倍缺口，预测 2050 年美国缺电 2.5 个加州。", "配菜线索：苹果 7 月 10 日起诉 OpenAI 窃取硬件商业机密（挖走 400 余名苹果员工）；Grok Build 隐私开关失效、整个代码库被上传至 xAI 服务器，佐证零数据保留承诺的脆弱性。"], "points_en": ["Hassabis's SRO framework: FINRA-modeled, US-led, industry-funded, federally overseen, run by independent technical experts; frontier models submitted 30 days pre-release, voluntary then mandatory, assessing cyber/national-security/bio risks with quarterly benchmark updates — publicly backed by Musk, Altman, Pichai, Nadella and others.", "Sacks's five anti-capture conditions: include startups and open source, review true frontier models only, catastrophic risk only (cyber and CBRN, excluding disinformation and speech), voluntary first, and substitute for rather than add to a new government agency; he warns FAA-style 5-9 year certification cycles applied to AI would forfeit the race to China.", "Sacks cites a Politico report accusing Anthropic of a state-by-state ratcheting strategy (wins in California, Illinois, New York) and of funding groups like Public First that slow data center construction — note this is a one-sided charge, and Sacks served as Trump administration AI advisor.", "Stripe ($53B valuation) with Advent and Block ($17B equity contribution) offered roughly $60/share for PayPal; PayPal holds 439M consumer accounts, Braintree and Venmo, processing ~$1.7T in annual volume versus Stripe's ~$2T.", "The merger logic: build a Visa/Mastercard competitor — merchant APIs + consumer accounts + point-of-sale + stablecoins (Bridge/PYUSD), 600-700M combined accounts on proprietary rails bypassing card network fees; Chamath predicts the clearing price rises another 10-15% and Musk may counterbid.", "The 100x token-cost canyon: Claude at ~$56 per million input tokens versus ~$0.50 for Chinese models; Ramp's CEO reports 21x growth in customer token spend and launches token spend management; Chamath predicts a CFO-driven reckoning, estimating 98% of Claude 5 prompts could run on models 100x cheaper.", "Kimi K3 nears the frontier; Sacks says the US lead over China 'may be months, if that' — if America slows itself with regulation and moratoria, China need not catch up, only keep building.", "NY Governor Hochul signed the first statewide hyperscale data center moratorium; Sacks rebuts each rationale (behind-the-meter power, water equal to 2.5 In-N-Out restaurants, North Dakota teachers' $30-40K bonuses from data center tax revenue), while Chamath cites a PJM auction 50x shortfall (7-8 GW needed, 156 MW offered) and forecasts a 2050 US energy deficit of 2.5 Californias.", "Side threads: Apple's July 10 lawsuit alleging OpenAI stole hardware trade secrets (400+ Apple employees poached); the Grok Build privacy toggle failure that uploaded entire codebases to xAI servers, proving zero-data-retention promises are fragile."], "takeaways": ["行业辩论已从「要不要监管」转向「哪种监管最不坏」——理解 SRO、FAA 式认证、逐州立法这三种路径的利益格局，是判断未来几年 AI 政策走向（及相关投资机会）的基础框架。", "听有立场的节目要做「利益申报」功课：Sacks 是特朗普政府 AI 顾问、Chamath 的 8090 直接受益于其观点——先问「谁在说、他赚谁的钱」，再决定信多少，这个习惯比任何单条结论更值钱。", "支付大并购揭示的职业信号：AI 原生运营者正批量收购无创始人掌舵、AI 利用不足的成熟数字资产；无论就业还是投资，「老资产 + AI 改造」都是未来十年可反复押注的主题。", "能源正在成为 AI 时代的硬约束：从 PJM 拍卖 50 倍缺口到 2050 年 2.5 个加州的缺电预测，电力、数据中心与电网相关的技能和资产会长期供不应求，值得年轻人认真考虑切入。"], "takeaways_en": ["The industry debate has shifted from 'whether to regulate' to 'which regulation is least bad' — understanding the interest map behind the SRO, FAA-style certification, and state-by-state paths is the base framework for reading AI policy (and related investment opportunities) in coming years.", "Do a conflict-of-interest audit on opinionated shows: Sacks was the Trump administration's AI advisor and Chamath's 8090 directly benefits from his own arguments — asking 'who is speaking and who pays them' before deciding how much to believe is worth more than any single takeaway.", "The payments mega-deal signals a career theme: AI-native operators are systematically acquiring founderless, AI-underutilizing mature digital assets; 'old assets + AI retrofit' is a decade-long theme to bet on, whether in jobs or investing.", "Energy is becoming AI's binding constraint: from the 50x PJM auction shortfall to a projected 2050 deficit of 2.5 Californias, skills and assets around power, data centers and the grid will stay scarce — a serious entry point for someone in their 30s."], "quotes": ["If my choices are between FAA for AI or what I would call the DMV for AI, I would much rather go for Demis's SRO for AI. —— 如果让我在「AI 版 FAA」和我所谓的「AI 版车管所」之间选，我宁愿选 Demis 的 AI 版 SRO。（David Sacks）", "It prevents a handful of actors using their balance sheets and their capital to essentially pull the ladder up. —— 它能阻止一小撮玩家用资产负债表和资本把梯子抽走。（Chamath Palihapitiya，谈尽快建立 SRO 的意义）", "I think this body should be dealing with catastrophic risk only — cyber and CBRN — not things like disinformation or microaggressions. —— 我认为这个机构只应处理灾难性风险——网络攻击与核生化——而不是虚假信息或微冒犯之类的东西。（David Sacks）"], "quotes_en": ["If my choices are between FAA for AI or what I would call the DMV for AI, I would much rather go for Demis's SRO for AI. (David Sacks)", "It prevents a handful of actors using their balance sheets and their capital to essentially pull the ladder up. (Chamath Palihapitiya, on establishing the SRO quickly)", "I think this body should be dealing with catastrophic risk only — cyber and CBRN — not things like disinformation or microaggressions. (David Sacks)"], "data": ["PayPal 要约：Stripe（估值 530 亿美元）+ Advent + Block（出资 170 亿美元股权）联合出价约每股 60 美元；PayPal 股价峰值曾达 322 美元，要约前市值 300-400 亿美元，4.39 亿账户、年交易量约 1.7 万亿美元。", "Token 成本表（每百万输入 token）：Claude 约 56 美元、OpenAI 约 26 美元、Grok 4.5 约 1.5 美元、中国模型约 0.5 美元——闭源前沿与开源/中国模型相差约 100 倍。", "PJM 电力拍卖：需求 7-8 吉瓦，仅 156 兆瓦应标，缺口约 50 倍；Chamath 预测 2050 年美国缺电 2.5 个加州（加州为全球第四大经济体）。", "SRO 提案机制：前沿模型发布前 30 天提交审查，先自愿后强制，每季度更新基准；提案获 Musk、Altman、Jack Clark、Pichai、Nadella、Dorsey 公开支持。", "Ramp 数据：客户 token 支出一年增长 21 倍；苹果 2026 年 7 月 10 日提交 41 页诉状指控 OpenAI 窃密，称其 1-2 年内挖走 400 余名苹果员工。"], "data_en": ["PayPal bid: Stripe ($53B valuation) + Advent + Block ($17B equity) jointly offering ~$60/share; PayPal peaked at $322/share, pre-offer market cap $30-40B, with 439M accounts and ~$1.7T annual transaction volume.", "Token cost table (per million input tokens): Claude ~$56, OpenAI ~$26, Grok 4.5 ~$1.50, Chinese models ~$0.50 — a roughly 100x gap between closed frontier and open/Chinese models.", "PJM capacity auction: 7-8 GW needed, only 156 MW offered — a ~50x shortfall; Chamath forecasts a 2050 US energy deficit of 2.5 Californias (California being the world's fourth-largest economy).", "SRO mechanics: frontier models submitted 30 days before release, voluntary then mandatory, benchmarks updated quarterly; publicly supported by Musk, Altman, Jack Clark, Pichai, Nadella, Dorsey.", "Ramp data: customer token spend grew 21x in one year; Apple filed a 41-page lawsuit on July 10, 2026 alleging OpenAI trade secret theft, claiming 400+ Apple employees poached within 1-2 years."], "note": ""}, {"id": "2026-07-15-ingoodcompany-eliot-higgins-bellingcat", "podcast": "In Good Company", "tier": "A", "category": "人物访谈", "title": "Eliot Higgins: How Bellingcat Hunts Down the Truth", "title_en": "Eliot Higgins: How Bellingcat Hunts Down the Truth", "guest": "Eliot Higgins（Bellingcat 创始人，开源情报 OSINT 调查先驱）", "guest_en": "Eliot Higgins (Founder of Bellingcat, pioneer of open-source intelligence OSINT investigations)", "host": "Nicolai Tangen（挪威主权基金 NBIM CEO）", "host_en": "Nicolai Tangen (CEO of Norges Bank Investment Management, Norway's sovereign wealth fund)", "date": "2026-07-15", "durationMin": null, "worthScore": 4, "worthReason": "嘉宾稀缺性极高：Higgins 是开源情报领域的开创者，鲜少在商业播客长谈；其「不预判、跟证据走、警惕自身偏见」的调查纪律对投资研究高度可迁移；MH17 与 Navalny 两大案例含金量足；live 录制略损深度，且暂无全文 transcript 可复核细节。", "worthReason_en": "Highly scarce guest: Higgins pioneered open-source intelligence and rarely gives long-form interviews on business podcasts; his discipline of never prejudging, following evidence, and guarding against bias transfers directly to investment research; the MH17 and Navalny cases are substantive. Live format slightly limits depth, and no full transcript is yet available for verification.", "originalUrl": "https://shows.acast.com/in-good-company-with-nicolai-tangen/episodes/eliot-higgins-how-bellingcat-hunts-down-the-truth", "transcriptUrl": "", "noteFile": "", "status": "done", "tldr": "Bellingcat 创始人 Eliot Higgins 与 Tangen 现场对谈：一个自学成才的大学辍学者，如何仅靠公开数据揭露 MH17 击落真相与 Navalny 投毒者身份；核心纪律是不预判、跟证据走、警惕自身偏见；并讨论在 AI 给人「否认现实的许可」的时代，真相为何必须跑得比谎言快。", "tldr_en": "Bellingcat founder Eliot Higgins joins Tangen live: how a self-taught college dropout used nothing but publicly available data to expose the downing of MH17 and unmask Navalny's poisoners; the core discipline is never prejudge, follow the evidence, and guard against your own biases — and why truth must outrun lies in an era when AI gives people permission to deny reality.", "detail": "本集为 In Good Company 第 268 期，live 录制，嘉宾是 Bellingcat 创始人 Eliot Higgins。他是一个没有新闻学、军事或情报背景的大学辍学者，最初在厨房餐桌上以业余身份追踪叙利亚内战：通过逐帧分析社交媒体上的武器视频、比对卫星图像与街景来核实事实，逐渐建立起「Brown Moses」博客的声誉，并于 2014 年创立 Bellingcat——如今全球最具影响力的开源调查协作网络，汇聚分布在各国的研究员与志愿者，信条是「Identify, Verify, Amplify（发现、核实、放大）」。\n节目围绕两大标志性调查展开。其一是 2014 年 7 月马航 MH17 航班在乌克兰东部被击落：Bellingcat 团队利用社交媒体照片与视频、地理定位（比对路牌、植被、建筑轮廓）、时间戳交叉验证，追踪了一辆俄军 Buk 导弹发射车从俄罗斯第 53 防空导弹旅进入乌克兰、发射后缺一枚导弹返回的完整路径，结论后来被荷兰主导的联合调查组（JIT）及法庭认定。其二是 2020 年 Navalny 中毒案：Bellingcat 与合作伙伴通过泄露的航班订票与电话元数据，锁定了一支长期尾随 Navalny 的俄联邦安全局（FSB）毒物小组的具体成员身份。Higgins 强调这些调查用的全是公开或可购得的数据，任何人都可以复核每一步推理。\n他向 Tangen 阐述了这套工作的核心纪律：绝不预判局势，先收集证据再形成观点，并时刻警惕自身偏见——愿意公开自己的推理链，恰恰是接受外界检验、对冲偏见的机制。这与投资研究的功课高度同构：结论必须可追溯到可核实的原始证据，而不是叙事先行。开源方法也重塑了传统新闻业与情报机构的边界：一群分布式业余者用免费工具做出了国家机器级别的调查，倒逼媒体与政府情报部门吸收 OSINT 方法。\n对谈还延伸到信息战时代的紧迫议题：当真相与谎言赛跑时，速度本身就是武器——虚假叙事一旦先占领注意力就极难清除；而生成式 AI 的泛滥让人们获得了「否认现实的许可」，任何不利证据都可被斥为伪造，这种「说谎者红利」对民主构成的威胁不亚于假信息本身。Higgins 认为答案不是放弃，而是更透明、更快速、可复核的公开调查。\n取材说明：本卡片基于 Acast 官方节目描述及 Bellingcat／Higgins 公开可核实事实（MH17、Navalny 调查均有公开报告与法庭记录）撰写；截至撰写时 podscripts 等尚无本集全文 transcript，具体对话细节以官方描述为准。", "detail_en": "Episode 268 of In Good Company, recorded live, features Eliot Higgins, founder of Bellingcat. A college dropout with no background in journalism, the military or intelligence, he began tracking the Syrian civil war as an amateur from his kitchen table — verifying weapons videos frame by frame against satellite imagery and street views — building the reputation of his Brown Moses blog before founding Bellingcat in 2014. It is now the world's leading open-source investigative collective, a distributed network of researchers and volunteers guided by the motto Identify, Verify, Amplify.\nThe conversation centers on two landmark investigations. First, the July 2014 downing of Malaysia Airlines flight MH17 over eastern Ukraine: using social-media photos and videos, geolocation (matching road signs, vegetation and building outlines) and timestamp cross-verification, Bellingcat traced a Russian Buk missile launcher from Russia's 53rd Anti-Aircraft Missile Brigade into Ukraine and back — missing one missile. Its findings were later corroborated by the Dutch-led Joint Investigation Team and the courts. Second, the 2020 poisoning of Alexei Navalny: Bellingcat and partners used leaked flight-booking and phone metadata to identify by name the FSB poisons squad that had shadowed Navalny for years. Higgins stresses that every step relied on publicly available or purchasable data that anyone can re-verify.\nHe walks Tangen through the discipline at the heart of the work: never prejudge a situation, follow the evidence before forming an opinion, and guard against your own biases — publishing the full chain of reasoning is itself the mechanism that invites scrutiny and hedges bias. The parallel to investment research is direct: conclusions must trace back to verifiable primary evidence, not narrative. The open-source method has also redrawn the boundaries of traditional journalism and state intelligence: distributed amateurs with free tools produced state-grade investigations, forcing newsrooms and agencies to absorb OSINT techniques.\nThe discussion extends to the urgencies of the information-war era: when truth competes with lies, speed is itself a weapon — a false narrative that captures attention first is very hard to dislodge — and generative AI now gives people permission to deny reality, since any inconvenient evidence can be dismissed as fake. This liar's dividend threatens democracy as much as disinformation itself. Higgins's answer is not retreat but faster, more transparent, re-verifiable public investigation.\nSourcing note: this card is based on the official Acast episode description plus publicly verifiable facts about Bellingcat and Higgins (the MH17 and Navalny investigations are documented in public reports and court records); no full transcript was available at the time of writing, so conversational details follow the official description.", "points": ["Higgins 是自学成才的大学辍学者，从厨房餐桌追踪叙利亚战争起家，2014 年创立 Bellingcat，如今是全球领先的开源调查协作组织", "MH17 调查：仅靠社交媒体影像、地理定位与时间戳交叉验证，追踪出俄军 Buk 导弹发射车的完整行进路径，结论获官方联合调查组与法庭印证", "Navalny 案：通过公开与可购得的航班、电话元数据，逐一锁定 FSB 投毒小组成员的真实身份", "核心调查纪律：绝不预判局势、先跟证据走再形成观点、时刻警惕并对冲自身偏见", "全部推理链公开可复核，透明本身就是方法论的一部分——任何人都能重走每一步验证", "分布式业余者用免费工具做出国家级调查，冲击了传统新闻业与官方情报机构的垄断", "真相与谎言赛跑时速度至关重要：虚假叙事先占领注意力后极难清除", "AI 给了人们「否认现实的许可」：不利证据可被斥为伪造，说谎者红利与假信息同样危险", "虚假信息对民主构成系统性威胁，应对之道是更快、更透明、可复核的公开调查"], "points_en": ["Higgins is a self-taught college dropout who began tracking the Syrian war from his kitchen table and founded Bellingcat in 2014, now the world's leading open-source investigative collective", "MH17: using only social-media imagery, geolocation and timestamp cross-verification, Bellingcat traced the full route of a Russian Buk launcher; its findings were corroborated by the official Joint Investigation Team and courts", "Navalny: leaked and purchasable flight and phone metadata allowed Bellingcat to identify the individual members of the FSB poisons squad", "Core investigative discipline: never prejudge a situation, follow the evidence before forming an opinion, and guard against your own biases", "The entire chain of reasoning is published and re-verifiable — transparency is itself part of the methodology", "Distributed amateurs with free tools produced state-grade investigations, disrupting the monopoly of traditional journalism and intelligence agencies", "Speed matters when truth competes with lies: a false narrative that captures attention first is very hard to dislodge", "AI gives people permission to deny reality: inconvenient evidence can be dismissed as fake — the liar's dividend is as dangerous as disinformation itself", "Disinformation is a systemic threat to democracy; the answer is faster, more transparent, re-verifiable public investigation"], "takeaways": ["研究纪律可直接迁移到投资：结论必须能追溯到可核实的原始证据，先证据后观点，警惕叙事先行与确认偏误", "透明是最强的可信度机制：把推理链完整摊开让人挑错，比声称权威更能建立信任", "公开数据的价值被系统性低估：社媒、卫星图、泄露数据库的交叉验证足以完成国家级调查，信息优势往往来自方法而非渠道", "在 AI 伪造内容泛滥的时代，速度与可复核性是对抗谎言的两大武器——组织需要为「真相的分发」而不仅是「真相的发现」而设计"], "takeaways_en": ["The research discipline transfers directly to investing: conclusions must trace to verifiable primary evidence — evidence before opinion, beware narrative-first thinking and confirmation bias", "Transparency is the strongest credibility mechanism: laying out the full chain of reasoning for others to attack builds more trust than claiming authority", "Public data is systematically undervalued: cross-verifying social media, satellite imagery and leaked databases can accomplish state-grade investigations — the edge comes from method, not access", "In an era of AI-generated fakes, speed and re-verifiability are the two weapons against lies — organizations must design for the distribution of truth, not just its discovery"], "quotes": ["Never prejudge a situation, follow the evidence before forming an opinion, and guard against your own biases. —— 绝不预判局势，先跟随证据再形成观点，并时刻警惕自身偏见。（Eliot Higgins，官方节目描述转述其方法论）", "AI gives people permission to deny reality. —— AI 给了人们否认现实的许可。（Eliot Higgins，引自官方节目描述）", "Identify, Verify, Amplify. —— 发现、核实、放大。（Bellingcat 组织信条）"], "quotes_en": ["Never prejudge a situation, follow the evidence before forming an opinion, and guard against your own biases. (Eliot Higgins, methodology as summarized in the official episode description)", "AI gives people permission to deny reality. (Eliot Higgins, quoted in the official episode description)", "Identify, Verify, Amplify. (Bellingcat's motto)"], "data": ["2014 年：Higgins 创立 Bellingcat（前身为 2012 年开设的 Brown Moses 博客）", "2014 年 7 月 17 日：马航 MH17 在乌克兰东部被 Buk 导弹击落，机上 298 人全部遇难，Bellingcat 调查将导弹发射车溯源至俄军第 53 防空导弹旅", "2020 年 8 月：Navalny 遭诺维乔克神经毒剂投毒；同年 12 月 Bellingcat 等公布 FSB 投毒小组成员身份", "本集为 In Good Company 第 268 期，live 录制，Acast 页面标注发布于 2026 年 7 月中旬", "主持人 Tangen 执掌的挪威主权基金 NBIM 是全球最大单一投资者"], "data_en": ["2014: Higgins founded Bellingcat (preceded by his Brown Moses blog, started 2012)", "July 17, 2014: Malaysia Airlines MH17 was shot down over eastern Ukraine by a Buk missile, killing all 298 aboard; Bellingcat traced the launcher to Russia's 53rd Anti-Aircraft Missile Brigade", "August 2020: Navalny was poisoned with the Novichok nerve agent; in December 2020 Bellingcat and partners named the FSB squad members", "This is episode 268 of In Good Company, recorded live; the Acast page dates it to mid-July 2026", "Host Tangen runs NBIM, Norway's sovereign wealth fund and the world's largest single investor"], "note": ""}];

    secPoints:"核心要点", secData:"关键数据", secTake:"💡 关键启示（给 30 岁的你）",
    secQuotes:"金句", secNote:"📖 完整深度笔记",
    btnOrig:"▶ 原片", btnYT:"▶ YouTube", btnApple:"🎧 Apple Podcasts", btnSpotify:"🟢 Spotify", btnTranscript:"📄 文字版",
    tnoteYes:"📄「文字版」为该集官方逐字稿 / Show Notes；其余为各平台收听入口（无直链时跳转该平台站内搜索）。",
    tnoteNo:"暂无官方文字稿；可在节目主页查看完整时间戳与节目大纲，或用上方平台收听。",
    expand:meta=>'▾ 展开详细笔记 <span class="hint">('+meta+')</span>',
    expDetail:"深度详解", expPoints:" 条要点", expTake:" 条启示", expQuotes:" 句金句", expNote:"深度笔记",
    footer:'<b>显示范围</b>：默认仅显示「过去 7 天」的优质单集（按你打开页面的当天日期动态计算，每天自动前移）；点 <b>📅 本周 / 📚 全部</b> 可在本周与历史归档间切换。<br><b>值得一读指数（⭐）</b>：按认知增量、嘉宾稀缺性、长青价值、可执行性、新意与张力五维打分，5 星=必读。<b>Tier</b>：S 必听 / A 重点 / B 机会主义。<br>本看板由「Podcast Tracker Agent」每天早上 8 点自动刷新并发布；评分与片单标准见 PODCAST_STANDARD.md。'
  },
  en:{
    htmlLang:"en", title:"🎙️ Top Podcast Tracker", sub:"Podcast Intel · refreshed daily",
    langBtn:"🌐 中文", note:"Full page in English. Episode analysis is auto-translated from the Chinese source; if a translation is missing it falls back to Chinese.",
    hlHead:"📌 This Week's Highlights",
    week:"📅 This week", all:"📚 All",
    search:"🔍 Search title / guest / keyword…",
    sortWorth:"Sort: worth-reading ↓", sortDate:"Sort: newest ↓",
    allShows:n=>"All shows ("+n+")", catAll:"All",
    statShown:"shown", statWeek:"this week", statShows:"shows", stat5:"⭐5 must-read", statTopics:"topics",
    emptyWeek:"No matching episodes in the past 7 days — tap 📚 All above to browse the archive.",
    emptyAll:"No matching episodes.",
    winWeek:(s,t,u,w,n)=>"🗓 Past 7 days: <b>"+s+" → "+t+"</b> · updated "+u+" · <b>"+w+"</b> this week (of "+n+" total; tap 📚 All for the archive)",
    winAll:(u,n)=>"🗓 Full archive: <b>"+n+"</b> episodes · updated "+u+" · tap 📅 This week to go back",
    secWorth:n=>"Worth reading "+n+"/5 — ", secTldr:"⏱ 30-Second TL;DR", secDetail:"📖 Deep Dive",
    secPoints:"Key Points", secData:"Key Data", secTake:"💡 Takeaways (for your 30s)",
    secQuotes:"Quotes", secNote:"📖 Full Deep-Dive Notes",
    btnOrig:"▶ Original", btnYT:"▶ YouTube", btnApple:"🎧 Apple Podcasts", btnSpotify:"🟢 Spotify", btnTranscript:"📄 Transcript",
    tnoteYes:'“Transcript” links to the episode\'s official transcript / show notes; the other buttons open each platform (in-platform search when there\'s no direct link).',
    tnoteNo:"No official transcript yet; check the show page for full timestamps / outline, or listen via the platforms above.",
    expand:meta=>'▾ Expand notes <span class="hint">('+meta+')</span>',
    expDetail:"deep dive", expPoints:" points", expTake:" takeaways", expQuotes:" quotes", expNote:"full notes",
    footer:'<b>Scope</b>: by default only high-quality episodes from the <b>past 7 days</b> are shown (computed from the date you open the page, rolling forward daily); tap <b>📅 This week / 📚 All</b> to switch between this week and the archive.<br><b>Worth-reading score (⭐)</b>: scored on five axes — insight gain, guest rarity, evergreen value, actionability, novelty/tension; 5 stars = must-read. <b>Tier</b>: S must-listen / A high-signal / B opportunistic.<br>This board is auto-refreshed and published every morning at 8am by the “Podcast Tracker Agent”; scoring & watchlist standards are in PODCAST_STANDARD.md.'
  }
};
let LANG = "zh";
const t = () => I18N[LANG];
const $=s=>document.querySelector(s);
const WIN_DAYS = 7;
function localToday(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function shiftDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const TODAY = localToday();
const WIN_START = shiftDays(TODAY, -(WIN_DAYS-1));
let activeCat="全部", activeShow="全部", query="", sortMode="worth", viewMode="week";

// language-aware field resolver: in EN, use <key>_en if present & non-empty, else fall back to zh
function fld(e,k){if(LANG==="en"){var v=e[k+"_en"];if(v!==undefined&&v!==null&&v!==""&&!(Array.isArray(v)&&v.length===0))return v;}return e[k];}
function stars(n){let h="";for(let i=1;i<=5;i++)h+=i<=n?"★":"<span class='off'>★</span>";return h;}
function dur(m){if(!m)return "";if(m<60)return m+"m";const h=Math.floor(m/60),x=m%60;return h+"h"+(x?x+"m":"");}
function durCN(m){if(!m)return "";if(m<60)return "约"+m+"分钟";const h=Math.floor(m/60),x=m%60;return "约"+h+"小时"+(x?x+"分":"");}
function durLong(m){if(!m)return "";if(LANG==="en"){if(m<60)return m+" min";const h=Math.floor(m/60),x=m%60;return h+"h"+(x?" "+x+"m":"");}return durCN(m);}
function catLabel(c){return c===ALLCAT?t().catAll:(CAT_I18N[c]||c);}
function esc(t){return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inlineMd(t){return esc(t).replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function mdToHtml(md){
  const lines=md.split("\n"); let h="",inList=false;
  const cl=()=>{if(inList){h+="</ul>";inList=false;}};
  for(let raw of lines){const l=raw.trim();
    if(!l){cl();continue;}
    if(l==="---"){cl();h+="<hr>";continue;}
    if(l.startsWith("### ")){cl();h+="<h3>"+inlineMd(l.slice(4))+"</h3>";continue;}
    if(l.startsWith("## ")){cl();h+="<h2>"+inlineMd(l.slice(3))+"</h2>";continue;}
    if(l.startsWith("# ")){cl();h+="<h1>"+inlineMd(l.slice(2))+"</h1>";continue;}
    if(l.startsWith("- ")){if(!inList){h+="<ul>";inList=true;}h+="<li>"+inlineMd(l.slice(2))+"</li>";continue;}
    cl();h+="<p>"+inlineMd(l)+"</p>";}
  cl();return h;
}
function listenLinks(e){
  const d=t();
  const o=e.originalUrl||"";
  const tq=encodeURIComponent((e.title||"")+" "+(e.podcast||""));
  const isY=/youtube\.com|youtu\.be/.test(o), isA=/podcasts\.apple/.test(o), isS=/open\.spotify|spotify\.com/.test(o);
  const matched=isY||isA||isS;
  let b=[];
  if(!matched&&o) b.push('<a class="btn" href="'+o+'" target="_blank" rel="noopener">'+d.btnOrig+'</a>');
  b.push('<a class="btn yt" href="'+(isY?o:'https://www.youtube.com/results?search_query='+tq)+'" target="_blank" rel="noopener">'+d.btnYT+'</a>');
  b.push('<a class="btn" href="'+(isA?o:'https://podcasts.apple.com/us/search?term='+tq)+'" target="_blank" rel="noopener">'+d.btnApple+'</a>');
  b.push('<a class="btn" href="'+(isS?o:'https://open.spotify.com/search/'+tq)+'" target="_blank" rel="noopener">'+d.btnSpotify+'</a>');
  b.push(e.transcriptUrl?'<a class="btn primary" href="'+e.transcriptUrl+'" target="_blank" rel="noopener">'+d.btnTranscript+'</a>':'<button class="btn" disabled>'+d.btnTranscript+'</button>');
  const note='<div class="tnote">'+(e.transcriptUrl?d.tnoteYes:d.tnoteNo)+'</div>';
  return '<div class="mlinks">'+b.join("")+'</div>'+note;
}
function structured(e){
  const d=t(); let h="";
  h+='<div class="worth"><span class="st">'+stars(e.worthScore)+'</span> '+d.secWorth(e.worthScore)+esc(fld(e,'worthReason'))+'</div>';
  h+='<div class="msec blue"><h4>'+d.secTldr+'</h4><div class="tldrbox">'+esc(fld(e,'tldr'))+'</div></div>';
  var det=fld(e,'detail');
  if(det){h+='<div class="msec blue"><h4>'+d.secDetail+'</h4>'+det.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(p=>'<p style="font-size:13.5px;color:#2b3850;margin:9px 0;line-height:1.72">'+inlineMd(p)+'</p>').join("")+'</div>';}
  var pts=fld(e,'points');
  if(pts&&pts.length){h+='<div class="msec blue"><h4>'+d.secPoints+'</h4><ul>'+pts.map(p=>"<li>"+inlineMd(p)+"</li>").join("")+'</ul></div>';}
  var dta=fld(e,'data');
  if(dta&&dta.length){h+='<div class="msec blue"><h4>'+d.secData+'</h4><ul>'+dta.map(p=>"<li>"+inlineMd(p)+"</li>").join("")+'</ul></div>';}
  var tk=fld(e,'takeaways');
  if(tk&&tk.length){h+='<div class="msec green"><h4>'+d.secTake+'</h4><div class="greenbox"><ul>'+tk.map(p=>"<li>"+inlineMd(p)+"</li>").join("")+'</ul></div></div>';}
  var qt=fld(e,'quotes');
  if(qt&&qt.length){h+='<div class="msec gold"><h4>'+d.secQuotes+'</h4>'+qt.map(q=>'<div class="qbox">'+inlineMd(q)+'</div>').join("")+'</div>';}
  if(e.note){h+='<div class="msec note"><h4>'+d.secNote+'</h4><div class="md">'+mdToHtml(e.note)+'</div></div>';}
  return h;
}
function openModal(id){
  const e=EPISODES.find(x=>x.id===id);
  $("#mtitle").innerHTML='<span class="pod">'+e.podcast+'</span> · '+e.date+(e.durationMin?" · "+durLong(e.durationMin):"")+' · <span class="stars" style="margin:0">'+stars(e.worthScore)+'</span> · Tier '+e.tier;
  $("#mbody").innerHTML='<h2 style="font-size:18px;margin-bottom:5px;line-height:1.4">'+esc(e.title)+'</h2><div class="gl">🎙 '+esc(fld(e,'guest'))+'</div>'+listenLinks(e)+structured(e);
  $("#overlay").classList.add("open");document.body.style.overflow="hidden";$(".modal").scrollTop=0;
}
function closeModal(){$("#overlay").classList.remove("open");document.body.style.overflow="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

function toggleSort(){sortMode=sortMode==="worth"?"date":"worth";$("#sortBtn").textContent=sortMode==="worth"?t().sortWorth:t().sortDate;render();}
function toggleView(){viewMode=viewMode==="week"?"all":"week";$("#viewBtn").textContent=viewMode==="week"?t().week:t().all;render();}
function toggleLang(){LANG=LANG==="zh"?"en":"zh";try{localStorage.setItem("pt_lang",LANG);}catch(e){}applyI18n();render();}

function expHint(e){
  const d=t();
  const meta=(fld(e,'detail')?d.expDetail+" · ":"")+((fld(e,'points')||[]).length)+d.expPoints+" · "+((fld(e,'takeaways')||[]).length)+d.expTake+" · "+((fld(e,'quotes')||[]).length)+d.expQuotes+(e.note?" · "+d.expNote:"");
  return d.expand(meta);
}

function hlList(){
  const en = (LANG==="en" && META.highlights_en && META.highlights_en.length);
  const arr = en ? META.highlights_en : (META.highlights||[]);
  return arr.map(h=>{
    var i=h.indexOf("："), sep="：";
    if(i<0){i=h.indexOf(": "); sep=": ";}
    return "<li>"+(i>0?"<b>"+inlineMd(h.slice(0,i))+"</b>"+sep+inlineMd(h.slice(i+sep.length)):inlineMd(h))+"</li>";
  }).join("");
}

function applyI18n(){
  const d=t();
  document.documentElement.lang=d.htmlLang;
  document.title=LANG==="zh"?"顶尖播客追踪":"Top Podcast Tracker";
  $("#brandTitle").textContent=d.title;
  $("#brandSub").textContent=d.sub;
  $("#langBtn").textContent=d.langBtn;
  $("#hlHead").textContent=d.hlHead;
  $("#q").placeholder=d.search;
  $("#viewBtn").textContent=viewMode==="week"?d.week:d.all;
  $("#sortBtn").textContent=sortMode==="worth"?d.sortWorth:d.sortDate;
  $("#footer").innerHTML=d.footer;
  $("#langnote").innerHTML=d.note||"";
  $("#langnote").style.display=d.note?"block":"none";
  $("#hlList").innerHTML=hlList();
}

function render(){
  const d=t();
  const CN=(LANG==="en"&&META.checkNote_en)?META.checkNote_en:META.checkNote;
  const cats=["全部",...new Set(EPISODES.map(e=>e.category))];
  $("#catFilters").innerHTML=cats.map(c=>{
    const col=CATCOLORS[c]?'<span class="dot" style="background:'+CATCOLORS[c]+'"></span>':"";
    return '<button class="fbtn '+(c===activeCat?'on':'')+'" onclick="setCat(\''+c+'\')">'+col+catLabel(c)+'</button>';}).join("");
  const shows=[...new Set(EPISODES.map(e=>e.podcast))].sort();
  $("#showSel").innerHTML='<option value="全部">'+d.allShows(shows.length)+'</option>'+shows.map(s=>'<option value="'+s+'" '+(s===activeShow?'selected':'')+'>'+s+'</option>').join("");

  let list=EPISODES.filter(e=>(activeCat==="全部"||e.category===activeCat)&&(activeShow==="全部"||e.podcast===activeShow));
  if(viewMode==="week") list=list.filter(e=>e.date>=WIN_START);
  if(query){const q=query.toLowerCase();list=list.filter(e=>(e.title+e.podcast+e.guest+e.host+e.tldr+e.category+(e.points||[]).join("")+(e.detail||"")+(e.tldr_en||"")+(e.detail_en||"")+(e.guest_en||"")+(e.points_en||[]).join("")).toLowerCase().includes(q));}
  if(sortMode==="worth")list.sort((a,b)=>b.worthScore-a.worthScore||b.date.localeCompare(a.date));
  else list.sort((a,b)=>b.date.localeCompare(a.date)||b.worthScore-a.worthScore);

  $("#grid").innerHTML=list.map(e=>`
    <div class="card" onclick="openModal('${e.id}')">
      <div class="row">
        <span class="tier ${e.tier}">${e.tier}</span>
        <span class="pod">${e.podcast}</span>
        <span class="meta-s">${e.date}${e.durationMin?" · "+dur(e.durationMin):""}</span>
        <span class="stars" title="${esc(d.secWorth(e.worthScore))}">${stars(e.worthScore)}</span>
      </div>
      <h3>${esc(e.title)}</h3>
      <div class="gl">🎙 ${esc(fld(e,'guest'))}</div>
      <div class="tldr">${esc(fld(e,'tldr'))}</div>
      <div class="exp">${expHint(e)}</div>
      <div class="acts" onclick="event.stopPropagation()">
        <a class="btn" href="${e.originalUrl}" target="_blank" rel="noopener">${d.btnOrig}</a>
        ${e.transcriptUrl?`<a class="btn" href="${e.transcriptUrl}" target="_blank" rel="noopener">${d.btnTranscript}</a>`:`<button class="btn" disabled>${d.btnTranscript}</button>`}
      </div>
    </div>`).join("");

  const wk=EPISODES.filter(e=>e.date>=WIN_START).length;
  $("#empty").style.display=list.length?"none":"block";
  $("#empty").textContent=viewMode==="week"?d.emptyWeek:d.emptyAll;
  const hb=CN?' · <span style="color:#2f5bea">🛰 '+inlineMd(CN)+'</span>':'';
  if(viewMode==="week"){
    $("#winbar").innerHTML=d.winWeek(WIN_START,TODAY,META.lastUpdated,wk,EPISODES.length)+hb;
  }else{
    $("#winbar").innerHTML=d.winAll(META.lastUpdated,EPISODES.length)+hb;
  }
  const shownShows=new Set(list.map(e=>e.podcast)).size;
  const s5=list.filter(e=>e.worthScore>=5).length;
  const ccount=new Set(list.map(e=>e.category)).size;
  $("#stats").innerHTML=
    '<div class="stat"><b>'+list.length+'</b>'+(viewMode==="week"?d.statWeek:d.statShown)+'</div>'+
    '<div class="stat"><b>'+shownShows+'</b>'+d.statShows+'</div>'+
    '<div class="stat"><b>'+s5+'</b>'+d.stat5+'</div>'+
    '<div class="stat"><b>'+ccount+'</b>'+d.statTopics+'</div>';
}
function setCat(c){activeCat=c;render();}
$("#showSel").addEventListener("change",e=>{activeShow=e.target.value;render();});
$("#q").addEventListener("input",e=>{query=e.target.value;render();});

try{const sv=localStorage.getItem("pt_lang");if(sv==="en"||sv==="zh")LANG=sv;}catch(e){}
applyI18n();
render();
</script>
</body>
</html>
